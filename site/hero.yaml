# The hero of the home page (F134, F158; ADR 021 decision 4 as amended): one
# fixed headline and one fixed subtext, the owner's words (round 2 of Issue
# #462, 2026-11-10), written into the HTML by the build and never changed by
# a script: the page with and without scripts shows the same text, also
# after a reload.
#
# Since F158 (Issue #462) the file also holds the hero image: four of the
# Part A illustrations, each identified by the name of its file under
# site/assets/hero/ (registered in site/assets/provenance.yaml), with the
# course whose atlas master it is derived from and its alternative text. The
# page carries the default image in its HTML; site/learner/hero.js picks one
# at random per visit, or the one the `hero-image` parameter names.
#
# `variants` is an editorial reference: the three headlines and eight
# subtexts of F134 (the owner's copy of Issue #339, 2026-10-30), no longer
# shown. Nothing reads them but the validation; they are never written on a
# page, used by a script, or moved to another page.
#
# Read and validated by pbc.authoring.home: plain text, the images below,
# the variants as plain text, no other field. Never write this copy on a
# page by hand.
headline: >-
  The universe has no obligation to fit the limits of human intelligence.
subtext: >-
  We explore physics by building models and testing them against theory,
  real measurements, and formal proofs. Then we investigate how AI agents
  might push the boundaries of scientific understanding.
images:
  default: double-pendulum
  set:
    - id: double-pendulum
      sequence: mechanics
      alt: >-
        Illustration: the swinging paths of two double pendulums that start
        almost together and soon move apart.
    - id: vortex-street
      sequence: fluids
      alt: >-
        Illustration: a flow past a cylinder, with a trail of alternating
        swirls behind it.
    - id: hot-cold-gas
      sequence: thermodynamics
      alt: >-
        Illustration: a bar of gas from hot to cold, with the spread of
        molecular speeds at three places along it.
    - id: exoplanet-transit
      sequence: astrophysics
      alt: >-
        Illustration: a planet passing in front of its star, and the dip it
        makes in the star's light.
variants:
  - id: "1"
    text: >-
      The universe has no obligation to fit the limits of human
      intelligence.
    subtexts:
      - id: a
        text: >-
          Physics has always challenged what we believed possible. AI may
          help us challenge the limits of what we can understand.
      - id: b
        text: >-
          What if the greatest discoveries in physics are not waiting for
          better answers, but for entirely new ways of thinking?
      - id: c
        text: >-
          The boundaries of human understanding are not necessarily the
          boundaries of what can be discovered. We explore that possibility
          through physics, computation, and AI.
  - id: "2"
    text: >-
      We are building the tools that may reveal what we cannot yet imagine.
    subtexts:
      - id: a
        text: >-
          What happens when scientific instruments become intelligent enough
          to help design the next experiment? We explore that future through
          physics and AI.
      - id: b
        text: >-
          From a few lines of Python to AI-driven scientific discovery, we
          explore how increasingly powerful tools can transform our
          understanding of nature.
      - id: c
        text: >-
          Science advances when new tools make the invisible observable and
          the unimaginable testable. Artificial intelligence may be the next
          great extension of that tradition.
  - id: "3"
    text: >-
      What seems beyond understanding today may become tomorrow's first
      experiment.
    subtexts:
      - id: a
        text: >-
          From Newton's mechanics to quantum theory, progress has repeatedly
          transformed what we consider possible. The next transformation may
          come from the partnership between physics and AI.
      - id: b
        text: >-
          We do not know what physics will look like in a hundred years. But
          we can begin building the models, experiments, and intelligent
          tools that may help shape its future.
