# The reference curriculum: the planned structure of the site (ADR 013).
#
# One line per slot, in teaching order within its home. A slot's home is a
# course (`course`), a method path (`path`, with its `position`), or, for the
# one Lean slot, the strand `lean`. This file holds nothing that a lesson's
# front matter holds; a lesson says which slot it fills with `lesson.slot`.
# Changing this file changes the curriculum and is a reviewed change; the
# counts are pinned by tests/unit/test_curriculum.py and docs/roadmap.md
# ("Slot mapping").

courses:
  - {id: mechanics, title: "Classical mechanics"}
  - {id: thermodynamics, title: "Thermodynamics and statistical physics"}
  - {id: waves, title: "Waves and optics"}
  - {id: electromagnetism, title: "Electromagnetism"}
  - {id: fluids, title: "Fluid dynamics"}
  - {id: quantum, title: "Quantum physics"}
  - {id: astrophysics, title: "Astrophysics, cosmology, and relativity"}
  - {id: materials, title: "Condensed matter and materials physics"}

paths:
  - {id: reasoning, title: "Physics reasoning and scientific agents"}
  - {id: law-discovery, title: "Scientific law discovery"}
  - {id: benchmarking, title: "Physics agent benchmarking"}
  - {id: autonomous-research, title: "Autonomous scientific research"}

