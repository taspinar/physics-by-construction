# The reference register (ADR 009, docs/authoring.md "References"). Every
# curated external link a lesson renders is an entry here; a lesson names the
# key in a "Go deeper" block and the build renders the link. Fields are
# described in docs/authoring.md. `reserved` is the one optional field: a
# reason for an entry no lesson uses yet.
references:
  - key: euler-local-global-error
    concept: Local and global error of explicit Euler
    url: https://personal.math.ubc.ca/~israel/m215/euler2/euler2.html
    title: Error Analysis of the Euler Method
    author: University of British Columbia, mathematics course notes
    section: local error, global error, and the case of a right-hand side that depends on x only
    role: derivation
    statement: >-
      One step of explicit Euler has an error of size h squared (Taylor's
      theorem), the global error after a fixed interval is of size h, and the
      global error is not simply the sum of the local errors. For a right-hand
      side that depends on x only, Euler's method is a Riemann sum with a
      global error bounded by K (x - x0) h / 2. Opened and read on 2026-10-09;
      the notation (h for the step, O(h) for first order) matches the lesson's
      first-order claim and its time-only acceleration.
    alternatives: >-
      Lecture slides of Trinity College Dublin (MATH 11404, Euler method and
      errors): the PDF text could not be extracted, so its passage was not
      read and it was not chosen. Course notes of NC State (MA 427) and the
      University of Vermont (MATH 337) came up in the search and were not
      opened. The UBC page was chosen because it adds what the lesson does not
      contain: why the sum of local errors still gives a first-order global
      error although earlier errors change later steps, and the bound for the
      time-only case, in a short page that needs no sign-in.
    lessons: [kinematics]
    last-checked: 2026-10-09
    licence: No licence stated on the page; linked, not copied or rehosted.
  - key: brorson-symplectic-euler
    concept: >-
      Symplectic Euler applied to the harmonic oscillator: phase-space area
      preservation, a bounded oscillating energy error, and the linear
      stability condition that the step times the angular frequency lies
      strictly between zero and two, where both growth factors have modulus one
    url: https://math.libretexts.org/Bookshelves/Differential_Equations/Numerically_Solving_Ordinary_Differential_Equations_(Brorson)/07%3A_Symplectic_integrators
    title: "Symplectic integrators (chapter 7 of Numerically Solving Ordinary Differential Equations)"
    author: Stuart Brorson, LibreTexts Mathematics
    section: 7.2 Symplectic Euler and 7.3 Example, the simple harmonic oscillator; 7.4 and 7.5 on phase-space volume and Liouville's theorem
    role: derivation
    statement: >-
      Symplectic Euler updates the velocity first, then moves the position with
      the new velocity, which is the ordering of the lesson (the chapter also
      writes the position-first ordering separately, which is not the lesson's
      method). For the simple harmonic oscillator the chapter finds a growth
      factor of modulus one when the step times the angular frequency is below
      two (stated after its equation 7.11), the lesson's stability limit for
      symplectic Euler, and relates the method to the preservation of
      phase-space volume, Liouville's theorem, and the symplectic condition on
      the step matrix. The inequality is strict: at a product of exactly two
      the growth factor is a repeated minus one and the state can grow
      linearly, which the lesson states. The chapter sometimes says that
      symplectic Euler conserves energy; it does not conserve the energy of
      the oscillator at every step, only bounds its oscillation, as the
      chapter's own figure 7.2 shows and as the lesson says. The chapter is
      about symplectic Euler only and does not derive the modified energy,
      which the lesson does. First selected by a drafting agent from a summary
      of the page; the project owner opened the page and checked the equations
      and these statements against it on 2026-10-10.
    alternatives: >-
      Course slides of the University of Lethbridge (symplectic integrators)
      and the Kansas State course page (Class 6, numerical ODE integrators):
      the slides were a PDF whose text could not be extracted, so they were
      not read and not chosen; the Kansas State page writes the same
      velocity-first rule but gives no derivation of the energy behaviour.
      Hairer, Lubich, and Wanner, Geometric Numerical Integration (Springer),
      was considered because the previous lesson text named it: its public
      record at the University of Geneva archive offers an unspecified extract
      under all rights reserved, without a section the reader can be sent to,
      so it was not kept. The Brorson chapter was chosen because it adds the
      phase-space-volume argument and the oscillator example in a short
      public page.
    lessons: [numerical-integrators]
    last-checked: 2026-10-10
    licence: CC BY-SA 3.0 on the LibreTexts page; linked, not copied or rehosted.
  - key: nmm-verlet-semi-implicit
    concept: >-
      Velocity Verlet derived by composing a half step of velocity-first
      symplectic Euler with a half step of its position-first counterpart,
      which gives the second-order kick-drift-kick integrator
    url: https://fab.cba.mit.edu/classes/864.23/people/Erik/verlet-integration
    title: Verlet Integration (Numerical Methods for Mechanics, 2023)
    author: MIT course page "NMM 2023" (author not named on the page)
    section: Derivation, "As a Variation of Semi-Implicit Euler"; Properties, "Symplectic Properties"
    role: derivation
    statement: >-
      The page writes velocity Verlet as a half kick, a drift with the half-step
      velocity, and a second half kick with the force at the new position, which
      is the lesson's update for a force that depends on position only. It
      writes semi-implicit Euler in both orderings, velocity first and position
      first, and obtains velocity Verlet by applying the two in sequence with
      half the time step each; two half steps in the same ordering would not
      give it. It states that both are symplectic and that Verlet is time
      reversible and nearly preserves the energy. The page does not treat a
      force that depends on the velocity, so the predicted-velocity evaluation
      of the lesson's implementation is not covered by it. Its wording on the
      order (local and global) is loose, and the lesson's own derivation, not
      the page, is the reference for the order. First selected by a drafting
      agent from a summary of the page; the project owner opened the page and
      checked the derivation and these statements against it on 2026-10-10.
    alternatives: >-
      Wikipedia, "Verlet integration" (section Velocity Verlet), which gives the
      same algorithm and says explicitly that the method assumes an acceleration
      that depends on position only, but has no derivation from symplectic
      Euler; the Helsinki atomistic-simulation lecture notes (lecture 4), a PDF
      whose text could not be extracted, so not read and not chosen. The MIT page
      was chosen because it adds the link between the first-order and the
      second-order symplectic method that the lesson does not contain.
    lessons: [numerical-integrators]
    last-checked: 2026-10-10
    licence: No licence stated on the page; linked, not copied or rehosted.
  - key: wikipedia-pendulum-period
    concept: >-
      The exact period of the pendulum released from rest as a complete
      elliptic integral of the first kind, and its power series in the amplitude
    url: https://en.wikipedia.org/wiki/Pendulum_(mechanics)#Arbitrary-amplitude_period
    title: Pendulum (mechanics)
    author: Wikipedia contributors
    section: Arbitrary-amplitude period, with "Power series solution for the elliptic integral"
    role: derivation
    statement: >-
      The page inverts the energy equation to dt/dtheta proportional to
      1/sqrt(cos theta - cos theta0), integrates over a quarter cycle, notes
      that the integral is improper but convergent for amplitudes below pi and
      diverges as the amplitude approaches pi, and writes the result as
      T = 4 sqrt(l/g) F(pi/2, sin(theta0/2)) with the substitution
      sin u = sin(theta/2) / sin(theta0/2), the lesson's substitution written
      inversely; the modulus is k = sin(theta0/2), as in the lesson. Its power
      series is 1 + theta0^2/16 + 11 theta0^4/3072 + ..., the two terms the
      lesson derives and uses. Retrieved as raw HTML with curl and read as text
      by the drafting agent on 2026-10-10; no person has yet compared it with
      the lesson.
    alternatives: >-
      DLMF section 19.2 (fetched and read as text): it defines the elliptic
      integrals and the modulus convention but has no pendulum, so it adds
      nothing the lesson lacks. A page of Fitzpatrick's Newtonian dynamics
      notes (University of Texas) returned no pendulum text. Wikipedia was
      chosen because it has the whole chain, from the energy equation to the
      series, in one public page, with a figure of the truncation error of the
      series.
    lessons: [energy-conservation]
    last-checked: 2026-10-10
    licence: Creative Commons Attribution-ShareAlike (stated on the page); linked, not copied or rehosted.
  - key: scipy-ellipk
    concept: The parameter convention of the complete elliptic integral of the first kind in SciPy
    url: https://docs.scipy.org/doc/scipy/reference/generated/scipy.special.ellipk.html
    title: scipy.special.ellipk
    author: SciPy documentation
    section: ellipk, definition and Notes on the parameterization
    role: api
    statement: >-
      The function is defined as K(m), the integral from 0 to pi/2 of
      [1 - m sin(t)^2]^(-1/2) dt, with m the parameter; the Notes warn that
      other parameterizations use the modulus k with k^2 = m, so the
      convention must be checked. This is the lesson's K(m) with m = k^2, and
      the program passes k squared. Retrieved as raw HTML with curl and read as
      text by the drafting agent on 2026-10-10 (version 1.18.0 of the manual);
      no person has yet compared it with the lesson.
    alternatives: >-
      DLMF section 19.2, which defines the integral with the modulus k and not
      the parameter m; it was read and not chosen because the question is
      what the function the program calls expects. API documentation does not
      replace the derivation, which the lesson contains.
    lessons: [energy-conservation]
    last-checked: 2026-10-10
    licence: BSD licence of SciPy for the documentation; linked, not copied or rehosted.
