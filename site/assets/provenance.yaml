# The provenance of every image under site/assets/ (ADR 018 decision 2, ADR
# 021 decision 2; docs/atelier.md, "The three asset classes"). A path,
# relative to this directory, maps to one of three entries:
#
# - an authored SVG: author, licence, and an optional source;
# - an SVG generated at build time: the module that writes it;
# - a derived raster (WebP, or PNG where a plan records why): its origin (a
#   script of the repository, an author, or an image model with its prompt
#   and date), a licence, the file name of its master, and the master's
#   SHA-256; optionally a date and a source.
#
# The asset-source check (tests/lessons) fails on an image here without its
# entry and on an entry without its file; the committed-artifact check admits
# a committed SVG here only with an author and a licence, and a WebP or PNG
# only with a complete raster entry. Masters are not committed; the scripts
# are in tools/illustrations/, whose regenerate.py compares a master it
# renders with the hash recorded here, on demand.
