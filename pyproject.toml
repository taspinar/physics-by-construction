[project]
name = "pbc"
version = "0.1.0"
description = "Reusable lesson code for Physics by Construction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.5.4",
    "scipy>=1.18",
    # pbc.authoring reads lesson front matter when a page is built
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The live client of pbc.agents for the default provider (ADR 004). Only a
# learner who runs an agent lesson with their own key installs it; the site
# build and CI never do.
openai = ["openai>=3.46.0"]
# The Autonomous Physics Lab (docs/products.md, question 19): what the
# product's optional routes need beyond the default environment, one group
# per product. Its live agent route uses the provider SDK; the live adapter
# of a device (F140) adds its driver here. Its simulated and recorded routes
# and its local interface need nothing beyond the default environment. Only
# a learner who runs an optional route installs it; the site build and CI
# never do.
physics-lab = ["openai>=3.46.0"]

[project.urls]
Homepage = "https://taspinar.github.io/physics-by-construction/"
Repository = "https://github.com/taspinar/physics-by-construction"

# Everything needed to verify and build the site. `uv sync` installs this
# group by default; exact versions and hashes are in uv.lock.
[dependency-groups]
dev = [
    # Quality
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    # Site generator (ADR 001) and the Jupyter kernel it executes pages with
    "quarto-cli>=1.11.9",
    "ipykernel>=7.4",
    "nbclient>=0.11",
    "nbformat>=5.11",
    # Built-site checks: headless browser and the axe-core accessibility scan
    "playwright>=1.64.1",
    "axe-playwright-python>=0.1.8",
]

[build-system]
# uv.lock does not cover build requirements, so the backend is pinned here.
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbc"]

[tool.ruff]
line-length = 88
# Fetched Lean packages contain Python scripts that are not ours. The owner's
# illustration scripts are committed as delivered (ADR 021 decision 2;
# tools/illustrations/README.md) and are neither run nor imported by the site.
extend-exclude = [
  "lean/.lake",
  "tools/illustrations/double_pendulum_atlas.py",
  "tools/illustrations/generate_fluid_dynamics.py",
  "tools/illustrations/generate_wigner_cat.py",
  "tools/illustrations/render_hot_cold.py",
  "tools/illustrations/render_part_b.py",
  "tools/illustrations/render_phonons.py",
  "tools/illustrations/render_solenoid.py",
  "tools/illustrations/render_waves.py",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
markers = [
    "same_machine: compares bytes with the built site, so it runs on the machine that built it (ADR 012)",
]
# Shared test helpers live in tests/support.
pythonpath = ["tests"]
