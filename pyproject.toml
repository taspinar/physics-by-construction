[project]
name = "pbc"
version = "0.1.0"
description = "Reusable lesson code for Physics by Construction"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11",
    "numpy>=2.5",
    "scipy>=1.18",
    # pbc.authoring reads lesson front matter when a page is built
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The live client of pbc.agents for the default provider (ADR 004). Only a
# learner who runs an agent lesson with their own key installs it; the site
# build and CI never do.
openai = ["openai>=2.0"]

[project.urls]
Homepage = "https://taspinar.github.io/physics-by-construction/"
Repository = "https://github.com/taspinar/physics-by-construction"

# Everything needed to verify and build the site. `uv sync` installs this
# group by default; exact versions and hashes are in uv.lock.
[dependency-groups]
dev = [
    # Quality
    "pytest>=9.1",
    "ruff>=0.16",
    # Site generator (ADR 001) and the Jupyter kernel it executes pages with
    "quarto-cli>=1.10",
    "ipykernel>=7.4",
    "nbclient>=0.11",
    "nbformat>=5.11",
    # Built-site checks: headless browser and the axe-core accessibility scan
    "playwright>=1.63",
    "axe-playwright-python>=0.1.8",
]

[build-system]
# uv.lock does not cover build requirements, so the backend is pinned here.
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pbc"]

[tool.ruff]
line-length = 88
# Fetched Lean packages contain Python scripts that are not ours.
extend-exclude = ["lean/.lake"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
# Shared test helpers live in tests/support.
pythonpath = ["tests"]
