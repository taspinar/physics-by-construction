# Required verification checks for ./scripts/verify.sh.
#
# Format: one check per line.
#
#   <name>: <command>
#
# - <name> uses lowercase letters, digits, and '-', and must be unique.
# - <command> runs with 'bash -eo pipefail' from the repository root, so a
#   failing step in a pipeline or command sequence fails the check.
# - The first word of <command> is the required tool. Verification fails when
#   it is missing or not executable, and when the command exits non-zero.
# - Every listed check is required. Remove a check instead of making it optional.
# - A check may name a group in square brackets after its name:
#   '<name> [<group>]: <command>'. './scripts/verify.sh --only <group>' runs
#   the checks of that group, for a CI that spreads the same checks over
#   parallel jobs. A check without a group belongs to the group 'default';
#   such a CI has to run that group too. A partial run verifies nothing:
#   only a run without --only does.
#
# The self-tests of the workflow scripts are not listed here but in
# scripts/verify-workflow.conf; locally they run only when a workflow file
# changed, in CI always (ADR 005).
#
# The entry 'targeted:' is reserved: it names the groups the targeted run
# (./scripts/verify.sh --targeted) performs.
#
# Order matters only where a comment says so.

# Supported-machine contract. Listed first, so that a missing prerequisite is
# reported with a fix hint before a later check fails on it.
preflight: ./scripts/preflight.sh
# The preflight itself: it reports each missing prerequisite, and it is the
# first check in this file.
preflight-test: ./tests/preflight-test.sh

# The targeted run (ADR 017 decision 7, F119): the tier an ordinary change is
# verified with before a pull request. It computes the selection CI will make
# from the base of the latest successful run on main and runs the checks of
# these groups, which need no site build: the supported-machine contract, the
# Python sources, the lesson sources, the datasets, the documentation and
# workflow structure, and the per-lesson check lesson-pages. It performs no
# site build, no determinism build, and no built-site check. A change the
# selection cannot bound to lessons needs the full run; a change to what
# other pages display of a lesson needs ./scripts/verify.sh --base
# (docs/development.md, "Verification").
targeted: default,code

# Python sources.
lint [code]: uv run --locked ruff check .
format [code]: uv run --locked ruff format --check .
unit-tests [code]: uv run --locked pytest tests/unit
# The starters of the Part B products (ADR 022 decision 5, F138): each
# starter's tests against the current tree, and at its pinned commit, taken
# from the repository's own history without a fetch (the CI job of the group
# code checks out the full history); a `pending` pin is skipped and the skip
# named. It starts no product and contacts no model, instrument, or network
# (tests/unit/test_products_boundary.py).
starters [code]: uv run --locked python -m pbc.products.starters

# Datasets (ADR 007): every card is valid; every committed sample has a card
# that permits it, is under the caps, matches its checksum, and has a parsing
# test. Reads the repository only; never contacts a portal.
dataset-checks: uv run --locked python -m pbc.data.check

# Lean: every module builds against Mathlib from its build cache, without
# 'sorry' and without project axioms.
lean-build [build]: ./scripts/check-lean.sh

# Each check above and below fails on an input that violates it. After
# lean-build, because the Lean cases reuse the Mathlib it fetched. Three
# checks, each in a group of its own, so that a CI can run them side by side
# with the preparation each part needs (docs/verification-audit.md, "Division
# into independent parts"): the Quarto builds of fixture sites, the tests
# that need the browser, and every other file, which check-tests-other runs
# by leaving out the files the first two name, so a new file runs there.
# tests/integration/test_site_check_division.py proves by collection that the
# three run every test of tests/integration exactly once.
check-tests-quarto [integration-quarto]: uv run --locked pytest tests/integration/test_store.py tests/integration/test_context.py tests/integration/test_home_build.py tests/integration/test_site_build.py
check-tests-browser [integration-browser]: uv run --locked pytest tests/integration/test_site_checks.py tests/integration/test_lesson_template.py tests/integration/test_setup_page.py tests/integration/test_browser_check.py tests/integration/test_site_check_division.py
check-tests-other [integration-other]: uv run --locked pytest tests/integration --ignore=tests/integration/test_store.py --ignore=tests/integration/test_context.py --ignore=tests/integration/test_home_build.py --ignore=tests/integration/test_site_build.py --ignore=tests/integration/test_site_checks.py --ignore=tests/integration/test_lesson_template.py --ignore=tests/integration/test_setup_page.py --ignore=tests/integration/test_browser_check.py --ignore=tests/integration/test_site_check_division.py

# Lesson sources: front matter, required sections, the learning path they
# form, displayed code that is neither executed nor marked "not verified",
# figures, committed artifacts.
lesson-checks [code]: uv run --locked pytest tests/lessons
# The single-page render of the lessons the targeted run selected, in a clone
# of the working tree, with the Lean build for changed proofs: the per-lesson
# check of the targeted tier. In a run that builds the site (the full run and
# a run with --base) it has nothing to do, because the build, the determinism
# check, and the reproduction cover every lesson, and it says so.
lesson-pages [code]: ./scripts/check-lesson-pages.sh

# Site: build, build again for determinism, and check the built files. The
# checks after site-build read its output.
#
# determinism and site-checks-reproduction compare bytes with that output.
# Numerical output can differ in the last digit between processors, so they
# are in the group of site-build and run on the machine that built the site
# (ADR 012).
#
# The other checks of the built site (pytest on tests/e2e) are three checks,
# each in a group of its own, so that a CI can run them side by side. With
# site-checks-reproduction they run every test of tests/e2e exactly once;
# tests/integration proves that by collection. tests/e2e/shards.json says
# which part of test_built_site.py holds what; site-checks-other runs every
# file it does not name.
site-build [build]: ./scripts/build-site.sh
determinism [build]: ./scripts/check-determinism.sh
# site-checks-reproduction passes without a test only where an empty
# selection is a valid state: a selective run that executes no lesson, such as
# a change to the documentation only, has no reproduction to run, and
# tests/e2e/conftest.py turns pytest's status 5 (no tests collected) into a
# pass for that run alone and says so. Every other run that selects no test
# fails (issue 200).
site-checks-reproduction [build]: uv run --locked pytest tests/e2e -m same_machine
site-checks-pages-1 [e2e-pages-1]: uv run --locked pytest tests/e2e/test_built_site.py --shard 1/2
site-checks-pages-2 [e2e-pages-2]: uv run --locked pytest tests/e2e/test_built_site.py --shard 2/2
site-checks-other [e2e-other]: uv run --locked pytest tests/e2e --ignore=tests/e2e/test_built_site.py -m "not same_machine"

# The groups run at the same time (Issue #430): ./scripts/verify.sh starts
# every group of the run as soon as the checks its entry
# 'after [<group>]: <check>[,<check>...]' names have finished, at most
# VERIFY_JOBS at a time (docs/development.md, "Verification"). A group waits
# where it reads what a check of another group writes. The chain of the group
# build (lean-build, site-build, determinism, the reproduction) is the
# longest; default and integration-quarto run beside all of it.
#
# site-build writes into site/ while it renders (the pages next to their
# sources, *.quarto_ipynb, the *_files directories, site_libs, _freeze, then
# _site). These groups read that directory and so start after it:
# - the three e2e groups check site/_site, which site-build makes;
# - code: tests/unit/test_introductions.py copies site/, whose files the
#   render moves while it runs;
# - integration-browser: tests/integration/test_lesson_template.py copies
#   site/, its _freeze included, and builds the copy;
# - integration-other: tests/integration/test_agent_replay.py and
#   test_review_replay.py list the files of a lesson directory, and
#   tests/integration/test_lean_check.py links the packages of lean/.lake,
#   which lean-build fetches.
# determinism and the reproduction write only under the temporary directory,
# so the e2e groups and the others run beside them.
after [e2e-pages-1]: site-build
after [e2e-pages-2]: site-build
after [e2e-other]: site-build
after [code]: site-build
after [integration-browser]: site-build
after [integration-other]: lean-build,site-build

# Quick structural checks of the agentic development workflow. Its self-tests
# are in scripts/verify-workflow.conf.
template-structure: test -f AGENTS.md -a -f docs/architecture.md -a -f .agents/prompts/reviewer.md
shell-syntax: for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
docs-scripts: for script in scripts/*.sh scripts/lib/*.sh; do grep -Fq "$(basename "$script")" docs/project-map.md || { echo "docs/project-map.md does not mention $script"; exit 1; }; done
# The Markdown files name only files that exist. The paths after --later are
# what a project creates: its description, the approval of its planning, a
# change request, and the optional setup script of a worktree.
# .github/workflows/pages.yml is the template's own publishing workflow, which
# this project deleted as docs/repository-setup.md tells it to; that page still
# names it.
docs-references: ./scripts/check-docs.sh --later docs/PROJECT_DESCRIPTION.md docs/PLANNING_APPROVAL.md docs/changes scripts/worktree-setup.sh .github/workflows/pages.yml
# The documentation site is the template's own: a project does not have it.
documentation: test ! -d documentation || ./documentation/check.sh
# The agent skills of the workflow (ADR 019, F122): every directory under
# .agents/skills/ has its SKILL.md and a provenance record whose digest
# matches its files, the README lists exactly those, and every skill a
# feature plan names exists at the revision it gives. The one check that
# reads .agents/skills/, as data; the build and every other check pass
# without the directory (tests/unit/test_skills_boundary.py).
skills-config: uv run --locked python -m pbc.skills
