# Required verification checks for ./scripts/verify.sh.
#
# Format: one check per line.
#
#   <name>: <command>
#
# - <name> uses lowercase letters, digits, and '-', and must be unique.
# - <command> runs with 'bash -eo pipefail' from the repository root, so a
#   failing step in a pipeline or command sequence fails the check.
# - The first word of <command> is the required tool. Verification fails when
#   it is missing or not executable, and when the command exits non-zero.
# - Every listed check is required. Remove a check instead of making it optional.
# - A check may name a group in square brackets after its name:
#   '<name> [<group>]: <command>'. './scripts/verify.sh --only <group>' runs
#   the checks of that group, for a CI that spreads the same checks over
#   parallel jobs. A check without a group belongs to the group 'default';
#   such a CI has to run that group too. A partial run verifies nothing:
#   only a run without --only does.
#
# The self-tests of the workflow scripts are not listed here but in
# scripts/verify-workflow.conf; locally they run only when a workflow file
# changed, in CI always (ADR 005).
#
# Order matters only where a comment says so.

# Supported-machine contract. Listed first, so that a missing prerequisite is
# reported with a fix hint before a later check fails on it.
preflight: ./scripts/preflight.sh

# The most lessons one lesson shard of a full run executes, on one machine
# (ADR 014 decision 11). It is the one entry here that is not a check:
# ./scripts/verify.sh derives the number of shards from the lesson count, the
# workflow's matrix is made of what it prints, and no file lists the shards.
shard-size: 32

# The preflight itself: it reports each missing prerequisite, and it is the
# first check in this file.
preflight-test: ./tests/preflight-test.sh

# Python sources.
lint [code]: uv run --locked ruff check .
format [code]: uv run --locked ruff format --check .
unit-tests [code]: uv run --locked pytest tests/unit

# Datasets (ADR 007): every card is valid; every committed sample has a card
# that permits it, is under the caps, matches its checksum, and has a parsing
# test. Reads the repository only; never contacts a portal.
dataset-checks: uv run --locked python -m pbc.data.check

# Lean: every module builds against Mathlib from its build cache, without
# 'sorry' and without project axioms.
lean-build [build]: ./scripts/check-lean.sh

# Each check above and below fails on an input that violates it. After
# lean-build, because the Lean cases reuse the Mathlib it fetched.
check-tests [integration]: uv run --locked pytest tests/integration

# Lesson sources: front matter, required sections, the learning path they
# form, displayed code that is neither executed nor marked "not verified",
# figures, committed artifacts.
lesson-checks [code]: uv run --locked pytest tests/lessons

# Site: build, build again for determinism, and check the built files. The
# checks after site-build read its output.
#
# determinism and site-checks-reproduction compare bytes with that output.
# Numerical output can differ in the last digit between processors, so they
# are in the group of site-build and run on the machine that built the site
# (ADR 012).
#
# The other checks of the built site (pytest on tests/e2e) are three checks,
# each in a group of its own, so that a CI can run them side by side. With
# site-checks-reproduction they run every test of tests/e2e exactly once;
# tests/integration proves that by collection. tests/e2e/shards.json says
# which part of test_built_site.py holds what; site-checks-other runs every
# file it does not name.
site-build [build]: ./scripts/build-site.sh
determinism [build]: ./scripts/check-determinism.sh
site-checks-reproduction [build]: uv run --locked pytest tests/e2e -m same_machine
site-checks-pages-1 [e2e-pages-1]: uv run --locked pytest tests/e2e/test_built_site.py --shard 1/2
site-checks-pages-2 [e2e-pages-2]: uv run --locked pytest tests/e2e/test_built_site.py --shard 2/2
site-checks-other [e2e-other]: uv run --locked pytest tests/e2e --ignore=tests/e2e/test_built_site.py -m "not same_machine"

# Quick structural checks of the agentic development workflow. Its self-tests
# are in scripts/verify-workflow.conf.
template-structure: test -f AGENTS.md -a -f docs/architecture.md -a -f .agents/prompts/reviewer.md
shell-syntax: for file in scripts/*.sh scripts/lib/*.sh tests/*.sh; do bash -n "$file" || exit 1; done
docs-scripts: for script in scripts/*.sh scripts/lib/*.sh; do grep -Fq "$(basename "$script")" docs/project-map.md || { echo "docs/project-map.md does not mention $script"; exit 1; }; done
# The Markdown files name only files that exist. The paths after --later are
# what a project creates: its description, the approval of its planning, a
# change request, and the optional setup script of a worktree.
# .github/workflows/pages.yml is the template's own publishing workflow, which
# this project deleted as docs/repository-setup.md tells it to; that page still
# names it.
docs-references: ./scripts/check-docs.sh --later docs/PROJECT_DESCRIPTION.md docs/PLANNING_APPROVAL.md docs/changes scripts/worktree-setup.sh .github/workflows/pages.yml
# The documentation site is the template's own: a project does not have it.
documentation: test ! -d documentation || ./documentation/check.sh
