# The time budget of a lesson: how long its page may take to render and its
# experiment to run. This file is the one source of the numbers; both checks
# read it, scripts/check-lesson-pages.sh and the reproduction tests of
# tests/e2e/test_lessons.py (through tests/support/budgets.py), and a test
# shows that they judge every duration the same way.
#
# One rule for every lesson (ADR 020 decision 6, the addendum of 2026-11-05;
# the owner's direction on Issue #383). A render or an experiment that takes
#
#   less than warn-seconds                      passes, silently;
#   warn-seconds or more, less than its limit   passes and is reported as a
#                                               warning: the lesson is near
#                                               its limit and may be slow for a
#                                               learner or flake on a slower
#                                               runner; the warning never
#                                               fails a verification;
#   its limit or more                           fails.
#
# The limit of a lesson is limit-seconds, or the larger number of its own
# line below. The measuring is by the clock of the check: whole seconds in the
# shell check, fractions in the tests. CI runners measure about twice the
# developer machine (mechanics/12: 30.25 s on CI, 16.2 s locally), which is
# why the hard limit is twice the warning.
#
# The limit is a hard check, and a line below only raises the limit of one
# lesson above limit-seconds (a number at or below it is redundant and is
# refused by a test). An exception needs a reason on its line and the owner's
# approval: a new or a raised line, and a raised limit-seconds, is the
# escalation trigger "a budget widened" of the risk level
# (scripts/lib/risk.sh), so the change is Level 3 and the owner approves its
# diff. A budget is never met by changing the scientific content of a lesson.
# A wall-clock budget of a whole run (the 20 minutes of a pull request, the
# planning budget of a full run, a run on main above 45 minutes) is
# different: when it is exceeded, that is a measurement for the owner's
# decision at the re-assessment points (since 2026-11-04, ADR 014 status, the
# build job at 120 minutes: decide earlier if a complete run on main
# approaches 100 minutes, repeated runs show too little margin, or
# verification failures point to a capacity problem), never a failed check
# and never a mandate to optimise (docs/development.md, "Verification").
#
# History of the lines that are gone: the 60-second entries of
# lessons/mechanics/08-kepler-orbit, /11-gravitational-wave-strain and
# /12-inverse-physics-parameter-discovery (#261, the owner on 2026-10-22) are
# the default limit now; the 90 seconds of agents-abm/01 (#272) stay.
#
# Format: 'warn-seconds: <n>' and 'limit-seconds: <n>' once each, and
# '<lesson directory below site/> | <seconds> | <reason>' per exception.

warn-seconds: 30
limit-seconds: 60

lessons/agents-abm/01-particles-in-a-box | 90 | a Monte Carlo lesson: its sample of 12 independent runs is justified statistically (#206); it took about 44 s on a quiet machine then, and its reproduction now takes 69.1 s and 67.1 s in full verifications and 68.6 s alone on a quiet machine, above the default limit of 60 s; raised by the owner on 2026-10-24 (#272) and kept by the owner's rule of 2026-11-05 (#383)
