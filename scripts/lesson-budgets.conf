# The time budget of a lesson: how long its page may take to render and its
# experiment to run. The default is 30 seconds. A lesson listed here has its
# own budget instead; both checks read this file, scripts/check-lesson-pages.sh
# and the reproduction tests of tests/e2e/test_lessons.py.
#
# The budget policy (ADR 020 decision 6). This budget is a hard check: a
# lesson over its budget fails, also with an entry here, which only sets its
# own budget. An exception needs a reason on its line and the owner's
# approval: a new or a raised entry is the escalation trigger "a budget
# widened" of the risk level (scripts/lib/risk.sh), so the change is Level 3
# and the owner approves its diff. A budget is never met by changing the
# scientific content of a lesson. A wall-clock budget of a whole run (the 20
# minutes of a pull request, the planning budget of a full run, a run on main
# above 45 minutes) is different: when it is exceeded, that is a measurement
# for the owner's decision at the re-assessment points (since 2026-10-21,
# ADR 014 status: re-measure at 55 lessons, decide the capacity at 60 at the
# latest, or earlier if the build job approaches 55 minutes, repeated runs
# show too little margin, or verification failures point to a capacity
# problem), never a failed check and never a mandate to optimise
# (docs/development.md, "Verification").
#
# Format: '<lesson directory below site/> | <seconds> | <reason>' per line.

lessons/agents-abm/01-particles-in-a-box | 60 | a Monte Carlo lesson: its sample of 12 independent runs is justified statistically (#206), and takes about 44 s on a quiet machine
