name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Only the deploy job asks for more, and only for
# publishing to GitHub Pages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check is declared in scripts/verify.conf with a group, and each job
  # below runs the checks of its groups through ./scripts/verify.sh --only;
  # no check is declared here (ADR 012). The job 'verify' at the end is the
  # one required status check on main.

  # Lint, format, and the tests that need neither Lean nor a browser.
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Verify the group code
        run: ./scripts/verify.sh --all --only code

  # The checks without a group, and with --all the self-tests of the
  # development workflow, which CI never skips.
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browser: "true"
      - name: Verify the group default
        run: ./scripts/verify.sh --all --only default

  # Every check fails on an input that violates it: the integration tests in
  # the three parts of docs/verification-audit.md ("Division into independent
  # parts"), each job preparing only what its part needs. Every test runs in
  # exactly one of them (tests/integration/test_site_check_division.py).
  integration-quarto:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Verify the group integration-quarto
        run: ./scripts/verify.sh --all --only integration-quarto

  integration-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browser: "true"
      - name: Verify the group integration-browser
        run: ./scripts/verify.sh --all --only integration-browser

  integration-other:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          lean-packages: restore
      - name: Verify the group integration-other
        run: ./scripts/verify.sh --all --only integration-other

  # Builds the Lean project and the site, once, and makes the comparisons
  # that need the machine of the build: the second build for determinism and
  # the reproduction of every lesson. The jobs below check this site, and on
  # main the deploy job publishes exactly this artifact.
  build:
    runs-on: ubuntu-24.04
    # The interim full-run gate (ADR 014, status): 60 minutes for the one job
    # of a full run, approved for up to 64 lessons by the owner's decision of
    # 2026-10-21 (45 lessons under the decision of 2026-10-15 until then).
    # The 60 minutes stay; 64 is a planning boundary that no check enforces.
    # Capacity is re-measured at 55 lessons and the next decision is the
    # owner's by 60 lessons at the latest, or earlier if this job approaches
    # 55 minutes, repeated runs show too little margin, or verification
    # failures point to a capacity problem. Every other job keeps 45 minutes.
    timeout-minutes: 60
    # The one added scope: reading the runs and artifacts of earlier runs, to
    # find the verified base of a pull request (ADR 014 decision 2).
    permissions:
      contents: read
      actions: read
    outputs:
      base-run: ${{ steps.base.outputs.run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          lean-packages: save
          browser: "true"

      # Only a pull request run looks for a base; a run on main never receives
      # one and executes and checks every lesson. The script accepts a base
      # by the record of the run that produced it and otherwise leaves none.
      - name: Fetch the verified base
        id: base
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/fetch-base.sh "$RUNNER_TEMP/base"
      - name: Verify the group build against the base
        if: ${{ steps.base.outputs.accepted == 'true' }}
        run: ./scripts/verify.sh --all --only build --base "$RUNNER_TEMP/base"
      - name: Verify the group build
        if: ${{ steps.base.outputs.accepted != 'true' }}
        run: ./scripts/verify.sh --all --only build

      - name: Record the files of the built site
        run: ./scripts/fetch-built-site.sh --record "$RUNNER_TEMP/built-site-record"

      # Attached to every run that built a site, so a pull request's site can
      # be reviewed before merge. That includes a run in which a check of
      # this job failed after the site was written; without the condition
      # the step would be skipped then. The job still fails, so 'verify' fails and the
      # deploy job does not run.
      - name: Upload the built site
        if: ${{ !cancelled() && hashFiles('site/_site/index.html') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site
          retention-days: 7

      - name: Upload the record of the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site-record
          path: ${{ runner.temp }}/built-site-record
          retention-days: 7
          if-no-files-found: error

      # A run on main built and checked every lesson. What it stored is kept
      # for the job 'base', which publishes it as the base of later pull
      # requests once 'verify' passed.
      - name: Collect the base
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: ./scripts/collect-base.sh "$RUNNER_TEMP/verification-base"
      - name: Upload the base candidate
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-base-candidate
          path: ${{ runner.temp }}/verification-base
          retention-days: 1
          if-no-files-found: error

  # The checks of the built site that compare no bytes with it, in a
  # browser, side by side.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        part: [pages-1, pages-2, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browser: "true"
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/built-site
      - name: Download the record of the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site-record
          path: ${{ runner.temp }}/built-site
      - name: Unpack the built site and compare it with its record
        run: ./scripts/fetch-built-site.sh "$RUNNER_TEMP/built-site"
      # The base the build job took, by its run, checked again by the same
      # script, so that every job selects against the same base.
      - name: Fetch the verified base of the build job
        id: base
        if: ${{ github.event_name == 'pull_request' && needs.build.outputs.base-run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_RUN: ${{ needs.build.outputs.base-run }}
        run: ./scripts/fetch-base.sh --run "$BASE_RUN" "$RUNNER_TEMP/base"
      - name: Verify the group e2e-${{ matrix.part }} against the base
        if: ${{ steps.base.outputs.accepted == 'true' }}
        env:
          PART: ${{ matrix.part }}
        run: ./scripts/verify.sh --all --only "e2e-$PART" --base "$RUNNER_TEMP/base"
      - name: Verify the group e2e-${{ matrix.part }}
        if: ${{ steps.base.outputs.accepted != 'true' }}
        env:
          PART: ${{ matrix.part }}
        run: ./scripts/verify.sh --all --only "e2e-$PART"

  # The one required status check on main. It runs whatever happened to the
  # jobs it needs and passes only when each of them succeeded: a job that
  # failed, was cancelled, or was skipped fails it.
  verify:
    if: ${{ always() }}
    needs: [code, workflow, integration-quarto, integration-browser, integration-other, build, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/ci-aggregate.sh code workflow integration-quarto integration-browser integration-other build e2e

  # Publishes the artifact the build job made for this commit, after every
  # job succeeded. It builds nothing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Publishes what a run on main stored as the base of later pull requests,
  # after every job succeeded. It runs nothing of the base and has no write
  # permission: uploading an artifact needs none. A pull request run never
  # reaches it, and what it publishes is accepted only by the record of this
  # run (a push run on main whose 'verify' succeeded).
  base:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download the base candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verification-base-candidate
          path: ${{ runner.temp }}/verification-base
      - name: Publish the base
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-base
          path: ${{ runner.temp }}/verification-base
          retention-days: 30
          if-no-files-found: error
