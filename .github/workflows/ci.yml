name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Only the deploy job asks for more, and only for
# publishing to GitHub Pages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The one required status check on main. It prepares the runner like the
  # one-time setup in docs/development.md and then runs every check through
  # ./scripts/verify.sh; no check is declared here.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Restore elan and the Lean toolchain
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.elan
          key: elan-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain') }}

      - name: Restore Lean packages with the Mathlib build products
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}

      - name: Restore the browser build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Install elan
        env:
          ELAN_VERSION: v4.2.4
          ELAN_SHA256: 42b94d4244e8353142c456ec0e4ca6528fd898a6c604d4059f494e706e431f63
        run: |
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL -o "$RUNNER_TEMP/elan.tar.gz" \
              "https://github.com/leanprover/elan/releases/download/$ELAN_VERSION/elan-x86_64-unknown-linux-gnu.tar.gz"
            echo "$ELAN_SHA256  $RUNNER_TEMP/elan.tar.gz" | sha256sum --check
            tar -xzf "$RUNNER_TEMP/elan.tar.gz" -C "$RUNNER_TEMP"
            "$RUNNER_TEMP/elan-init" -y --no-modify-path --default-toolchain none
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Install the Python environment and the browser build
        run: |
          uv sync --locked
          uv run --locked playwright install --with-deps --only-shell chromium

      - name: Verify
        run: ./scripts/verify.sh

      # Attached to every run that built a site, so a pull request's site can
      # be reviewed before merge. That includes a run in which a check failed,
      # where the built site helps to find out why; without the condition the
      # step would be skipped then. The job still fails, so the deploy job
      # does not run. On main the deploy job publishes exactly this artifact.
      - name: Upload the built site
        if: ${{ !cancelled() && hashFiles('site/_site/index.html') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site
          retention-days: 7

  # Publishes the artifact the verify job built for this commit. It builds
  # nothing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
