name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only by default. Only the deploy job asks for more, and only for
# publishing to GitHub Pages.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Every check is declared in scripts/verify.conf with a group, and each job
  # below runs the checks of its groups through ./scripts/verify.sh --only;
  # no check is declared here (ADR 012). The job 'verify' at the end is the
  # one required status check on main.

  # Lint, format, and the tests that need neither Lean nor a browser.
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Verify the group code
        run: ./scripts/verify.sh --all --only code

  # The checks without a group, and with --all the self-tests of the
  # development workflow, which CI never skips.
  workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          browser: "true"
      - name: Verify the group default
        run: ./scripts/verify.sh --all --only default

  # Every check fails on an input that violates it.
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          lean-packages: restore
          browser: "true"
      - name: Verify the group integration
        run: ./scripts/verify.sh --all --only integration

  # Builds the Lean project and the site, once. The jobs below check this
  # site, and on main the deploy job publishes exactly this artifact.
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          lean-packages: save
      - name: Verify the group build
        run: ./scripts/verify.sh --all --only build

      - name: Record the files of the built site
        run: ./scripts/fetch-built-site.sh --record "$RUNNER_TEMP/built-site-record"

      # Attached to every run that built a site, so a pull request's site can
      # be reviewed before merge. That includes a run in which the build
      # failed after it wrote a site; without the condition the step would
      # be skipped then. The job still fails, so 'verify' fails and the
      # deploy job does not run.
      - name: Upload the built site
        if: ${{ !cancelled() && hashFiles('site/_site/index.html') != '' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/_site
          retention-days: 7

      - name: Upload the record of the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: built-site-record
          path: ${{ runner.temp }}/built-site-record
          retention-days: 7
          if-no-files-found: error

  # Builds the site a second time and compares it with the site of 'build'.
  determinism:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/built-site
      - name: Download the record of the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site-record
          path: ${{ runner.temp }}/built-site
      - name: Unpack the built site and compare it with its record
        run: ./scripts/fetch-built-site.sh "$RUNNER_TEMP/built-site"
      - name: Verify the group determinism
        run: ./scripts/verify.sh --all --only determinism

  # The checks of the built site, in a browser, side by side. The parts of
  # the lessons reproduce Lean lessons and need the Lean packages.
  e2e:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [lessons-1, lessons-2, pages-1, pages-2, other]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/prepare
        with:
          lean-packages: ${{ startsWith(matrix.part, 'lessons-') && 'restore' || 'none' }}
          browser: "true"
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/built-site
      - name: Download the record of the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: built-site-record
          path: ${{ runner.temp }}/built-site
      - name: Unpack the built site and compare it with its record
        run: ./scripts/fetch-built-site.sh "$RUNNER_TEMP/built-site"
      - name: Verify the group e2e-${{ matrix.part }}
        env:
          PART: ${{ matrix.part }}
        run: ./scripts/verify.sh --all --only "e2e-$PART"

  # The one required status check on main. It runs whatever happened to the
  # jobs it needs and passes only when each of them succeeded: a job that
  # failed, was cancelled, or was skipped fails it.
  verify:
    if: ${{ always() }}
    needs: [code, workflow, integration, build, determinism, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: ./scripts/ci-aggregate.sh code workflow integration build determinism e2e

  # Publishes the artifact the build job made for this commit, after every
  # job succeeded. It builds nothing.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
