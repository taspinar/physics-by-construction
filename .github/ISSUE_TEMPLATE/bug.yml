name: Bug
description: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: >-
        The address or the title of the page, if the issue is about one.
        The "Suggest an improvement" links of a lesson fill it in.
  - type: textarea
    attributes:
      label: Current behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction / evidence
    validations:
      required: true
