name: Feature
description: Define a scoped feature for implementation
labels: [feature]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: >-
        The address or the title of the page, if the issue is about one.
        The "Suggest an improvement" links of a lesson fill it in.
  - type: textarea
    attributes:
      label: Goal
      description: What outcome should this feature deliver?
    validations:
      required: true
  - type: textarea
    attributes:
      label: Acceptance criteria
      description: List observable conditions for completion.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Constraints / context
      description: Relevant architecture, dependencies, or boundaries.
