name: Scientific correction
description: Report a wrong statement, number, or derivation on a page
title: "Correction: "
labels: [scientific-correction]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the correction. Say what is wrong and what is right, and
        give a source. A scientific change needs a source with a licence that
        allows its use, and independent review before it is merged. You do not
        need to contact anyone: the maintainer assesses this Issue and records
        the outcome on it.

        Do not put secrets, credentials, or private data in this Issue.
  - type: input
    attributes:
      label: Page
      description: The address or the title of the page.
    validations:
      required: true
  - type: textarea
    attributes:
      label: The statement
      description: Quote the sentence, number, equation, or figure that is wrong.
    validations:
      required: true
  - type: textarea
    attributes:
      label: The correction
      description: What the statement should say instead.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Source and its licence
      description: >-
        A reference for the correction (book, paper, standard, or your own
        derivation) and the licence under which any text, figure, or data you
        want us to use from it is available.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Evidence
      description: >-
        The derivation, a calculation, a limiting case, or a run of the code
        that shows the statement is wrong and the correction is right.
    validations:
      required: true
  - type: checkboxes
    attributes:
      label: Licence
      options:
        - label: >-
            I have the right to license this correction under the licences in
            CONTRIBUTING.md (MIT for code and proofs, CC BY 4.0 for text and
            figures).
          required: true
