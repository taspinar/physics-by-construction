estimates:
  runtime: 'Reference figure: about 3 s with the interpreter start. The CI replay of the sampled frequency response
    and of both LED runs: a few seconds.'
  memory: About 150 MB peak resident for the figure.
  page_payload: 3.3 MB committed, none of it sent to a reader's browser.
  ci: 'Offline: the committed files; the replay needs no device, no SDK, and no network.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: 29 exports, every acquisition valid; the replay of the sampled frequency response
    (31 records, the plan narrowed to that protocol) and of both LED runs by the product''s recorded adapter gives
    the exports'' recorded results to a relative 1e-6 (tests/unit/test_data_ad3_bench_2026_11.py).'
  - 'Published as measured, with the failed checks: the evaluator''s verdict is false in all 29 campaigns (the two
    RLC protocols disagree on Q in every campaign; the LED pair''s held-out check fails in both runs).'
  - 'The owner''s own measurements under CC BY 4.0 by the owner''s decisions of 2026-11-25, 2026-11-26 and
    2026-11-27 on Issue #614.'
