id: ad3-bench-2026-11
title: F145 bench sessions, 27 series RLC campaigns and 2 LED-pair campaigns on an Analog Discovery 3, 2026-11-25
  and 2026-11-26
source:
  url: https://github.com/taspinar/physics-by-construction/issues/614#issuecomment-7210910945
  creator: Ahmet Taspinar (the project's owner, at the bench), with the campaign command of the Autonomous Physics
    Lab (pbc.products.physics_lab, F145) run by the supervising agent session
  version: 'Version 1.0.0 of the packaged dataset (data/publish/ad3-bench-2026-11.toml): the exports of the 3 series
    RLC campaigns of 2026-11-25, the 24 of 2026-11-26, and the 2 LED-pair campaigns of 2026-11-26, as the product
    wrote them, with the device serial replaced by AD3-001'
  accessed: &accessed 2026-11-27
rights:
  licence: CC-BY-4.0
  local_download:
    answer: permitted
    source: 'The owner''s decisions on Issue #614: CC BY 4.0 for the series RLC runs of bench session 1 (2026-11-25,
      https://github.com/taspinar/physics-by-construction/issues/614#issuecomment-7173989078, covering the runs of 2026-11-26), for both LED-pair runs (https://github.com/taspinar/physics-by-construction/issues/614#issuecomment-7197996080),
      and every campaign published with its failed checks (https://github.com/taspinar/physics-by-construction/issues/614#issuecomment-7210910945); the terms at
      https://creativecommons.org/licenses/by/4.0/legalcode permit reproducing and sharing the material'
  redistribution_of_subsets:
    answer: permitted
    source: 'The owner''s decisions on Issue #614 (issuecomment-7173989078, -7197996080, -7210910945), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 2(a)(1) permits sharing the material in whole
      or in part; the split between the repository and the archive is the owner''s decision 2 of 2026-11-27'
  publication_of_figures:
    answer: permitted
    source: 'The owner''s decisions on Issue #614 (issuecomment-7173989078, -7197996080), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 2(a)(1) permits producing and sharing adapted
      material'
  modification_and_attribution:
    answer: permitted
    source: 'The owner''s decisions on Issue #614 (issuecomment-7173989078, -7197996080), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 3(a) requires the creator, the licence, a link,
      and an indication of changes (the device identifier, MANIFEST.tsv)'
  attribution: Taspinar, A., 'Series RLC and LED-pair campaigns on an Analog Discovery 3, bench sessions of 2026-11-25
    and 2026-11-26', version 1.0.0, https://github.com/taspinar/physics-by-construction/issues/614, CC BY 4.0; the device serial replaced by AD3-001, the raw samples of
    the repository a subset (MANIFEST.tsv).
  figure_credit:
    short: 'Data: A. Taspinar, F145 bench sessions (Analog Discovery 3), 2026-11, CC BY 4.0'
    visible: required
    source: 'https://creativecommons.org/licenses/by/4.0/legalcode section 3(a): the creator, the licence, and
      a link go with the shared material, so a figure saved without its page carries them on its face'
artifacts:
- name: run.json
  type: processed-measured
  description: The run record of each campaign as the product exported it (pbc.products.physics_lab.lab.export)
    - the plan, the device (serial replaced by AD3-001), the configuration, the units, the processing, the start
    and end times, the segment, and the evaluator's results recomputed from raw.csv during the live run (f0 and
    Q of both protocols with standard errors, their agreement, the LED characteristic and its held-out check, the
    verdict). The results are the product's processing, as recorded, not re-computed for this card.
- name: measurements.csv
  type: processed-measured
  description: One row per acquisition (protocol, stage, setting, basis, valid, note, and the numbers read from
    it - gain and phase with standard errors, or the ring-down's fit, or the LED pair's gain and third harmonic).
- name: evidence.json
  type: processed-measured
  description: The evidence log of each campaign (task, hypothesis, assumptions, protocol versions, the code and
    configuration digests, the execution mode, the attempt, the evaluation, the claim). The SHA-256 of raw.csv in
    it is the original file's.
- name: raw.csv
  type: raw-measured
  description: Every sample of every acquisition (record, protocol, stage, valid, waveform, amplitude, frequency,
    asked rate, time, channel 1 at W1, channel 2 at the response node), in volts as the device returned them.
    Committed for the first series RLC campaign of 2026-11-26 (its 31 frequency-response records only, no
    ring-downs) and both LED-pair campaigns; complete for every campaign in the archive.
calibration: 'The device''s factory calibration, not adjusted (each run record says so). Channel 1 on the 5 V range,
  channel 2 on the 50 V range, both against ground; the relative gain and phase of the two ranges are not documented
  and were not measured. The parts are nominal (R 100 ohm, L 1 mH, C 10 nF; the LED pair two red 5 mm LEDs behind
  100 ohm); no part was measured with a multimeter (reserved for F155, Issue #619).'
schema: 'Per campaign, under exports/<export>/: run.json (one JSON object: product, kind, route, status, segment, plan,
  run, execution_modes, evaluation, verdict, invalid, candidate_answer, comparison, evidence), measurements.csv (the
  columns record, protocol, stage, setting, basis, valid, note, and the numbers of the protocol), evidence.json (the
  evidence log, format 1). raw.csv: record, protocol, stage, valid, waveform, amplitude_v, frequency_hz,
  asked_rate_hz, t_s, source_v, response_v. MANIFEST.tsv: path, bytes, sha256, original_sha256, derivation.'
units: 'Stated in run.json: frequency Hz, amplitude V, time s, source and response V, gain V/V, phase degrees, decay
  rate 1/s, third harmonic V/V.'
cadence: 'Series RLC: 36 or 37 acquisitions per campaign (13 sweep points from 5 kHz to 200 kHz, 18 refinements
  around the phase crossing, the ring-downs of a 1 kHz square wave at 10 MS/s, 15,001 samples each); 513 samples
  per sweep point. LED pair: 13 amplitudes from 0.2 V to 2.0 V at 1 kHz. Three campaigns on 2026-11-25 between
  19:56 and 20:04 UTC; 24 on 2026-11-26 from 12:14 to 13:39 UTC (ten of them within one minute, then one every
  five minutes); the LED pair at 16:07 and 16:13 UTC.'
coordinates: 'One breadboard series RLC circuit, W1 -> 100 ohm -> coil -> node A -> capacitor -> ground, unchanged
  since the pilot of 2026-11-22 by the owner''s statement; and two red LEDs in anti-parallel behind 100 ohm.
  Device AD3-001 (an Analog Discovery 3; the serial replaced), WaveForms SDK 3.25.1. Plug-in and room: 2026-11-25
  not recorded; 2026-11-26 plugged in at about 12:10 UTC, room about 20 degrees C (RLC); room 19 degrees C (LED).'
masks: 'None: every acquisition is kept, valid or not; no campaign was left out.'
uncertainty: 'The standard errors the product recorded (the weighted fit of the frequency response; the scatter of
  the ring-downs, with their Birge ratio; the LED characteristic''s fit). The reduced chi-square of the
  frequency-response fit is 3,450 to 5,500, so the model does not describe the points within their noise and
  those standard errors understate the spread. The factory calibration error and the channel mismatch are unknown
  and not included.'
size:
  description: 'The repository holds 93 files, 3,335,854 bytes (run.json, measurements.csv and evidence.json of all
    29 campaigns, three raw.csv files, MANIFEST.tsv, README.md, CITATION.cff). The archive holds all 259 files of
    the 29 exports, 38 MB compressed (about 346 MB unpacked).'
format: CSV (plain text), JSON, Markdown, SVG; the archive a ZIP of the same
reader: pbc.data.reference.ad3_bench_2026_11 (campaigns, phase_crossing_hz, the csv and json modules of the standard
  library); the replay as a recorded sample is pbc.products.physics_lab.lab.read_campaign_export. No new dependency.
