artifacts:
- name: Bell_2016-04-15_9_lab_1.csv
  type: raw-measured
  description: 'Every heralded measurement attempt of lab 1 (trap 1, next to the Bell-state measurement),
    10,218 rows: PC time, the random setting bit, the outcome bit of the ionisation detection, the lab''s
    high-precision timestamp, the heralded Bell state, and the exclusion flag with its reason (17 rows,
    all ''Maintenance'').'
- name: Bell_2016-04-15_9_lab_2.csv
  type: raw-measured
  description: 'Every measurement attempt of lab 2 (trap 2, 398 m away), 10,248 rows, the same columns
    without the Bell state (45 rows excluded, all ''Maintenance'').'
- name: Bell_2016-04-15_9_pairs.csv
  type: processed-measured
  description: 'The 10,201 valid atom-atom events, made by the experimenters from the two lab files by
    pairing within +-100 ms and dropping the excluded attempts; heralded state, both settings and both
    outcomes, and the line of each lab file. The correlators, S, and their standard errors are computed
    by pbc.data.reference.munich_bell and are not part of the record; the ideal correlators +-1/sqrt(2)
    on the figure are a reference line, not data.'
calibration: 'None in the archive. The measurement angles, the readout and the timing are described
  in the PRL and its Supplemental Material, not in the files; the mapping of the bits to the angles (setting
  0/1 of lab 1 = 0/90 deg, of lab 2 = -45/+45 deg) and of the outcomes is established here by reproducing
  the published correlators. No correction is applied, and none may be: a Bell test is evaluated on the
  raw outcomes, since correcting for detector inefficiency would reintroduce the fair-sampling assumption
  the event-ready scheme avoids.'
schema: 'Three text files and a Readme. Pairs file, tab-separated, 8 columns: timestamp lab 1 (unix
  time ms), Bell-state (Psi- or Psi+), setting lab 1, result lab 1, setting lab 2, result lab 2, line
  in lab 1 file, line in lab 2 file. Lab files, semicolon-separated: time (Unix time in ms), setting,
  result, local timestamp, Bell-state (lab 1 only), excluded from evaluation (yes/no), comment; the lab
  2 header ends with a delimiter (an empty eighth name) and its rows have 6 fields.'
units: 'Times in Unix milliseconds (UTC); settings and results are bits (0 or 1); the local timestamp
  is a counter of the lab''s time-to-digital hardware without a stated unit, not used here; line numbers
  start at 0 after the header. The correlators and S are dimensionless.'
cadence: 'Event driven, no clock: one row per heralded entanglement, median 20.5 s between valid events
  (mean 31 s), with three pauses of 1.6 to 1.8 h for the daily maintenance.'
coordinates: 'Two labs 398 m apart (Munich); lab 1 holds the Bell-state measurement. One run, 2016-04-15
  14:19:57.751 UTC to 2016-04-19 07:03:43.045 UTC (3.70 days); the stopping rule of 5000 events per state
  is reached at 2016-04-19 05:42:11 UTC.'
masks: 'The exclusion flag of the lab files (17 rows of lab 1, 45 of lab 2, reason ''Maintenance'');
  the pairs file contains only rows valid in both labs. Two valid rows at the end of lab 2 have no partner.
  No missing or malformed value; every pair agrees with the lab rows it names, within 100 ms.'
uncertainty: 'None in the archive. Each event gives one +-1 product, so a correlator over n events has
  the binomial standard error sqrt((1 - E^2)/n) and S the quadrature sum of four, as the PRL states (Fig.
  3). Derived (dossier): with the first 5000 events of each state, S = 2.240 +- 0.047 (Psi-), 2.204 +-
  0.047 (Psi+), 2.221 +- 0.033 pooled, equal to the published values; the whole archive gives 2.2210
  +- 0.0329. These standard errors assume independent events; the PRL''s P-value bounds (Pm = 2.57e-9)
  avoid that assumption and are cited, not recomputed.'
size:
  description: 'One ZIP of 369,992 bytes holding three CSV files and a Readme, 1,227,251 bytes unpacked;
    the sample is the four files, unmodified.'
format: CSV (tab-separated pairs file, semicolon-separated lab files) and plain text, packed in a ZIP
reader: pbc.data.reference.munich_bell.load (the csv module of the standard library and NumPy); no new
  dependency.
