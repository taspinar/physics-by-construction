estimates:
  runtime: 'Reference figure: about 2 s with the interpreter start; the reader parses the three files
    in under 0.5 s.'
  memory: About 125 MB peak resident for the figure.
  page_payload: 1.2 MB committed, none of it sent to the reader's browser; a figure PNG of about 170 KB.
  ci: 'Offline: four committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real archive inspected: md5 equals the record''s; 10,201 valid pairs, 5054 Psi- and 5147 Psi+, every
    pair consistent with the two lab files it names; 3.70 days of one run.'
  - 'The published result is reproduced exactly: the first 5000 events of each state (the stopping rule
    fixed before the run) give the paper''s eight correlators and S = 2.240 +- 0.047, 2.204 +- 0.047, and
    2.221 +- 0.033 pooled.'
  - 'Uncertainty derived as the paper does (binomial per correlator); no calibration applies to the raw
    outcomes; the selections (heralding, maintenance exclusions, stopping rule) are documented, and the
    excluded attempts added back move S by 0.001.'
  - CC BY 4.0 on the record covers local download, subsets, figures, and modification.
  - 'The loopholes closed (detection, locality) and the assumption left (independence of the settings,
    no memory in the random number generators) are stated in the dossier from the PRL.'
  - 'Recorded by F103 (Issue #419) under the owner''s decision of 2026-11-08 on the Issue: Q8 may become
    go if the inspection supplies all evidence ADR 007 requires, judged per dossier.'
