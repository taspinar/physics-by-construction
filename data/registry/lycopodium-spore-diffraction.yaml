estimates:
  runtime: Reference figure about 3.2 s with the interpreter start.
  memory: About 320 MB peak resident for the figure.
  page_payload: 234 KB committed, read at build time and not shipped; a figure PNG of about 280 KB.
  ci: 'Offline: four committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: the two XLSX profiles and two morphometry CSVs, md5s equal to Zenodo''s; the
    profiles converted to CSV by a pinned script with no value changed, the morphometry CSVs re-encoded to UTF-8 by a pinned script with no value changed.'
  - 'Scale-free test passed: the dark ring at 405 nm over that at 632.8 nm is 0.661 +- 0.024 (range over
    smoothing widths), close to the wavelength ratio 0.640 that Fraunhofer diffraction by particles of
    one size distribution gives if both profiles have the same spatial scale and measurement geometry;
    the microscope gives that distribution (whole spores 29.91 +- 0.34 µm at x160, 30.36 +- 0.13 µm at
    x80).'
  - 'Limits stated, not hidden: the unit of x and the distance to the screen are not in the record (the
    owner''s comment on the Issue: say so), so no absolute diameter is inferred from the diffraction;
    the camera saturates the centre, so intensities are not modelled; whether the dark ring is the first
    or second Airy minimum is not settled (the ring spacing favours the second); the uncertainty of the
    ring radii is a sensitivity range of the analysis.'
  - CC BY 4.0 on the record, whose copyright line names both creators; local download, subsets, figures, and modification
    permitted with attribution.
  - 'Recorded by F52 (Issue #440) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go, judged per dossier, with every requirement of ADR 007 checked in the dossier.'
