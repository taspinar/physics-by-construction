artifacts:
- name: Diffraction_Lycopodium_HeNe_0.6328um_Nokia5.jpg and the other diffraction photographs
  type: raw-measured
  description: 'Photographs of the diffraction halo on a screen behind spores on a glass plate, He-Ne
    laser 632.8 nm and a semiconductor laser 405 nm, by a Nokia 5 phone (JPEG) and a Canon EOS RP (CR3
    raw), per the record. Not committed and not inspected: the record does not say from which photograph
    either profile was taken.'
- name: Intensity_profile_diffraction_lambda0.6328um.xlsx, Intensity_profile_diffraction_lambda0.405um.xlsx
  type: processed-measured
  description: 'Line profiles of one photograph each, along a horizontal scanline through the centre,
    exported by the Tracker software: sample index n, coordinates x and y, and luma 0 to 255 (averaged
    across the line, so not integers). The unit of x is not stated and the centre is saturated.'
- name: profile_633nm.csv, profile_405nm.csv
  type: processed-measured
  description: 'The committed samples: every row of the two XLSX sheets, converted by tools/datasets/lycopodium_xlsx_to_csv.py
    with no value changed. The centring, folding, smoothing, and ring radii of the reference figure are
    computed by pbc.data.reference.lycopodium and are not part of the record.'
- name: Lycopodium_Morphometry_x160.csv, Lycopodium_Morphometry_x80.csv
  type: processed-measured
  description: 'ImageJ "Analyze Particles" results of binarised micrographs at x160 and x80 (MMU-5C microscope,
    ToupTek camera, each calibrated by a 10 um scale bar per the record), with the creators'' r^2, r,
    and d of the circle of equal area; committed re-encoded from Latin-1 to UTF-8 (the micro sign of three
    headers), every number, separator and line ending as in the record''s file (md5 as on Zenodo).'
- name: polydisperse Airy model
  type: modelled-reference
  description: 'The diffraction halo of opaque disks with the measured diameters, intensities added
    (Babinet), computed by pbc.data.reference.lycopodium.ensemble; it gives the q = sin(theta)/lambda
    of each ring. Not part of the record.'
calibration: 'Microscope: by a scale bar of 10 um divisions at each magnification (record); the two magnifications
  give whole-spore means 29.91 and 30.36 um, within 1.3 combined standard errors. Diffraction profiles:
  Tracker''s coordinate calibration is not documented (unit of x unknown, distance to the screen unknown);
  the camera''s tone curve and exposure are unknown and the centre is saturated, so only ring positions,
  not intensities, are used, and only their ratio between the wavelengths is calibration-free. The companion
  article (paywalled, landing page read 2026-11-09) states neither on its abstract page.'
schema: 'Profiles: CSV with three comment lines (source and its sha256, the conversion, the units) and
  the header n,x,y,luma; 2,211 rows (632.8 nm) and 932 rows (405 nm). Source: sheet 1 ''profile_A''
  of each XLSX, title row, header row n x y luma, then the rows. Morphometry: '';''-separated, CRLF,
  Latin-1 in the record and UTF-8 in the sample; an unnamed particle-number column, ImageJ''s Area, Mean, Min, Max, X, Y, (Perim., x160 only),
  Circ., Feret, FeretX, FeretY, FeretAngle, MinFeret, AR, Round, Solidity, an empty column, then r^2 (µm^2),
  r (µm), d (µm); 150 rows (x160) and 642 rows (x80).'
units: 'Profiles: x and y in Tracker''s world unit, not stated (the ratio test assumes the same spatial scale
  and measurement geometry in both; the record does not confirm it); luma the camera brightness 0 to 255, dimensionless, nonlinear. Morphometry:
  Area in µm^2 (not pixels^2 as the record says: r^2 = Area/3.14 to 5e-9), r and d in µm; d = 2 sqrt(Area/3.14),
  0.025 % above the value with pi; X, Y, Feret in µm; FeretX, FeretY in pixels; Mean, Min, Max grey levels
  0-255; Circ., AR, Round, Solidity dimensionless.'
cadence: 'Profiles: one sample per pixel along the scanline, x in equal steps of 0.0530345 (632.8 nm)
  and 0.0830055 (405 nm), from -61.50 to 55.71 and from -39.15 to 38.13; y constant. Morphometry: one
  row per particle, no time axis.'
coordinates: 'Profiles: x along a horizontal scanline through the centre of the halo on the screen;
  the centre of mirror symmetry is at x = 1.245 (632.8 nm) and 0.075 (405 nm). Morphometry: particle
  centroids X, Y in the micrograph.'
masks: 'None in the record; every value is a number. Saturated samples (luma >= 250): 37 at 632.8 nm
  and 57 at 405 nm, all in the central spot; at 632.8 nm a plateau at luma about 80 out to radius 13 is
  the red channel at its limit. The analysis excludes the saturated core and takes whole spores as d
  > 15 µm (72 of 150 at x160, 605 of 642 at x80; the rest are wall fragments; at x160 no particle lies between 10 and 20 µm, at x80 seven do).'
uncertainty: 'None in the record. Derived (dossier): microscope means 29.91 +- 0.34 µm (x160, n = 72,
  sd 2.87) and 30.36 +- 0.13 µm (x80, n = 605, sd 3.22), standard errors of the mean; dark-ring radii
  16.68 +- 0.34 (632.8 nm) and 11.02 +- 0.33 (405 nm) in units of x, the uncertainty being half the range
  over smoothing widths 0.5 to 2.0 (a sensitivity range of the analysis, not a statistical error); ratio
  0.661 +- 0.024 (propagated from those ranges), close to the wavelength ratio 0.640 if both profiles
  have the same spatial scale and measurement geometry; the two implied screen distances use the same
  ring radii and give no independent confirmation of that. At 405 nm the right side of the profile shows no dip, so that radius rests
  on the left side and the fold. Which Airy minimum the dark ring is (first or second) is not settled
  by the record; the distance to the screen and the unit of x are unknown, so no absolute diameter is
  inferred from the diffraction.'
