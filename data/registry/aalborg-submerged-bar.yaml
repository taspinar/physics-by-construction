artifacts:
- name: Exp/dataset/Exp_WC*_surfaceElevation.csv
  type: processed-measured
  description: Surface elevation at 20 wave gauges; five repetitions aligned on gauge 1 and downsampled
    to 150 Hz, their sample mean, and the expanded uncertainty of the mean at 95 % confidence.
- name: iVoF/, Msigma/, DSPH/ dataset/*_A.csv
  type: modelled-reference
  description: Simulated surface elevation at the 20 gauge positions from the OpenFOAM interFoam (i-VoF),
    MIKE 3 sigma-transformation (M-sigma), and DualSPHysics delta-SPH (D-SPH) solvers, aligned to the
    experiment on gauge 1 (Readme.pdf).
- name: '*_B.csv (dense gauges), */inputFiles/*'
  type: modelled-reference
  description: Dense-gauge simulated series (150 gauges, 149 for D-SPH) and the solver input files. The
    B files are not used; the i-VoF and D-SPH input files were read by F74 for the geometry (see coordinates)
    and are not committed.
calibration: The Readme.pdf of the archive states that the repetitions were aligned on the gauge-1 signal
  to reduce trigger-time uncertainty and that the numerical series were upsampled and aligned to the experiment
  on gauge 1; gauge calibration and the uncertainty analysis are in the source paper, which this spike
  did not read.
schema: 'CSV with a gauge-number row, a header row (''time [s]'', then ''rep n [m]'', ''mean [m]'', ''expanded
  unc [m]'' per gauge for the experiment; ''surface elevation [m]'' per gauge for a model), then numeric
  rows. Experiment: 7 columns per gauge; model: 1 column per gauge.'
units: Time in seconds, surface elevation in metres.
cadence: Experiment 150 Hz for 180 s, with time stamps printed to five significant digits (a resolution
  of 1 ms after 10 s, so the stamps jitter by up to 0.33 ms about k/150 s); i-VoF 100 Hz from 0.01 to
  20 s; M-sigma 100 Hz from 0 to 30 s (B file from -1 s); D-SPH about 200 Hz from 0 to 14.1 s.
coordinates: 'Gauge numbers 1-20 along the flume. The x-positions (m from the wavemaker) are not in the
  data files or the Readme but are in the solver input files of the archive: the 20 sets of iVoF/inputFiles/iVoF_WC1_inputFiles/waveGaugesNProbes/WGset1_sets
  in order, and the same 20 positions in the gauges of the D-SPH definition XML (read 2026-10-27, F74);
  pbc.data.flume.GAUGE_X holds them. The same files give the still-water depth 0.3 m and the bar (i-VoF
  blockMeshDict: front slope from 2.813 m, crest 0.147 m deep from 4.323 to 5.327 m, lee slope to 6.112
  m; D-SPH: crest 0.150 m deep from 4.343 to 5.347 m), and the wave of condition 1 (period 1.5 s, height
  0.024 m in D-SPH, 0.025 m in i-VoF). Surface elevation is relative to still water.'
masks: 'Model files contain NaN: one at 19.82 s in i-VoF gauge 5, one at the last row (14.1 s) of D-SPH
  gauge 5, and a first row of NaN in the dense Msigma B file. The experiment has no NaN in wave condition
  1. The numerical series have start-up transients and end-of-run values near zero.'
uncertainty: The experiment carries the expanded uncertainty of the sample mean at 95 % confidence (0.32-0.56
  mm at gauge 5 over the first 30 s). The numerical series carry none.
size:
  description: Archive 78,610,248 bytes (234 MB unpacked, 45 files); the experimental CSVs are 40 MB each,
    the models 0.4-7 MB. The sample is wave condition 1 - gauge 5 to 30 s (4 files, 480 KB, F50) and,
    for the wave flume lab (F74), the experiment's other 19 gauges and the three models' A files with all
    20 gauges to 22 s (22 files, 6.55 MB); 26 files, 7.03 MB in all.
format: ZIP of CSV files (plus input archives and a PDF readme)
reader: pbc.data.flume.read_elevation (csv and NumPy); no new dependency.
