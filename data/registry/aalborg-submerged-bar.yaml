estimates:
  runtime: 'Reference figure from the sample: 1.4 s. From the full download: a 78.6 MB download and one
    40 MB CSV per wave condition to parse, a few seconds.'
  memory: About 120 MB peak resident from the sample; about 300 MB for a full experimental CSV as a float
    array.
  page_payload: 480 KB committed; a figure PNG of about 330 KB.
  ci: 'Offline: four committed files.'
decision:
  value: go
  date: *id001
  reasons:
  - 'Real files inspected and the archive''s Readme.pdf read: structure, alignment, and the 95 % uncertainty
    are documented.'
  - The measured series and the three modelled series are separate files with separate artifact types
    and are drawn apart.
  - 'Consistency: the dominant wave period over 2-14 s is 1.508 s in the experiment and 1.50 s in each
    model; over the window 5-14 s the RMS difference to the measured mean is 0.54 (i-VoF), 0.90 (M-sigma),
    and 0.86 mm (D-SPH) against a wave amplitude near 12 mm.'
  - CC BY 4.0 on the record covers local download, subsets, figures, and modification.
  - 'Caveats: the gauge positions and the wave conditions'' parameters are in the source paper, not read;
    the series outside the window show start-up transients and end-of-run artefacts, which a lesson must
    disclose.'
