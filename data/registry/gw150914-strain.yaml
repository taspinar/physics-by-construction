estimates:
  runtime: 'Reference figure: 3.7 s on the development laptop (whitening, spectrogram, 46-mass matched-filter
    scan).'
  memory: About 370 MB peak resident for the figure.
  page_payload: 2.5 MB committed for both detectors; a figure PNG of about 250 KB; a page would need only
    the figure, not the strain.
  ci: 'Offline: reads the two committed files; no portal contact.'
decision:
  value: go
  date: *id001
  reasons:
  - 'Real files inspected: 131072 samples each, rate and span match the headers, no NaN.'
  - The matched-filter fit of a leading-order template to the two files gives a network SNR of 22 at a
    detector-frame chirp mass of 36 Msun, 15 % above the published 28.6 Msun x (1 + 0.09), the expected
    bias of a leading-order template, and an H1-L1 delay of 7 ms, as published.
  - CC BY 4.0 on the record covers local download, subsets, figures, and modification, with a required
    acknowledgement text that the figure carries.
  - The sample is 2.5 MB; no new dependency is needed.
  - 'Caveat: a lesson needs signal-processing background (whitening, spectral estimation); that is a course-fit
    question for F51, not a data question.'
