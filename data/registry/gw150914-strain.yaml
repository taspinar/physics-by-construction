artifacts:
- name: H-H1_GWOSC_4KHZ_R1-1126259447-32.txt.gz
  type: calibrated-observation
  description: Calibrated strain h(t) of the LIGO Hanford detector, as released by GWOSC; instrument noise
    included, no signal subtracted.
- name: L-L1_GWOSC_4KHZ_R1-1126259447-32.txt.gz
  type: calibrated-observation
  description: Calibrated strain h(t) of the LIGO Livingston detector.
- name: whitened, band-passed strain (derived by pbc.data.reference.gw150914)
  type: calibrated-observation
  description: 'Not a data file: the figure''s processed series. Filtering is disclosed on the figure;
    it is labelled processed there.'
calibration: Strain is calibrated by the LIGO calibration pipeline before release; the plain-text product
  states no calibration uncertainty. The GWOSC event page and the data-release papers document it; this
  spike did not verify it.
schema: Gzip text. Three '#' header lines (event and detector, samples per second, starting GPS and duration),
  then 131072 lines with one strain value each.
units: Strain, dimensionless (about 1e-19 rms).
cadence: 4096 Hz, 32 s starting at GPS 1126259447; the event is at GPS 1126259462.4.
coordinates: GPS seconds since 1980-01-06 for time; H1 and L1 are separate files with their own detector-site
  clocks, the 6.9 ms light-travel delay is physical, not an offset in the files.
masks: 'None in the files: no NaN, no data-quality flags in the text product (the HDF5 product carries
  them).'
uncertainty: No per-sample uncertainty is released; the noise is the data's own spectrum, estimated from
  the 32 s (Welch).
size:
  description: 1.29 MB (H1) and 1.22 MB (L1) as gzip text for 32 s at 4096 Hz; the HDF5 and GWF products
    of the same segment are also published.
format: gzip-compressed plain text, one number per line
reader: pbc.data.gwosc.read_strain (standard library gzip and NumPy); the HDF5 product, which needs h5py,
  is not needed.
