artifacts:
- name: srm_660c_cifs_20201029_081700.zip, its 20 CIFs, blocks pd_proc_..._meas
  type: processed-measured
  description: 'The measured powder patterns that certified SRM 660c (per the CIF: "exactly the raw data
    sets used for certification"): NIST divergent-beam diffractometer, Cu K-alpha, post-specimen graphite
    analyzer, scintillation point detector, Bragg-Brentano, goniometer radius 217.5 mm. 24 scan windows
    per specimen, one per reflection from 100 to 511. Processed by NIST: 2theta is the item _pd_proc_2theta_corrected
    (the correction is not explained) and the counts are adaptively rebinned and given as counts over counting
    time with Poisson weights.'
- name: srm_660c_cifs_20201029_081700.zip, its 20 CIFs, blocks pd_proc_..._calc
  type: modelled-reference
  description: 'NIST''s fundamental-parameters model of each measured pattern on the same 2theta grid,
    with re-refined instrument parameters (per the CIF: "not the fits actually used in certification ...
    but give essentially the same results"), and its refined lattice parameter _cell_length_a. Not a measurement.'
- name: 660c_<specimen>.csv (20 files), specimens.csv
  type: processed-measured
  description: 'The committed samples: per specimen every row of the measured block (two_theta, intensity,
    weight) and the calculated intensity (calc_intensity, a modelled-reference column), converted by tools/datasets/srm660c_cif_to_csv.py
    with every token unchanged; specimens.csv holds the per-specimen items of the CIFs. The peak fits, the
    Nelson-Riley extrapolation, and the same analysis of NIST''s model are computed by pbc.data.reference.srm660c
    and are not part of the record.'
calibration: 'The lattice parameter rests on the Cu K-alpha-1 wavelength 0.15405929 nm of the certificate''s
  Table 1 (its analysis used the Cu K-alpha spectrum of Hoelzer et al. 1997); the CIFs name the radiation (Cu K-alpha) but carry no wavelength. The
  material is itself the calibrant: certified a = 0.4156826 nm +- 0.000008 nm (k = 2, Type B dominated)
  at 22.5 degC, traceable to the SI metre through the Cu K-alpha emission spectrum (certificate). The CIFs
  give the specimen temperature 20.85 degC and NIST''s re-refined a per specimen (4.156778 to 4.156802
  angstrom, mean 4.156789); the certificate adjusts to 22.5 degC with the thermal expansion of Sirota et
  al. (1998) but states no coefficient. The vertical specimen displacement is a refined item per CIF (-0.040
  to -0.136 mm); it is not removed from the 2theta values (the slope of each Nelson-Riley line follows it,
  correlation 0.9996).'
schema: 'Per specimen CSV: three comment lines (the zip and its sha256, the CIF member and its sha256,
  the conversion, the units), the header two_theta,intensity,weight,calc_intensity, and 5,332 rows. specimens.csv:
  two comment lines, the header specimen,temperature_c,vertical_displacement_mm,cell_length_a_angstrom,points,
  20 rows. Source: per CIF the data blocks diffrn_radiation, diffrn_detector, citation, cell_LaB6_660c,
  pd_spec_<id>, pd_instr_<id>, pd_proc_<id>_meas and pd_proc_<id>_calc, the last two a loop of
  _pd_proc_2theta_corrected, _pd_proc_intensity_total, _pd_proc_ls_weight on the same 2theta grid.'
units: 'two_theta in degrees (CIF dictionary); intensity counts divided by the counting time, whose unit
  the CIF does not state; weight 1/sigma^2 of intensity, sigma^2 = (N + 1)/tau^2 for N counts in a counting
  time tau (the CIF''s citation of Mendenhall et al. 2018); the weights imply tau from 1 to 49 per point.
  calc_intensity in the units of intensity. temperature_c in degC, vertical_displacement_mm in mm, cell_length_a_angstrom
  in angstrom (CIF dictionary).'
cadence: 'No time axis. Per specimen 24 scan windows between 20.3 and 150.908 degrees 2theta, each 1.5
  to 3.5 degrees wide around one reflection, with steps of 0.008 to 0.016 degrees within a window (wider
  at high angle) and gaps between windows; 171 to 276 points per window, 5,332 in all. The grids of the
  specimens differ slightly (adaptive rebinning).'
coordinates: 'Bragg-Brentano geometry, diffraction angle 2theta; the reflections indexed hkl of the cubic
  primitive lattice Pm-3m (LaB6), in the order of the certificate''s Table 1.'
masks: 'None in the record; every value is a number, every weight positive, no intensity negative. The
  analysis uses all points of each window; the Nelson-Riley extrapolation uses the 18 reflections above
  2theta = 60 degrees (the six below carry the axial-divergence asymmetry most, and are shown but not fitted).'
uncertainty: 'Per point: the Poisson weight of the record. Certified a: U = 0.000008 nm (k = 2), Type
  B dominated; the certificate''s Type A expanded uncertainty is 0.00000037 nm. Derived (dossier): the
  peak positions of the simple doublet fit have standard errors of 6.5e-6 to 1.6e-5 angstrom in a; the
  Nelson-Riley intercept is 4.156485 angstrom, SD 0.000014 over the 20 specimens, standard error of the
  mean 0.0000030 (repeatability, Type A). The same method on NIST''s model gives 4.156480: the method''s
  bias is -74 ppm, so the simple analysis does not reach the certified value within U (-82 ppm, 4.3 U,
  before any temperature adjustment); measured minus model by the same method is +1.1 ppm. The method''s
  bias is the dominant uncertainty of a simple-fit lab, and it is measured here, not estimated.'
size:
  description: 'Record: the zip 1,719,632 bytes (20 CIFs of 433,012 to 433,026 bytes and a __MACOSX
    folder) and its checksum file. Committed: 21 files, 2,964,966 bytes (20 per-specimen CSVs of 148,017
    to 148,369 bytes and specimens.csv of 1,112 bytes).'
format: CIF (IUCr Crystallographic Information File) in a zip; the committed samples are CSV.
reader: 'CIF: converted once, outside the build, by tools/datasets/srm660c_cif_to_csv.py (standard library
  only; input sha256 92034d06498161db365420831fe35d91ec18bad4ed17385329a1761658da2c42 of the zip pinned
  in the script, the sha256 of each member in the first line of its CSV; output sha256 per file under
  samples). CSV: pbc.data.reference.srm660c.read_pattern and read_specimens (NumPy). No new dependency.'
