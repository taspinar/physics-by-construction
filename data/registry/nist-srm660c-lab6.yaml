estimates:
  runtime: Reference figure about 9 s with the interpreter start (40 patterns of 24 windows fitted).
  memory: About 170 MB peak resident for the figure.
  page_payload: 2.96 MB committed, read at build time and not shipped; a figure PNG of about 410 KB.
  ci: 'Offline: 21 committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: the zip of the record, sha256 equal to NIST''s; its 20 CIFs converted to CSV by a
    pinned script with every token unchanged, checked against a second, independent parse.'
  - 'Bragg''s law with the certificate''s Cu K-alpha-1 wavelength indexes all 24 windows (fitted positions
    within 0.04 degrees of the certificate''s Table 1) and gives a = 4.156485 angstrom, SD 0.000014 over
    20 specimens, by a doublet fit and a Nelson-Riley extrapolation that a course can repeat.'
  - 'Calibration and its limit stated and measured: the certified a (0.4156826 nm +- 0.000008 nm, k = 2,
    22.5 degC) is the calibration; the simple method misses it by -82 ppm, and the same method applied
    to NIST''s own model pattern misses NIST''s refined a by -74 ppm, so the gap is the method''s (a symmetric
    profile for an asymmetric instrument profile), not the data''s: measured minus model by the same method
    is +1.1 ppm.'
  - NIST data under https://www.nist.gov/open/license (Fair Use of Other NIST Data/Works); local download,
    subsets, figures, and modification permitted with acknowledgement and a notice of change.
  - 'Recorded by F106 (Issue #443) under the owner''s approval of 2026-11-09 on the Issue: work towards a
    go, judged per dossier, with every requirement of ADR 007 checked in the dossier.'
dossier: docs/datasets/nist-srm660c-lab6.md
reference_module: srm660c
reference_figure:
  status: processed
  residuals: true
listing:
  name: 'NIST SRM 660c LaB6 (MAT5, Issue #443)'
  kind: X-ray powder patterns of a certified lattice-parameter standard, 20 specimens, with NIST's model
conversions:
- script: tools/datasets/srm660c_cif_to_csv.py
  input: '`srm_660c_cifs_20201029_081700.zip` (`92034d06498161db365420831fe35d91ec18bad4ed17385329a1761658da2c42`),
    its 20 CIFs'
  output: '`660c_100a.csv` to `660c_1000b.csv` and `specimens.csv` (the 21 sha256 on the card)'
  command: |
    ./scripts/fetch-data.sh nist-srm660c-lab6
    uv run python tools/datasets/srm660c_cif_to_csv.py \
        data/downloads/nist-srm660c-lab6/srm_660c_cifs_20201029_081700.zip \
        data/samples/nist-srm660c-lab6
  note: The script refuses any other zip, a missing or extra CIF, a pattern block of another layout, and
    measured and calculated blocks on different 2θ grids.
