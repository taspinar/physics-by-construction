artifacts:
- name: tess2020238165205-s0029-0000000100100827-0193-s_lc.fits
  type: calibrated-observation
  description: 'SPOC light curve of TIC 100100827 (WASP-18): simple aperture photometry (SAP_FLUX) of
    calibrated pixels and PDCSAP_FLUX, the same flux corrected by the pipeline for instrumental systematics
    (PDCMETHD msMAP) and for the flux of other stars in the aperture (CROWDSAP 0.984) and outside it
    (FLFRCSAP 0.949), with errors, background, centroids, and quality flags; 18,864 cadences of 120 s.'
- name: wasp18_s0029_lc.csv
  type: calibrated-observation
  description: 'The committed sample: the columns TIME, PDCSAP_FLUX, PDCSAP_FLUX_ERR, QUALITY of every
    row of the FITS table, converted by tools/datasets/tess_lc_to_csv.py with no value changed. The normalisation,
    the folding, and the transit fit of the reference figure are computed by pbc.data.reference.tess_wasp18,
    are not part of the record, and are drawn apart from the measurement.'
calibration: 'By the SPOC pipeline before release (pixel calibration, background subtraction, aperture
  photometry, systematics correction by co-trending basis vectors, crowding and flux-fraction corrections;
  keywords PDCMETHD, CROWDSAP, FLFRCSAP of the FITS header). No calibration is applied here; the reference
  analysis divides each transit by a parabola fitted to the flux outside it.'
schema: 'CSV with four comment lines (source file and its sha256, the conversion, the units) and the header
  time,pdcsap_flux,pdcsap_flux_err,quality; 18,864 rows, one per cadence, in the order of the FITS table.
  Source: the BINTABLE LIGHTCURVE (HDU 1, 20 columns) of the FITS file; HDU 0 is the primary header, HDU
  2 the 11 x 11 aperture image.'
units: 'From the FITS header (TUNITn): time in BJD - 2457000, days (TIMESYS TDB, TIMEREF SOLARSYSTEM, barycentric);
  pdcsap_flux and pdcsap_flux_err in e-/s; quality an integer bit mask without a unit.'
cadence: '120 s (TIMEDEL 0.0013889 d; every finite step 120.0 s): 18,864 cadences from BJD - 2457000 =
  2088.2377 to 2114.4366 (DATE-OBS 2020-08-26 to DATE-END 2020-09-21); time stamps missing for 681
  cadences between 2101.378 and 2102.325.'
coordinates: 'TIC 100100827 (WASP-18), RA 24.35431 deg, Dec -45.67788 deg (RA_OBJ, DEC_OBJ), TESS magnitude
  8.83; times at the solar-system barycentre.'
masks: 'Missing values are nan (time for 681 cadences, all flagged 8; PDCSAP flux and error together for
  4,503). QUALITY is the SPOC bit mask, nonzero for 4,506 cadences (values 8, 32, 128, 160, 164, 168, 512,
  4096, 32768); the bits are defined in the TESS Science Data Products Description, not in the file. The
  reference analysis keeps the 14,358 cadences with quality 0 and finite values; PDCSAP is missing from
  2098.44 to 2102.33 and after 2112.14.'
uncertainty: 'PDCSAP_FLUX_ERR per cadence, about 540 ppm of the flux (1-sigma, from the pipeline). Derived
  (dossier): the shape fit to 21 transits gives reduced chi-square 1.16 with these errors, so they describe
  the scatter to within 8 %; p = 0.09795 +- 0.00039, a = 3.437 +- 0.035 stellar radii, b = 0.400 +- 0.027,
  P = 0.9414504 +- 0.0000044 d. The 21 mid-times scatter about the ephemeris with chi-square 41.8 for 19
  degrees of freedom, so the timing errors are about 1.5 times too small. As a sensitivity analysis of
  the normalisation, windows of +-0.12 and +-0.20 d move p by -0.00026 and +0.00023, and a straight baseline
  instead of the parabola makes the transit 196 ppm deeper; no bound on the pipeline''s systematics or crowding
  corrections, which the record does not give.'
size:
  description: 'The FITS file is 1,915,200 bytes; the CSV sample with all 18,864 rows of four columns is
    703,878 bytes.'
format: FITS (binary table); the committed sample is CSV.
reader: 'FITS: converted once, outside the build, by tools/datasets/tess_lc_to_csv.py (NumPy only; input
  sha256 c89434e50db863e589c9321cf29c93e449ef1526f1a9db19552446b721fd0949 pinned in the script, FITS CHECKSUM
