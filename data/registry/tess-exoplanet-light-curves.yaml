estimates:
  runtime: 'Reference figure: about 6.5 s with the interpreter start (the two-pass fit about 4 s); the
    sensitivity analysis 11 s more.'
  memory: About 190 MB peak resident for the figure.
  page_payload: 704 KB committed, read at build time and not shipped; a figure PNG of about 300 KB.
  ci: 'Offline: one committed file.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: 18,864 cadences of 120 s over 26.2 days, 14,358 good; sha256 recorded, FITS
    CHECKSUM of all three HDUs verified; converted to CSV by a pinned script with no value changed.'
  - 'The AST7 transit with quadratic limb darkening describes 21 complete transits with reduced chi-square
    1.16 on the pipeline''s errors: depth 10,696 ppm, T14 = 2.188 h, b = 0.400, a = 3.437 stellar radii,
    P = 0.9414504 d measured from the mid-times.'
  - Uncertainties from PDCSAP_FLUX_ERR, tested by the reduced chi-square and the mid-time scatter (1.5
    times the errors); the normalisation window and baseline reported as a sensitivity analysis; the
    pipeline's corrections are stated, not re-derived.
  - Public domain under the MAST data use policy, no exclusive access for TESS; local download, subsets,
    figures, and modification permitted, with the TESS acknowledgement.
  - 'Recorded by F104 (Issue #420) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go on the strength of the research, with every requirement of ADR 007 checked in the dossier.'
