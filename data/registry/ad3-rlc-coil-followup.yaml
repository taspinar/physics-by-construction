  licence: CC-BY-4.0
  local_download:
    answer: permitted
    source: 'The owner''s standing decision of 2026-11-27 for the project''s own measurements (Issue #614,
      https://github.com/taspinar/physics-by-construction/issues/614#issuecomment-7210910945), applied to this
      dataset in the owner''s start of part 2b of 2026-11-28 (https://github.com/taspinar/physics-by-construction/issues/619);
      the owner confirms it for this dataset on Issue #619 before the merge. The terms at
      https://creativecommons.org/licenses/by/4.0/legalcode permit reproducing and sharing the material'
  redistribution_of_subsets:
