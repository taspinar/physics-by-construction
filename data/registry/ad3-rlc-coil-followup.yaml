  runtime: 'Reference figure: about 3 s with the interpreter start. The CI evaluation of the session by the registered
    rules (the original track of the Research Workspace, its simulated controls included) and the other tests of the
    dataset: about 10 s.'
  memory: About 150 MB peak resident for the figure.
  page_payload: 2.8 MB committed, none of it sent to a reader's browser.
  ci: 'Offline: the committed files; the evaluation needs no device, no SDK, no meter, and no network.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: six sweep exports of 2026-11-28 and one of 2026-11-26, the session''s records, the fifteen
    readings of M4, the two notes, and the evaluation of 2026-11-28. The registered rules applied to the repository''s
    part give the evaluation''s outcomes, quantities, report, ledger and log (tests/unit/test_data_ad3_rlc_coil_followup.py).'
  - 'Published as recorded, with the failed and invalid attempts: the early M0, the first set of readings of M4 on
    the wrong range, and the meter check after M5 are kept and described; nothing was selected by its result.'
  - 'The owner''s own measurements under CC BY 4.0 by the owner''s decision of 2026-11-27 (Issue #614), applied to
    this dataset in the start of part 2b on Issue #619.'
