    source: 'The owner''s decision of 2026-11-27 (Issue #614, issuecomment-7210910945), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 2(a)(1) permits producing and sharing adapted
      material'
  modification_and_attribution:
    answer: permitted
    source: 'The owner''s decision of 2026-11-27 (Issue #614, issuecomment-7210910945), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 3(a) requires the creator, the licence, a link,
      and an indication of changes (the device identifier, MANIFEST.tsv)'
  attribution: Taspinar, A., 'The coil-loss follow-up on the series RLC circuit of the F140 pilot, bench session of
