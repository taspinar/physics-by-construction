id: ad3-rlc-coil-followup
title: F155 coil-loss follow-up, the registered bench session of 2026-11-28 on the series RLC circuit of the F140 pilot
  (Analog Discovery 3 sweeps, multimeter readings) and one diagnostic sweep of 2026-11-26
source:
  url: https://github.com/taspinar/physics-by-construction/issues/619
  creator: Ahmet Taspinar (the project's owner, at the bench), with the physics lab's live mode (pbc.products.physics_lab)
    and a Mastech MAS830BC multimeter; the supervising agent session attended and evaluated the session
  version: 'Version 1.0.0 of the packaged dataset (data/publish/ad3-rlc-coil-followup.toml): the session of 2026-11-28
    (six sweep exports M0, M0-repeat, M1, M2, M3, M5; session.toml; readings.toml; two notes; the evaluation of that
    day) and the diagnostic sweep of 2026-11-26, as recorded, with the device serial replaced by AD3-001'
  accessed: &accessed 2026-11-28
