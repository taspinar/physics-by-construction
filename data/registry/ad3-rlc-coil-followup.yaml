    source: 'The owner''s decision of 2026-11-27 (Issue #614, issuecomment-7210910945), CC BY 4.0;
      https://creativecommons.org/licenses/by/4.0/legalcode section 2(a)(1) permits sharing the material in whole
      or in part; the split between the repository and the archive is the owner''s start of part 2b on Issue #619'
  publication_of_figures:
