artifacts:
- name: raw.csv
  type: raw-measured
  description: Every sample of every record of a sweep (point, frequency, amplitude, time, channel 1 at W1, channel
    2 at the probed node), in volts as the device returned them. Committed for the attempts the registered rules
    read (M0-repeat, M1, M2, M3, M5); the early M0 (attempt 1) and the diagnostic sweep have theirs in the archive
    only.
- name: run.json
  type: processed-measured
  description: The run record of each sweep as the physics lab exported it - the protocol, the device (serial replaced
    by AD3-001), the configuration with the registered input and the device's conditions at the start and end, the
    units, the processing, the start and end times, and the evaluator's check against the closed form of the declared
    circuit.
- name: points.csv
  type: processed-measured
  description: One row per frequency of a sweep - the gain and phase of channel 2 over channel 1 from the least-squares
    phasor fit of each record (the processing the registration names), as the physics lab wrote them.
- name: evidence.json
  type: processed-measured
  description: The evidence log of each sweep (task, hypothesis, assumptions, protocol version, the code and configuration
    digests, the attempt, the evaluation). The SHA-256 of raw.csv in it is the original file's.
- name: report.md and frequency-response.svg
  type: processed-measured
  description: The physics lab's report and figure of each sweep, as exported (not edited). The figure is in the
    archive only (the repository commits no generated image outside site/assets/).
- name: readings.toml
  type: raw-measured
  description: The fifteen readings of M4 on the 200 ohm range of the multimeter (Z1, R_dc_bb, R_dc, R_s_bb, Z2,
    three each), each with the meter, the range, the resolution, the registered specification, and the time, as the
    owner wrote them.
- name: session.toml, M4-first-attempt-invalid.md, meter-check-exploratory.md
  type: raw-measured
  description: The session's records as the owner and the supervisor wrote them - the plug-in time, the outcome
    code's pin, the room temperature, every attempt with its outcome and reason; the first set of readings of M4,
    taken on the 200 mV range (every value 0.0, used by no rule); the check of the meter after M5, outside the
    registration.
- name: evaluation-2026-11-28
  type: processed-measured
  description: The evaluation of the session by the Research Workspace at commit a1109da (outcome code 974bf992...,
    the pinned one) - run.json, ledger.json, log.json, report.md; its view.html is in the archive only. Its run.json
    records the SHA-256 of the session's original files.
calibration: 'The AD3: the factory calibration, not adjusted (each run record says so); channel 1 on the 5 V range,
  channel 2 on the 50 V range, both against ground. M3 measures the two channels'' relative gain and phase at the
  13 frequencies on this device. The multimeter (Mastech MAS830BC) is not calibrated; its specification is the
  registered one (0.8 % of the reading + 3 digits on the 200 ohm range, from the manual of the MAS830B). In this
  session the meter did not measure resistance correctly: R_s_bb read 8.3, 7.6, 8.8 ohm for a resistor of 100 ohm
  +- 1 %, and the check after M5 read the loose resistor at 10.1 ohm; the cause is not established.'
schema: 'Under exports/2026-11-28-coil-loss/: session.toml, readings.toml, the two notes, one folder per sweep attempt
  (M0, M0-repeat, M1, M2, M3, M5) with run.json, points.csv (frequency_hz, amplitude_v, gain, phase_deg), evidence.json,
  report.md, and raw.csv (point, frequency_hz, amplitude_v, t_s, source_v, response_v) where
  committed, and evaluation-2026-11-28/ (run.json, ledger.json, log.json, report.md). Under
  exports/2026-11-26-pilot-input-diagnostic/: the same files of one sweep, without raw.csv. MANIFEST.tsv: path, bytes,
  sha256, original_sha256, derivation.'
units: 'Stated in run.json: frequency Hz, amplitude V, time s, source and response V, gain V/V, phase degrees; the
  readings in ohm; temperatures in degrees C.'
cadence: 'M0 (attempt 1) at 06:01:25 UTC on 2026-11-28, M0-repeat at 06:45:10, M1 06:45:41, M2 06:46:22, M3 06:47:19,
  the readings of M4 from 07:13 to 07:20 (08:13 to 08:20 local), M5 at 07:25:54. A sweep is 13 coarse points from
  5 kHz to 200 kHz (log-spaced, 8 periods of 64 samples each, 1 V), with 6 refinements near the -90 degree crossing
  at the capacitor node (M0, M1, the diagnostic). The diagnostic sweep at 12:36:51 UTC on 2026-11-26.'
coordinates: 'One breadboard series RLC circuit, W1 -> 100 ohm -> coil (nominal 1 mH) -> node A -> capacitor (nominal
  10 nF) -> ground, the pilot''s by the owner''s statement (the parts not touched since 2026-11-26). Probes: M0, M1 and
  the diagnostic at node A; M2 and M5 at the R-L node; M3 both at W1. Device AD3-001 (an Analog Discovery 3; the
  serial replaced), WaveForms SDK 3.25.1. Plugged in at 06:57 local (+01:00), the room 18.5 degrees C at 07:00 (the
  wall thermostat); unplugged for M4 at about 07:50 local and plugged in again shortly before M5.'
masks: 'None: every attempt, reading, and note is kept; the early M0, the first set of readings of M4 (on the wrong
  range), and the meter check after M5 included. Only their roles differ, as session.toml and the notes record them.'
uncertainty: 'The registered model of the readings (the plan''s registration, "Meter readings") and the standard
  errors of the phasor fits, as the Research Workspace applies them; no per-point uncertainty is in points.csv. The
  meter''s readings in this session are not consistent with the 100 ohm resistor (R_s_bb minus the zero is about
  3 ohm), so every registered quantity that rests on R_s_bb (R_L, R_L0, L, C, Rise, D) rests on a reading the check
  of the registration puts outside its band.'
size:
  description: 'The repository holds 44 files, 2,424,584 bytes: every file of both folders but the raw samples of the
    early M0 and of the diagnostic sweep, the evaluation''s view.html, and the seven figures frequency-response.svg,
    with MANIFEST.tsv, README.md, CITATION.cff.
    The archive holds all 51 files of the two folders and the packager''s three (54 files), 1,194,207 bytes
    compressed.'
format: TOML, CSV (plain text), JSON, Markdown; the archive a ZIP of the same with the SVG figures and one HTML file
reader: pbc.data.reference.ad3_rlc_coil_followup (attempts, readings, points, the tomllib, csv and json modules of
  the standard library); the registered rules are pbc.products.research_workspace.followup.evaluate with the pinned
  outcome code. No new dependency.
