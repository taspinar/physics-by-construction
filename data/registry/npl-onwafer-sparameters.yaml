estimates:
  runtime: 'Reference figure: 1.4 s.'
  memory: About 130 MB peak resident for the figure.
  page_payload: 230 KB committed; a figure PNG of about 190 KB.
  ci: 'Offline: four committed files.'
decision:
  value: go
  date: *id001
  reasons:
  - 'Real files inspected: 191 and 871 frequency points, 50 ohm reference, no missing values.'
  - 'Physical consistency holds on all four files: largest singular value of S is at most 0.78 (passive),
    |S21 - S12| is at most 1.3e-3 (reciprocal) for the coaxial files and 2.5e-2 for the single sweep,
    and the attenuators measure -3.9, -6.8, and -10.5 dB, ordered as labelled.'
  - Two instruments measured the same 3 dB pad and agree within 0.042 dB in |S21| over 2.5-50 GHz.
  - CC BY 4.0 on the record covers local download, subsets, figures, and modification.
  - 'Caveat: the calibration standards and uncertainty are in the ARFTG paper, which was not read; a lesson
    must read it before it states uncertainties.'
