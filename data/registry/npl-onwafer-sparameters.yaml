artifacts:
- name: coaxial_*_CORR.s2p
  type: calibrated-observation
  description: Coaxial-system VNA measurement of 3, 6, and 10 dB on-wafer attenuators, 2.5-50 GHz in 250
    MHz steps; the '_CORR' files are calibrated with multiline TRL (readme.txt).
- name: broadband_3dB_attenuator_0601_CORR.s2p
  type: calibrated-observation
  description: Single-sweep broadband VNA measurement of the 3 dB attenuator, 2.5-220 GHz in 250 MHz steps,
    multiline-TRL calibrated.
calibration: Multiline TRL on-wafer calibration, applied by the creators ('_CORR'; readme.txt). The calibration
  standards and their uncertainty are described in the ARFTG paper, which this spike did not read; the
  files carry no uncertainty.
schema: 'Touchstone 1.0 two-port: option line ''# Hz S RI R 50.0'', comment lines, then rows ''freq ReS11
  ImS11 ReS21 ImS21 ReS12 ImS12 ReS22 ImS22''. Written by scikit-rf per the first comment line.'
units: Frequency in Hz; S-parameters dimensionless complex amplitude ratios in real/imaginary form, 50
  ohm reference.
cadence: '250 MHz frequency step: 191 points for 2.5-50 GHz (coaxial), 871 points for 2.5-220 GHz (single
  sweep).'
coordinates: Port 1 and port 2 of the device on the wafer; S21 is transmission from port 1 to port 2 (Touchstone
  order S11 S21 S12 S22).
masks: 'None: no missing values in the four sampled files.'
uncertainty: None in the files. The paper compares two instruments; this spike's cross-check shows the
  3 dB pad's |S21| differing by at most 0.042 dB between the coaxial and the single-sweep file over 2.5-50
  GHz.
size:
  description: Archive data.zip 3,130,325 bytes with 20 S2P files of 25-161 KB; the sample is four files,
    230 KB.
format: Touchstone S2P (plain text) in a zip archive
reader: pbc.data.touchstone.read_touchstone (NumPy only); an in-repository parser, so no new locked dependency
  is added.
