artifacts:
- name: stundenwerte_EB_03987_19510101_20251231_hist.zip
  type: raw-measured
  description: 'DWD''s archive of the station: the product file produkt_eb_stunde_19510101_20251231_03987.txt
    (322,776 rows; soil temperature at 2, 5, 10, 20, 50, and 100 cm; hourly from April 2001, three or
    four readings a day before) and the metadata files of the station, its instruments, parameters, operators,
    and missing values. The readings are the thermometers'' (PT100 since 1978-03-01), after DWD''s automatic
    control and correction (quality level QN 3 for every row used here).'
- name: eb_stunde_03987_2015_2024_6h.txt
  type: processed-measured
  description: 'Sample: the header and the 14,610 rows of the product file at 00, 06, 12, and 18 h of
    2015-2024, each line unchanged; selected for the annual wave.'
- name: eb_stunde_03987_jja_2020_2024_1h.txt
  type: processed-measured
  description: 'Sample: the header and the 11,040 hourly rows of June, July, and August 2020-2024, each
    line unchanged; selected for the daily wave.'
- name: Metadaten_Geographie_03987.txt, Metadaten_Geraete_Erdbodentemperatur_03987.txt, Metadaten_Parameter_eb_stunde_03987.txt,
    Metadaten_Stationsname_Betreibername_03987.txt
  type: raw-measured
  description: 'The station''s position, instruments with their depths, parameters with their sources
    and units, and operators, copied from the archive unchanged (ISO-8859-1). The harmonic fits, the diffusivities,
    and the model curves of the reference figure are computed by pbc.data.reference.dwd_soil and are not
    part of the record.'
calibration: 'None applied here. The record documents no calibration of the PT100 sensors and no accuracy;
  DWD''s automatic control and correction (QN 3) is the only processing of the values, described in the
  dataset description (QualiMet; Kaspar et al. 2013, doi:10.5194/asr-10-99-2013).'
schema: 'Semicolon-separated text, CRLF line ends, one header line STATIONS_ID;MESS_DATUM;QN_2;V_TE002;V_TE005;V_TE010;V_TE020;V_TE050;V_TE100;eor,
  then one row per reading time with the station id (3987), the time stamp YYYYMMDDHH, the quality level,
  six temperatures, and the end-of-record marker "eor". Fields are padded with spaces to fixed widths.'
units: 'Temperatures in degC with one decimal (the dataset description and Metadaten_Parameter); MESS_DATUM
  as YYYYMMDDHH (the time zone is not stated in the files or the description, and the analysis uses only
  periods and differences between depths); QN_2 a code without a unit. Depths 0.05, 0.10, 0.20, 0.50,
  1.00 m below ground (Metadaten_Geraete, Geberhoehe -0.05 to -1 m).'
cadence: 'Product file: hourly from 2001-04 (SYNOP), three or four readings a day before. Sample: four
  readings a day (00, 06, 12, 18 h) 2015-01-01 to 2024-12-31, and hourly June to August 2020-2024 (every
  step 1 h).'
coordinates: 'Station 03987 Potsdam, 52.3812 N, 13.0622 E, 80.86 m above sea level,
  unchanged since 1893 (Metadaten_Geographie); sensors at 5, 10, 20, 50, and 100 cm below the ground.'
masks: 'Missing values are -999. V_TE002 (2 cm) is -999 in every row after 1972 (measured 1951-1972
  only). In the sample: two rows absent from the file (2023-09-05 12 h and 18 h); one 6-hourly row (2023-09-04
  12 h) missing 5, 10, and 20 cm; three hourly rows (2023-08-24 14-16 h) missing 5 and 10 cm. Every
  row of the sample has QN 3. The analysis drops missing values from each fit and uses only complete days
  for the daily wave (459 of 460).'
uncertainty: 'The record states no sensor accuracy and no tolerance of the depths; readings are given
  to 0.1 K. Derived (dossier): the diffusivity from the annual wave (2015-2024) is 1.015 +- 0.025 (amplitude)
  and 1.147 +- 0.009 (phase) x 1e-6 m2/s, from the daily wave (June-August 2020-2024) 1.084 +- 0.013
  and 1.119 +- 0.009, each a standard error of the mean over the single years or summers. The four estimates
  differ by more than these errors (1.01 to 1.15), and adjacent pairs of depths give 0.88 to 1.53 (2.49
  for the annual amplitude between 5 and 10 cm, a 1 % change in amplitude): the soil is not uniform, which
  the homogeneous model does not describe. The spread of the four, about +-7 %, is the uncertainty of the
  model, larger than the statistical one. Not bounded: the depths (kappa scales with the square of the
  depth spacing) and the sensors.'
size:
  description: 'The archive is 2,773,485 bytes (11 members, 25,468,746 bytes unpacked; the product file
    24,347,827 bytes). The sample is 1,955,682 bytes: 1,110,441 (6-hourly), 839,121 (hourly), and 6,120
    of metadata.'
format: Semicolon-separated text in a zip archive; the committed sample is lines of it, unchanged.
reader: 'Zip: extracted once, outside the build, by tools/datasets/dwd_soil_extract.py (standard library;
