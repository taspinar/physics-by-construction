estimates:
  runtime: 'Reference figure: about 4.5 s with the interpreter start; the analysis alone under 2 s.'
  memory: About 170 MB peak resident for the figure.
  page_payload: 1.96 MB committed, read at build time and not shipped; a figure PNG of about 430 KB at
    150 dpi.
  ci: 'Offline: six committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: the DWD archive of station 03987 (2,773,485 bytes, sha256 equal to the research''s),
    its product file and metadata read; the sample is 25,650 rows of it, lines unchanged, written by a
    pinned script.'
  - 'The heat equation of T6 for a periodic surface temperature describes the annual wave at five depths
    and the daily wave at four with residuals of at most 0.015 in ln A and 0.05 rad: kappa 1.01 to 1.15
    x 1e-6 m2/s from amplitude and phase, a damping depth of 3.2-3.4 m for the year and 0.17 m for the
    day.'
  - Uncertainties as the scatter between years and summers; the disagreement of the estimates and of the
    pairs of depths reported as the limit of the homogeneous model; sensor accuracy and depth tolerance
    stated as not given by the record.
  - CC BY 4.0 by DWD's terms of use and the dataset description; local download, subsets, figures, and
    modification permitted, with the source note.
  - 'Recorded by F84 (Issue #438) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go, judged per dossier, with every requirement of ADR 007 checked in the dossier; the archive without
    a DOI pinned by the project''s own checksum, as the owner accepted.'
