estimates:
  runtime: 'Reference figure: about 4 to 6 s with the interpreter start on the development machine (the
    30 fits and the 124 fits of the Y profile); the reader parses the five files in milliseconds.'
  memory: About 150 MB peak resident for the figure.
  page_payload: 10.3 kB committed, none of it sent to the reader's browser; a figure PNG of about 400
    kB at 150 dpi.
  ci: 'Offline: five committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'The archive''s sha256 matches the one recorded on Issue #470; its 175 members were listed before
    extraction (flat, no path, no symlink, largest 5,833 bytes); five members extracted by name and committed
    unchanged, 10,304 bytes.'
  - 'Schema, units, header lines, masks, the signs of Vgas, and the bulge columns validated by the parsing
    test; the Y = 1 normalisation of Vdisk confirmed on every file by the ring sum of SBdisk (ratio 1.02
    to 1.09).'
  - 'A reproducible figure from source-controlled code: without a halo no Y fits (chi2/dof 175 to 1026);
    with a halo, chi2/dof 1.2 to 1.4 for NGC 3198 and NGC 2841; the cusp fails DDO 154 (8.7 against 2.2);
    the fitted Y of NGC 2403 is 0.29 with a cusp and 0.76 with a core; the bar region of NGC 2903 lies
    64 to 70 km/s below both halo fits.'
  - 'Uncertainty: errV per point, without the inclination and distance; its effect on chi-square and Y
    shown with an illustrative floor. Calibration: Y is the fitted free calibration of the model.'
  - 'Rights: written permission of F. Lelli (SPARC team) of 2026-11-10 to include the Rotmod files in
    the public repository with the SPARC website and the reference paper provided, accepted by the owner
    on 2026-11-10 for the files and the figures and animations derived from them; a recorded written
    permission of the rights holder under the ADR 007 addendum (#417).'
  - 'Recorded by F105 phase 1 (Issue #470) under the owner''s approval of 2026-11-10 on the Issue: work
    towards a go for this dataset, judged per dossier (https://github.com/taspinar/physics-by-construction/issues/470).'
dossier: docs/datasets/sparc-rotation-curves.md
