estimates:
  runtime: 'Reference figure: about 5 s with the interpreter start on the development machine; the reader
    parses the six CSV files in under 1 s.'
  memory: About 160 MB peak resident for the figure.
  page_payload: 1.74 MB committed, none of it sent to the reader's browser; a figure PNG of about 340
    KB at 150 dpi.
  ci: 'Offline: eight committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected at a pinned commit: each Git blob SHA-1 equals the tree''s, the sha256 of each
    is on this card; five raw records (one per length, air only, first trial) of 6,584 to 6,896 rows
    at 0.01 s, the cleaned file shown to be a window of the raw one.'
  - 'Schema, units, encoder step, cadence, and empty cells validated by the parsing test; the angular
    velocity shown to be the software''s derivative of the angle, not a second measurement.'
  - 'A reproducible figure from source-controlled code: the elliptic-integral correction reduces the
    slope of the period with amplitude from 0.5 to 1.9 ms per degree to -0.17 to +0.41 ms per degree;
    the small-amplitude period of each length is 0.9952 to 1.5688 s.'
  - 'The length L is undefined in the record: the period defines an effective length 3.9 to 9.8 mm above
    each stated length; a lab fits L_eff or g, not both from these lengths. Stated in the dossier.'
  - 'Uncertainty derived from the cycles and the encoder step; the spread of the trials and the remaining
    amplitude dependence reported as systematic. No calibration beyond the sensor''s is needed for the
    angle.'
  - Apache-2.0 at the commit covers download, subsets, figures, and modification; it is equivalent recorded
    permission under the ADR 007 addendum (#417). The LICENSE travels with the sample.
  - 'Recorded by F83 (Issue #437) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go for this dataset, judged per dossier.'
