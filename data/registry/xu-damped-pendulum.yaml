id: xu-damped-pendulum
title: Xu et al. damped pendulum, PASCO rotary-encoder records of 5 lengths x 3 damping settings x 3 trials;
  inspected the first air-only trial of each length; the M15 lab adds the cleaned files of the other
  air-only trials and of the large-baffle trials of the shortest length
source:
  url: https://github.com/EnzeXu/Damped_Pendulum_Dataset/tree/cbf82673641ecd65e902ad5c38a048387649a2a0
  creator: Enze Xu, Toon Tran, Hongjue Zhao, Yuchen Wang, Mengdi Huai, Huajie Shao (William & Mary),
    the authors of 'Identifying Invariant Physical Dynamics Across Multiple Environments', Transactions
    on Machine Learning Research (2026), https://openreview.net/forum?id=xvQYvYEGhj; recorded in the
    Physics Department of William & Mary
  version: 'GitHub repository EnzeXu/Damped_Pendulum_Dataset at commit cbf82673641ecd65e902ad5c38a048387649a2a0
    (2026-09-16, ''Update citation in README.md''); no DOI, no release, no version number, so the commit
    is the version'
  accessed: &accessed 2026-11-09
rights:
  licence: equivalent-permission
  local_download:
    answer: permitted
    source: 'Apache License 2.0, the file LICENSE of the repository at the commit (https://github.com/EnzeXu/Damped_Pendulum_Dataset/blob/cbf82673641ecd65e902ad5c38a048387649a2a0/LICENSE,
      GitHub API spdx_id Apache-2.0), named by the README''s section License ("This project is licensed
      under the Apache License 2.0"), read 2026-11-09; https://www.apache.org/licenses/LICENSE-2.0 section
      2 grants the right to reproduce the Work. Apache-2.0 is an equivalent recorded permission by the
      ADR 007 addendum (Issue #417, 2026-11-08)'
  redistribution_of_subsets:
    answer: permitted
    source: 'https://www.apache.org/licenses/LICENSE-2.0 section 2 (reproduce, distribute) and section
      4 (redistribution in any medium, with or without modifications, if a copy of the licence is given,
      modified files are marked, and notices are kept); the repository has no NOTICE file at the commit.
      The sample carries the LICENSE file and copies each data file byte for byte. Read 2026-11-09'
  publication_of_figures:
    answer: permitted
    source: 'https://www.apache.org/licenses/LICENSE-2.0 section 2 (prepare Derivative Works of, publicly
      display, and distribute the Work and such Derivative Works); the licence of the repository at the
      commit, read 2026-11-09'
  modification_and_attribution:
    answer: permitted
    source: 'https://www.apache.org/licenses/LICENSE-2.0 section 4(b) and 4(c): a modified file carries
      a notice that it was changed, and attribution notices are kept; the README asks users to cite the
      TMLR paper. The sample modifies no file; the figure names the record, the commit, the licence, and
      what its code computed'
  attribution: Xu, E., Tran, T., Zhao, H., Wang, Y., Huai, M., Shao, H., 'Damped Pendulum Dataset', GitHub
    EnzeXu/Damped_Pendulum_Dataset, commit cbf82673641ecd65e902ad5c38a048387649a2a0, Apache License 2.0;
    the dataset of 'Identifying Invariant Physical Dynamics Across Multiple Environments', Transactions
    on Machine Learning Research (2026), https://openreview.net/forum?id=xvQYvYEGhj. Files raw_data/len1..5_cond1_1.csv,
    cleaned_data/len1_cond1_1.csv, cleaned_data/len1..5_cond1_2..3.csv, cleaned_data/len1_cond3_1..3.csv,
    pendulum_length.json, and LICENSE, unmodified.
artifacts:
- name: raw_data/len<k>_cond1_1.csv (k = 1 to 5)
  type: raw-measured
  description: 'PASCO software export of the Wireless Rotary Motion Sensor PS-3220 (the README) for the
    first trial in air of each stated length: the angle of the encoder in steps of 2 pi/2000 rad every
    0.01 s, about 67 s from before the pendulum is lifted until after its release, 6,584 to 6,896 rows.
    The angular velocity, the angular acceleration, and the linear position, velocity, and acceleration
    of the same file are computed by the software from the angle (processed, written beside it); the
    angular velocity is shown to be its difference over five rows of the encoder counts.'
- name: cleaned_data/len1_cond1_1.csv
  type: processed-measured
  description: 'The creators'' cleaned file, written by the record''s process.py: the raw rows 5 s <= t
    < 65 s of len1_cond1_1 (6,000 rows), time shifted to 0, angle and angular velocity unchanged (eleven
    zero angles written as floating-point noise in the raw file appear as 0.000), and the column is_peak
    (115 extremes of |angle| chosen by the script).'
- name: cleaned_data/len<k>_cond1_<t>.csv (k = 1 to 5, t = 2, 3) and cleaned_data/len1_cond3_<t>.csv (t
    = 1 to 3)
  type: processed-measured
  description: 'Added for the M15 lab (Issue #437, phase 2): the creators'' cleaned files of the second
    and third air-only trials of every length, and of the three trials of the shortest length with
    the large paper baffle (damping setting 3). Each is the raw rows 5 s <= t < 65 s of its run (6,000
    rows), time shifted to 0, angle and angular velocity unchanged, checked against the raw file of
    the record for every one of them at inspection (2026-11-12, raw files not committed); the angle
    is a whole number of encoder steps. The baffle adds mass and moment of inertia, so those trials
    are not the same pendulum as the air-only ones (dossier).'
- name: pendulum_length.json
  type: processed-measured
  description: 'The five stated lengths of the pendulum, 0.236, 0.330, 0.426, 0.518, 0.607 m, without
    a definition of the length or an uncertainty.'
- name: reference analysis (pbc.data.reference.xu_pendulum)
  type: modelled-reference
  description: 'Not part of the record: the cycle periods and amplitudes, the small-amplitude period from
    the elliptic-integral correction, the exponential envelope, the effective length g T0^2/(4 pi^2),
    and the line T0^2 = a L + b, computed by this repository and drawn apart from the measured angle.
    The five points deviate from that line by up to 5.75e-3 s^2, more than the uncertainty of the periods
    (below 7e-4 s^2) explains.'
calibration: 'None in the record beyond the sensor''s own conversion of encoder counts to radians (2000
  counts per turn, read from the data: every angle is a whole number of steps of 2 pi/2000 rad, written
  with 3 decimals). The zero of the angle is the encoder position when the recording started, with the
  pendulum hanging at rest; the centre of the swing lies within 0.01 rad of it. The lengths are stated
  without saying from where to where they are measured; the period defines an effective length (dossier).
  No correction is applied to the data; the analysis corrects the period for amplitude.'
schema: 'Raw files: CSV, UTF-8 with a byte-order mark, 7 quoted columns "Time (s) Run #1", "Angle (rad)
  Run #1", "Angular Velocity (rad/s) Run #1", "Angular Acceleration (rad/s²) Run #1", "Position (m)
  Run #1", "Velocity (m/s) Run #1", "Acceleration (m/s²) Run #1"; numbers with 3 or 4 decimals, a few
  in scientific notation. Cleaned file: CSV with the header time,angle,angular_velocity,is_peak. pendulum_length.json:
  the lengths as listData and dictData (keys len1 to len5). File names len<length>_cond<damping>_<trial>:
  damping 1 air only, 2 a small paper baffle, 3 a large paper baffle (README).'
units: 'Time in s, angle in rad, angular velocity in rad/s, angular acceleration in rad/s^2 (the header
  names); position in m, velocity in m/s, acceleration in m/s^2 of a linear conversion by a pulley radius
  of about 23.9 mm (a software setting, not a length of the pendulum, not used); lengths in m; is_peak
  0 or 1. The README gives g = 9.799 m/s^2 ("about") at 37 deg 16'' 15.16" N, 76 deg 42'' 26.66" W.'
cadence: 'Uniform, 0.01 s between rows in every file, from t = 0; 65.83 to 68.95 s per raw file; the
  cleaned file 0.00 to 59.99 s.'
coordinates: 'One rotation angle about the pivot, positive in the sense the encoder counts (the sense
  in which the pendulum was lifted is not stated); the release is the largest |angle| of each file, 2.42
  to 3.06 s after the start. Five lengths, one damping setting (air only), the first of three trials each.'
masks: 'No missing angle or position. The angular velocity and the linear velocity are empty in the first
  and last row, the accelerations in the first two and last three rows, as their numerical derivatives
  are. No flag. The lifting by hand before the release and the first cycle after it are not used by the
  analysis.'
uncertainty: 'None in the record. Derived (dossier): the encoder step 3.1 mrad (0.18 deg), rounded to 1
  mrad; per cycle a scatter of 0.7 to 1.4 ms in the small-amplitude period, so a standard error of 0.09
  to 0.22 ms for a run''s mean over 39 to 62 cycles. The three trials of one length in air differ by
  0.35 to 1.5 ms (files outside the sample), far more than these standard errors, so the trial spread
  is the uncertainty of a period. The corrected period still varies with amplitude by -0.17 to +0.41
  ms per degree, without a common sign. The lengths have no stated uncertainty; their
  effective lengths exceed them by 3.9 to 9.8 mm.'
size:
  description: 'The record: 45 raw files of 0.31 to 0.44 MB (14.5 MB), 45 cleaned files of about 125
    kB (5.6 MB), 45 plots, the scripts, the README, and the licence. The sample: 5 raw files, 14 cleaned
    files (one of phase 1, thirteen added for the M15 lab), the lengths, and the licence, 3,364,277 bytes.'
format: CSV and JSON, read from the repository's raw files at a pinned commit
reader: pbc.data.reference.xu_pendulum.load (the csv and json modules of the standard library, NumPy);
  no new dependency.
