estimates:
  runtime: 'Reference figure: about 2.2 s with the interpreter start (it also reads the piv-cylinder-wake
    sample for the PIV point). The one-time extraction: about 3 s, outside the build.'
  memory: About 195 MB peak resident for the figure.
  page_payload: 1.09 MB committed, read at build time and not shipped; a figure PNG of about 230 KB at
    150 dpi.
  ci: 'Offline: two committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: all ten, SHA-256 equal to Mendeley Data''s; plain text, 131,072 samples at
    1000 Hz each; time and velocity as the record describes.'
  - 'A sample of 1.09 MB, written by a checksum-pinned script: 16.4 s of each run; the shedding peak is
    clear in every run (24 to 135 Hz) and within 1 % of that of the full series.'
  - 'Strouhal numbers 0.2125 to 0.2412 at Re 8.3 x 10^3 to 5.2 x 10^4, grouped by the blockage of the
    channel (0.13 to 0.26) rather than by Re; the record''s Re of one run is inconsistent with its own
    D and U and is recomputed, said so.'
  - 'Used beside piv-cylinder-wake, as the Issue requires: it adds the Strouhal number over a range of
    Re and blockage; it has no velocity field, so no vorticity or streamlines.'
  - CC BY 4.0 on the record; local download, subsets, figures, and modification permitted with attribution
    and the changes indicated.
  - 'Recorded by F53 (Issue #454) under the owner''s approval of 2026-11-09 on the Issue (dataset B, a
    separate yes): a go judged per dossier, with every requirement of ADR 007 checked in the dossier.'
dossier: docs/datasets/ost-hotwire-cylinder-wakes.md
