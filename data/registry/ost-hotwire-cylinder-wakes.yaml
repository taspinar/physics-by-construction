    Changed by this project: the first 16,384 of 131,072 samples of each run, the velocity rounded to
    0.001 m/s, the ten runs in one CSV, the time column replaced by the row number; the run parameters
    copied from the record''s file descriptions. Spectra and Strouhal numbers are this project''s processing.'
artifacts:
- name: Velocity_1C25_5ms-1.txt to Velocity_1C50_16ms.txt (ten files)
  type: processed-measured
  description: 'One run each: time [s] and velocity [m/s] of a single hot wire (DANTEC StreamLine, 16-bit
    A/D board NI 9215-A, StreamWare 3.4), 131,072 samples at 1000 Hz after a 300 Hz low-pass filter, plain
    text, two columns in E-notation with 8 significant digits, CRLF. The velocity is the anemometer''s
    calibrated output, so processed, not the raw bridge voltage. Not committed: 4,456,448 bytes each.'
- name: ost_hotwire_16s.csv
  type: processed-measured
  description: 'The first 16,384 samples (16.384 s) of each of the ten runs, one column per run, the velocity
    rounded to 0.001 m/s, written by tools/datasets/ost_hotwire_extract.py. No filtering or resampling.'
- name: runs.csv
  type: processed-measured
  description: 'For each run, the file, its SHA-256, the cylinder diameter [mm], the reference velocity
    [m/s] from a Pitot tube, the Reynolds number, the aspect ratio L/D, and the probe position x/D downstream
    and w/D across, as the record''s description of each file states them (decimal commas read as points).'
- name: Roshko's Strouhal-Reynolds correlation
  type: modelled-reference
  description: 'St = 0.212 - 2.7 / Re for 200 <= Re < 2000 (Roshko 1954), drawn in the reference figure
    beside the PIV wake of piv-cylinder-wake; it does not cover these runs and is not compared with them.'
calibration: 'Record: the reference velocity from a Pitot tube fixed before the test section; the hot
  wire''s velocity calibration, its uncertainty, and the temperature are not given ("air, at room temperature").
  The channel: acrylic, 0.147 m high and 0.193 m wide, turbulence intensity about 1 %. The cylinders
  span the height (L/D = 5.82, 4.56, 2.92 give L = 146 mm), so the blockage D/W is 0.130, 0.166, and 0.259;
  no correction for it is applied by the record or here.'
schema: 'Record: per file, 131,072 lines "   t   u" (two space-separated E-notation numbers, CRLF). Sample:
  ost_hotwire_16s.csv with three comment lines (the record and licence, the extraction, the time and the
  units), a header of the ten run names, and 16,384 rows of ten values with three decimals; runs.csv with
  the header run,file,sha256,diameter_mm,velocity_m_s,reynolds_record,aspect_ratio,x_over_d,w_over_d
  and ten rows.'
units: 'Velocity m/s; row k of the sample is the time k ms; diameter mm; reference velocity m/s; Re,
  L/D, x/D, w/D dimensionless.'
cadence: '1000 Hz, 131,072 samples, 131.072 s per run (record); the record''s time column is k / 1000
  s printed to 8 significant digits (within 1e-5 s); the sample keeps samples 0-16,383. Shedding at 24
  to 135 Hz is sampled 7 to 41 times per period, below the 300 Hz filter.'
coordinates: 'The probe is downstream of the cylinder axis by x/D and across it by w/D (1.19 and 2.9 for
  D = 25.1 mm, 1.64 and 2.65 for 32 mm, 0.9 and 1.24 for 50 mm); the record does not define the origin
  of w or its side. The mean speed at the probe is 1.05 to 1.50 times the reference velocity: the probe
  sees the accelerated flow beside the near wake, not the wake axis.'
masks: 'None: no missing value, every velocity positive and finite (a single wire measures speed, so
  reversed flow is not seen as negative). The record states Re = 5.17 x 10^4 for Velocity_1C50_5ms.txt,
  the value of the 16 m/s run of that cylinder; U D / Re of the other nine runs gives one viscosity (1.543
  x 10^-5 m^2/s, within 1.2 %) and that run 3.2 times less. runs.csv copies the record; the analysis uses
  U D / nu with the median nu, 1.64 x 10^4 for that run.'
uncertainty: 'The record gives none. Derived (dossier): the peak of each run''s spectrum, with the standard
  error of four 4.1 s blocks of 0.02 to 0.21 Hz; across eight 16.4 s segments of the full record the peak
  moves by 0.06 to 0.56 Hz (standard deviation), and the sample''s peak differs from that of the full
  131 s series by at most 0.71 Hz (1.0 %). St from 0.2125 to 0.2412; the blockage raises it (every 50
  mm run above every 25.1 mm run), and the reference velocity''s uncertainty is not stated.'
size:
  description: 'Ten files of 4,456,448 bytes, 44,564,480 bytes in all. The committed sample: ost_hotwire_16s.csv
    1,087,139 bytes and runs.csv 1,364 bytes; 1,088,503 bytes in all.'
format: Plain text (two columns, E-notation); the sample CSV.
reader: 'Record: numpy.loadtxt in tools/datasets/ost_hotwire_extract.py, outside the build, on the ten
  files pinned by SHA-256; output sha256 551871f95aa42c10153568444695c19334e78a2332329aa89e0e8e5c70162754
  (ost_hotwire_16s.csv) and 573b0d40a6d59a4c56e1783603b3dde2a5ccd760ae34381bfe36bf2f3ab93b72 (runs.csv).
  Sample: pbc.data.reference.ost_hotwire.load (csv, numpy.loadtxt). No new dependency.'
