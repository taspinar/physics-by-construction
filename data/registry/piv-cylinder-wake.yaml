estimates:
  runtime: 'Reference figure: about 2.4 s with the interpreter start. The one-time extraction: about 10
    s (with the hashing of 1.1 GB), outside the build.'
  memory: About 235 MB peak resident for the figure; about 1.8 GB for the extraction.
  page_payload: 1.67 MB committed, read at build time and not shipped; a figure PNG of about 480 KB at
    150 dpi.
  ci: 'Offline: six committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: cylinder_vel.mat, 1,082,404,799 bytes, MD5 equal to Zenodo''s, MAT 5.0 read
    by scipy.io.loadmat (no h5py); u, v, x, y as the record describes; zeros as masks (3.4 % of the values).'
  - 'A sample of 1.67 MB under the caps, written by a checksum-pinned script: 60 frames of the near wake
    with an explicit mask, the time mean, and two probe series of 400 s; the same bytes on each run.'
  - 'The record''s result reproduced: v on the wake axis sheds at 0.8887 +- 0.0028 Hz against the paper''s
    0.889 Hz, u at twice that; St = 0.194 with the paper''s D = 9.5 mm and U = 4.35 cm/s, 5.5 % below Roshko''s
    0.2055 for long cylinders at Re = 413 (a finite cylinder, its plane at mid-span).'
  - 'Stated as limits: D, U, and the cylinder''s position are not in the record (D and U from the paper,
    the position estimated from the mask); no PIV uncertainty is given; the vorticity is derived, not measured.'
  - CC BY 4.0 on the record; local download, subsets, figures, and modification permitted with attribution
    and the changes indicated.
  - 'Recorded by F53 (Issue #454) under the owner''s approval of 2026-11-09 on the Issue: work towards
    a go, judged per dossier, with every requirement of ADR 007 checked in the dossier.'
