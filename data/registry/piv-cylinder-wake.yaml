    and spectra are this project''s processing.'
artifacts:
- name: cylinder_vel.mat
  type: processed-measured
  description: 'Velocity fields u and v [m/s] on a 135 x 80 grid x, y [m] (1.05035 mm apart) for 8000
    frames at 20 Hz, MAT 5.0 (four double arrays u, v of 135 x 80 x 8000 and x, y of 135 x 80). Computed
    by LaVision DaVis 8.1.2 from planar PIV image pairs by cross-correlation (four passes, final windows
    of 32 x 32 pixels with 50 % overlap, per the paper): processed measurements, not raw images, which
    the record does not contain. Exact zeros of u and v mark the cylinder and the shadows it casts in the
    laser sheet (record). Not committed: 1,082,404,799 bytes.'
- name: wake_u.npy, wake_v.npy, wake_mask.npy
  type: processed-measured
  description: 'Frames 0-59 (3 s) of u and v on the record''s grid points with x from -58.0 to +5.0 mm
    and y from -51.4 to -4.1 mm (61 x 46 points), as float32 (the record''s doubles rounded, at most 6e-8
    relative), index order [frame, y, x] with x and y increasing; and the mask, True where u and v are
    both exactly 0. Written by tools/datasets/cylinder_wake_extract.py; no value is interpolated or filtered.'
- name: wake_mean.npy
  type: processed-measured
  description: 'The mean of u and of v over the frames of all 8000 in which the point is not masked (at
    least 7,105 frames where any is), on the crop''s grid; NaN at the 260 points masked in every frame.
    Computed by tools/datasets/cylinder_wake_extract.py; a time average, not in the record.'
- name: probes.npy
  type: processed-measured
  description: 'u and v at two grid points of the record on the wake axis (y = -27.2 mm; x = -24.4 and
    +4.0 mm, about 2 D and 5 D behind the centre of the cylinder''s shadow) for all 8000 frames (400 s),
    float32, index order [frame, probe, component]; never masked. For the spectrum.'
- name: wake_meta.json
  type: processed-measured
  description: The grid (x and y of the crop in m, the record's values), the crop and probe indices in
    the record, the frames, the cadence, the units, the layout, the mask's definition, and the record's
    file with its size, MD5, and SHA-256.
- name: Roshko's Strouhal-Reynolds correlation
  type: modelled-reference
  description: 'St = 0.212 - 2.7 / Re for 200 <= Re < 2000 (Roshko 1954, long cylinders in air), evaluated
    by pbc.data.reference.cylinder_wake.roshko; a comparison, not part of the record.'
calibration: 'Not in the record. The paper (Section 4.1) gives the experiment: a recirculating free-surface
  water channel, an anodised aluminium cylinder of D = 9.5 mm and L = 260 mm suspended vertically with
  a gap of 1-2 mm to the floor, free stream 4.35 cm/s, Re = 413, a Nd:YAG laser sheet at mid-span imaged
  from below by a LaVision Imager sCMOS, 8000 image pairs 8000 µs apart at 20 Hz, hollow ceramic spheres
  of 10 µm, DaVis 8.1.2 with passes of 128, 64, and twice 32 pixels at 50 % overlap, giving 135 x 80 vectors
  and a cylinder of about 128 pixels. It gives no PIV uncertainty, no spatial calibration (the record''s
  grid in m is the calibration), and no water temperature. D and U are not in the record.'
schema: 'MAT 5.0 (header "MATLAB 5.0 MAT-file, Platform: MACI64, Created on: Fri Jun 19 14:16:37 2026"),
  four double arrays: u, v of 135 x 80 x 8000 [grid i, grid j, frame], x, y of 135 x 80; x decreases along
  i (from 82.8 to -58.0 mm), y increases along j (from -67.1 to 15.9 mm). Sample: NumPy .npy (format 1.0,
  no Python objects) float32 u, v and bool mask of shape (60, 46, 61) [frame, y, x]; float32 mean (2,
  46, 61) [u or v, y, x]; float32 probes (8000, 2, 2) [frame, probe 2D or 5D, u or v]; JSON metadata.'
units: 'u, v: m/s; x, y: m; frame: 1/20 s; the velocity in the sample also in m/s. Vorticity (derived):
  1/s.'
cadence: '20 Hz, 8000 frames, 400 s (record: "The frequency of the dataset is 20 Hz"; the paper: 8000
  image pairs at 20 Hz, 8000 µs between the two images of a pair). The record holds no time vector; frame
  k is at k / 20 s. The shedding frequency, 0.889 Hz, is sampled 22.5 times per period.'
coordinates: 'The record''s x and y in m, x along the flow (u > 0 is downstream; the record''s x decreases
  along its first index, the sample is reordered so that x increases), y across it; origin not documented.
  The cylinder''s position is not given: the column of the mask below it is centred at x = -43.3 mm (the
  shadow cast in -y keeps the cylinder''s x extent) and the wake axis, where v fluctuates most from 2
  D to 13 D downstream, is at y = -27.2 mm. The plane is at mid-span of a finite cylinder.'
masks: 'Exact zeros of u and v: the cylinder and its laser shadows (record). In the whole record 3.4 %
  of the values are zero in both components (365 to 374 of the 10,800 points per frame; 365 points in
  every frame, 179 others in some frames, 47 of them more than two grid points from the shadows). One component alone is
  zero in 2.9e-6 of the values: not a mask, kept as data. In the crop 260 to 263 of 2,806 points per frame
  are masked, 260 of them in every frame. No NaN.'
uncertainty: 'The record and the paper give no PIV uncertainty. Derived (dossier): the shedding frequency
  of v on the wake axis is 0.8887 +- 0.0028 Hz (mean and standard error of four 100 s blocks) at 2 D
  and 0.8881 +- 0.0027 Hz at 5 D, against the paper''s 0.889 Hz; the Welch peak of the whole series is
  0.891 Hz. St = 0.1941 with the paper''s D and U, whose own uncertainty is not stated; the free stream
  in the crop''s top row is 4.52 cm/s, 4 % above the paper''s 4.35 cm/s (blockage and a top row 2.2 D from
  the axis). The vorticity is derived by central differences on a 1.05 mm grid and is noisy next to the
  mask, where single vectors are spurious; it is not a measurement.'
size:
  description: 'cylinder_vel.mat: 1,082,404,799 bytes. The committed sample: wake_u.npy and wake_v.npy
    673,568 bytes each, wake_mask.npy 168,488, wake_mean.npy 22,576, probes.npy 128,128, wake_meta.json
    3,681; 1,669,009 bytes in all.'
format: MATLAB MAT 5.0 (not v7.3); the sample NumPy .npy arrays and a JSON file.
reader: 'MAT: scipy.io.loadmat (SciPy, already locked) in pbc.data.reference.cylinder_wake.read_mat, used
  only by the one-time extraction tools/datasets/cylinder_wake_extract.py, outside the build, on the file
  pinned by MD5 4cc876439c48f7970afa477ea17d217a and SHA-256 328cd8d17cd2eb42faef6e4766bc8e515e0eac06868152972adab9bdf91926e7
  (about 10 s and 1.8 GB of memory); no h5py. Sample: pbc.data.reference.cylinder_wake.load (numpy.load
  without pickle, json). No new dependency.'
