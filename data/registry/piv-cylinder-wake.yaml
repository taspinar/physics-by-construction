id: piv-cylinder-wake
title: Particle image velocimetry of flow past a cylinder at Re = 413 (Shang and Tu); a crop of the near
  wake, its time mean, and two probe series extracted by this project
source:
  url: https://zenodo.org/records/20765567
  doi: 10.5281/zenodo.20765567
  creator: Jessica Shang (University of Rochester), Jonathan Tu (Pacific Northwest National Laboratory)
  version: 'Zenodo record 20765567, published 2026-06-19, no version label; one file cylinder_vel.mat
    (MAT 5.0, created 2026-06-19). The experiment is described in Tu, Rowley, Kutz and Shang, Exp. Fluids
    55, 1805 (2014), doi 10.1007/s00348-014-1805-6 (accepted text arXiv 1401.7047, Section 4.1, read
    2026-11-09); the record also names Phys. Rev. Fluids 5, 054401.'
  accessed: &accessed 2026-11-09
