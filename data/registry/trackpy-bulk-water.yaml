  date: *accessed
  reasons:
  - 'Real files inspected: frames 000-039 at commit 09fb3074, all 41 git blob SHA-1s matching GitHub''s
    tree; sha256 recorded; 640 x 424 RGBA, the green channel used.'
  - 'The project''s own tracking (NumPy, SciPy; disclosed as processing, repeated by the build on the
    green channel of the three committed frames): 582-603 features per frame, 596 tracks of at least 15 frames, a drift of
    0.55 µm/s subtracted; D = 0.403 +- 0.010 µm^2/s (bootstrap), with about +-0.02 from the processing
    choices, against A/4 = 0.401 of the trackpy walkthrough notebook (300 frames) and Stokes-Einstein
    0.429 (20 °C) and 0.491 (25 °C).'
  - 'Not documented, and stated as such: the temperature, the exposure time, the sphere size tolerance,
    the depth, and the compression of the video; the comparison with Stokes-Einstein is therefore no
    better than about 15 %, and the negative MSD intercept and the non-Gaussian steps are reported, not
    explained.'
