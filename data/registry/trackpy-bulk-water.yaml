    not the provider''s.'
artifacts:
- name: bulk_water_000.png to bulk_water_039.png
  type: raw-measured
  description: 'Video frames of 1 µm charge-stabilised latex spheres diffusing in water, recorded at 24
    frames per second with 2.85 pixels per µm (README); PNG, 640 x 424 pixels, RGBA with 8 bits per channel
    and alpha 255 everywhere, the spheres dark on a bright field, tinted rather than grey (in frame 000
    the green channel spans 94-142 grey levels). Not committed: the repository holds no image file outside
    site/assets/ (invariant I6); their green channel is (next artifact).'
- name: bulk_water_green_000-002.npy
  type: raw-measured
  description: 'The green channel of frames 000-002, the grey levels of the PNGs unchanged, as a NumPy
    array of shape (3, 424, 640) and type uint8, written by tools/datasets/bulk_water_tracks.py; one channel
    of three is selected, no value changed. The build repeats the tracking of these frames on it.'
- name: README
  type: raw-measured
  description: The provider's two-line description of the recording (the spheres, the frame rate, the
    scale), committed unmodified.
- name: bulk_water_tracks.csv
  type: processed-measured
  description: 'The project''s tracking of frames 000-039 by tools/datasets/bulk_water_tracks.py with
    pbc.data.tracking (band-pass, maxima, centroid, mass cut, mutual-nearest-neighbour linking; not trackpy):
    every located feature with its frame, track number, position in pixels, and mass. The drift subtraction,
    the selection of tracks, and the MSD fit of the reference figure are computed by pbc.data.reference.trackpy_bulk_water,
    are not part of the record, and are drawn apart from the measurement.'
calibration: 'Scale and time from the provider''s README only: "1 micron = 2.85 pixels" and "24 frames
  per second"; no uncertainty, no objective, exposure time, temperature, sample depth, or sphere size
  tolerance is given. The scale enters D squared: a 1 % error of 2.85 px/µm is a 2 % error of D. The frames
  show the edges of 8 x 8 pixel compression blocks (the step between neighbouring pixels across a block
  edge is 1.4 to 1.7 times that inside), so the video was block-compressed before the PNGs were written;
  the record does not say how.'
schema: 'Frames: PNG, 640 x 424 x 4 (RGBA, 8 bits); the analysis reads the green channel, as trackpy''s
  walkthrough notebook does. Committed frames: .npy (NumPy format 1.0), uint8, shape (3, 424, 640), index
  order frame, row (y), column (x). Tracks: CSV with four comment lines (the source commit, the pin of the frames,
  the processing and its parameters, the units) and the header frame,particle,x,y,mass; 23,685 rows,
  one per located feature, in frame order and, within a frame, in the row-major order of the peaks.'
units: 'frame: integer, 0-39, 1/24 s apart; particle: integer track number, numbered in order of appearance;
  x, y: pixels from the centre of the top-left pixel, x to the right, y downwards (1 µm = 2.85 px); mass:
  grey levels of the band-passed, inverted green channel summed over a disk of radius 5 px.'
cadence: 24 frames per second (README); 40 frames, 1.625 s from the first to the last. Every frame has
  582 to 603 features; a track occupies consecutive frames (no memory in the linking).
coordinates: Image coordinates in pixels, origin at the centre of the top-left pixel, y downwards. The
  field is 224.6 x 148.8 µm; the depth of the focal plane in the sample is not documented.
masks: 'No missing values: every frame is complete and every CSV row finite. Features are kept at least
  5 px (the disk radius) from the border, with mass >= 90 (the minimum of the mass histogram of frame 000
  between the noise peaks and the particles). Of 1,268 tracks, the reference analysis uses the 596 of
  at least 15 frames (21,200 features).'
uncertainty: 'The record gives none. Derived (dossier): D = 0.403 +- 0.010 µm^2/s, the standard deviation
  of a bootstrap over tracks (statistical); the processing choices move D between 0.377 and 0.411 (the
  link range, the mass cut, the track length, the lag range), about +-0.02 systematic, and without the
  drift subtraction it would be 0.438. The MSD line has the intercept -0.036 +- 0.003 µm^2, more negative
  than motion blur over a whole frame can make it (-0.022), and successive steps are correlated (+0.14):
  the short-lag MSD is not explained, so D is quoted from the slope with that caveat. The steps are not
  Gaussian (excess kurtosis 3.2) and the step variances of the tracks spread twice as much as for identical
  walkers: the particles are not all alike.'
size:
  description: 'Frames 000-039: 7,602,501 bytes (300 frames in the directory: 60,484,319 bytes). The committed
    sample: the tracks CSV 667,420 bytes, the green channel of frames 000-002 814,208 bytes, README
    119 bytes; 1,481,747 bytes in all.'
format: PNG (RGBA, 8 bits per channel); the committed frames are a NumPy .npy array, the tracks CSV, the
  README plain text.
reader: 'PNG: matplotlib.image.imread (Pillow, already locked as a dependency of matplotlib), in pbc.data.reference.trackpy_bulk_water.read_frame,
  used only by the one-time tracking: tools/datasets/bulk_water_tracks.py, outside the build, on frames
  pinned by sha256 in the script; output sha256 e676e8bb6ab18a48c789dfc0444bf0a716ae13b3548d75d32f03c3b74d88d586
  (CSV) and 2e0c8355f5426c1fc23a23da8bc6f3a215747a8eee65faf5f16cf7d320feb6b7 (npy). CSV: pbc.data.reference.trackpy_bulk_water.read_tracks
  (NumPy); npy: read_frames (numpy.load without pickle). No new dependency.'
