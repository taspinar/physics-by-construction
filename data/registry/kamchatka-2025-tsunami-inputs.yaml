artifacts:
- name: dart21416_20250727to20250803_meter.txt, dart21415_20250727to20250803_meter.txt
  type: processed-measured
  description: 'NCEI event files: the bottom-pressure record as a height of the water column, NCEI''s
    tide fit, and the residual (height minus tide), at 15-minute, 1-minute and 15-second cadence. The
    heights are NDBC''s heights multiplied a second time by 0.670 (see calibration). Committed byte for
    byte.'
- name: 21416t2025.txt.gz, 21415t2025.txt.gz
  type: processed-measured
  description: 'NDBC annual DART files for 2025: the height of the water column in metres from the bottom
    pressure (670 mm per psia), with the record type (1: 15-minute, 2: 1-minute, 3: 15-second). Committed
    byte for byte.'
- name: DART_deployment_coord.txt
  type: processed-measured
  description: 'NCEI''s list of the 26 DART deployments of the event directory: position and depth of
    each station. Committed byte for byte.'
- name: complete_inversion.fsp, surface_deformation.disp
  type: modelled-reference
  description: 'The USGS finite-fault model (three segments, 465 subfaults; slip, rake, rupture time,
    rise time, moment) inverted from teleseismic body and surface waves, GNSS and InSAR (its data table
    lists no DART record), and the surface displacement it predicts on a 40 x 40 grid. Committed byte
    for byte.'
- name: etopo2022_60s_bed_35N60N_140E180E_stride4.npy
  type: processed-measured
  description: 'ETOPO 2022 bathymetry and topography (a compilation; its ocean layer is GEBCO_2022 per
    the research of 2026-11-08), every fourth 60" cell from 35N to 60N and 140E to 180E, rounded to the metre, int16; converted
    by tools/datasets/etopo_ascii_to_npy.py.'
- name: corrected residuals, conversion ratios, peaks
  type: processed-measured
  description: 'Computed by pbc.data.reference.kamchatka_tsunami: the NCEI residual divided by 0.670;
    NCEI height over NDBC height at matched timestamps; peak heights and times. Not part of the records.'
- name: sqrt(gh) arrival estimates
  type: modelled-reference
  description: 'Long-wave travel times integrated along great circles over the ETOPO crop, from the
    epicentre and from the nearest USGS uplift of at least 0.5, 1 or 2 m; computed by pbc.data.reference.kamchatka_tsunami.
    A check of the time window, not the propagation model of the capstone.'
calibration: 'DART: the bottom-pressure recorder''s pressure is converted by NDBC to a height of the water
  column at 670 mm per psia (the NDBC height''s mean over 2025-07-27 to 07-31 equals the station depth:
  5788.70 m against 5788 m at 21416, 4720.38 against 4720 at 21415). NCEI''s event files multiply that
  height by 0.670 a second time: NCEI height / NDBC height is 0.670 within 3.6e-6 at all 1697 (21416) and
  1761 (21415) timestamps, and the mean NCEI height is 0.67008 and 0.67005 times the station depth. The
  residual is divided by 0.670 here; the NDBC heights would give the same sea level with an own tide
  fit. No sensor calibration or uncertainty is published with either file. USGS: the finite fault is a
  model, calibrated by its inversion (its fit is not in the sample). ETOPO: heights relative to EGM2008,
  metres; no per-cell uncertainty in the file used.'
schema: 'NCEI event file: whitespace-separated, 11 columns: day of year (decimal), year, month, day, hour,
  minute, second, height, tide, residual, and a column that is 0.000 throughout; 1697 rows (21416), 1761
  rows (21415); 13 and 18 timestamps occur twice with different values (NDBC has two records of two
  types at each of them). NDBC annual file: gzip text, two header lines ''#YY MM DD hh mm ss T HEIGHT''
  and units, then one row per record; 41,133 and 38,784 rows. Deployment list: UTF-8 text, one line per
  deployment: id_deployment - place, latitude, longitude, then in parentheses degrees and minutes and
  the depth. .fsp: SRCMOD-style text, a commented header (event, location, size, mechanism, inversion,
  velocity model) and per segment the columns LAT LON X Y Z SLIP RAKE TRUP RISE SF_MOMENT. .disp: one
  header line, then longitude, latitude, elevation (0), east, north and vertical displacement, 1600 rows
  of a 40 x 40 grid, longitude fastest. ETOPO: .npy, int16, 375 x 600, row 0 southernmost.'
units: 'DART height, tide, residual: m (NCEI''s scaled by 0.670); time: UTC. Deployment list: degrees N,
  degrees E, depth m. .fsp: LAT, LON degrees; X, Y, Z km (Z depth); SLIP m; RAKE degrees; TRUP, RISE s;
  SF_MOMENT N m (their sum, 2.2489e22, equals the header''s Mo 2.2490e22 N m). .disp: degrees, m. ETOPO:
  m, positive up, EGM2008.'
cadence: 'NCEI files: 15 minutes in normal mode, 1 minute and bursts of 15 s in event mode. 21416: 1-minute
  records from 22:00 UTC (-84 min) to +20.6 h, 15-second records from +1.9 to +5.4 min and +17.4 h; 21415:
  15-minute records until +36 min, then 1-minute records to +33.6 h, 15-second records from +103 to +107
  min and at +29.9 h. Both from 2025-07-27 00:00 to 07-31 12:00 UTC, not to 08-03 as the names say. NDBC
  files: the whole of 2025 at 15 minutes (35,040 records each) plus the event-mode records. Fault: rupture
  time and rise time per subfault (s); grids: no time axis.'
coordinates: 'Geographic, WGS 84 (ETOPO states EPSG:4326 and heights on EGM2008). DART 21416 at 48.1258N
  163.3755E, 5788 m; 21415 at 50.1255N 171.8737E, 4720 m (NCEI''s list). ETOPO cell centres lat 35 + (4i
  + 0.5)/60, lon 140 + (4j + 0.5)/60 degrees. The .disp grid is regular in each axis but its steps vary
  slightly (0.3003 to 0.3017 degrees in longitude, 0.1842 to 0.1845 in latitude). Times relative to the
  ComCat origin 2025-07-29 23:24:52.483 UTC (epicentre 52.4948N 160.2395E); the .fsp header gives 23:24:50
  and 52.505N 160.184E.'
masks: 'NDBC: 9999.000 is a missing height (7064 records at 21416, 1803 at 21415; 108 and 100 between
  2025-07-27 and 08-04). NCEI: no missing value; the duplicated timestamps are kept. At 21416 the record
  from +1 to +26 min is dominated by the shaking of the sea floor (excursions to 0.62 m on the corrected
  scale, alternating between samples), not sea level; the analysis searches the tsunami peak after +26
  min. The .disp grid does not reach zero at its edges (up to 1.13 m), so it does not contain the whole
  deformation. ETOPO: no fill value in the crop.'
uncertainty: 'None published per sample. Derived (dossier): the rms of the corrected residual in the
  day before the origin is 0.020 m (21416) and 0.007 m (21415), the floor of the tide fit and the noise;
  NDBC heights are given to 1 mm; the conversion factor is 0.670 within 3.6e-6. Peaks: 21416 0.818 m at
  +32.1 min, 21415 0.352 m at +69.1 min, times to the sample (1 min). The finite fault''s uncertainty is
  not given in the product; the origin time and epicentre differ from ComCat''s by 2.5 s and 4 km. The
  ETOPO depth of the nearest 4'' cell differs from the station depth by 186 m (21416) and 115 m (21415).'
size:
  description: 'NCEI event files 127,275 and 132,075 bytes, deployment list 3,120; NDBC annual files 173,424
    and 169,146 bytes (gzip); USGS .fsp 49,217 and .disp 123,312; the ETOPO ASCII crop 2,463,031 bytes,
    converted to a 450,128-byte .npy. Committed: 1,227,697 bytes in eight files.'
format: Whitespace-separated text (NCEI, USGS), gzip text (NDBC), OPeNDAP ASCII converted to NumPy .npy
  (ETOPO).
reader: 'pbc.data.reference.kamchatka_tsunami: read_ncei, read_ndbc, read_stations, read_fsp, read_disp,
  read_etopo (NumPy, gzip). The ETOPO crop is converted once, outside the build, by tools/datasets/etopo_ascii_to_npy.py
  (input sha256 454b00a5aaaaf4406523e1f39fc38dbd40ea3c6799d5cde209d25b75701bf198 and parsed-array sha256
  8bd4f1e5c02b1a39c7706cf6b1c76771c4bbde2716310e55af0f743978bb719d pinned in the script; output sha256
  27bf15f585aa7289f2eb90624628f4d30601f49a0be4f2dd6c730b9fae5ead93). No new dependency.'
