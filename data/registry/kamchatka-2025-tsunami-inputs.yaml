estimates:
  runtime: Reference figure about 1.8 s with the interpreter start (readers 0.16 s, analysis 0.09 s).
  memory: About 150 MB peak resident for the figure.
  page_payload: 1.23 MB committed, read at build time and not shipped; a figure PNG of about 590 KB
    at 150 dpi.
  ci: 'Offline: eight committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: the two NCEI event files and NCEI''s deployment list, the two NDBC annual
    files, the USGS .fsp and .disp of us6000qw60_1 v5, and the ETOPO 2022 crop (byte-identical over two
    requests), all committed byte for byte except the ETOPO crop, converted by a pinned script.'
  - 'The double conversion is established on the files, not assumed: NCEI height / NDBC height = 0.670
    within 3.6e-6 at every timestamp of both stations; the residuals are divided by 0.670, which gives
    peaks of 0.818 m at +32.1 min (21416) and 0.352 m at +69.1 min (21415).'
  - 'The windows hold the arrivals: long-wave travel times over the ETOPO crop from the nearest USGS
    uplift (26.6 and 60.8 min) precede the half-peak crossings (29.8 and 66.5 min); the finite fault was
    inverted without DART data, so the records stay an independent check for phase 2.'
  - 'Limits stated, not hidden: NCEI files end 2025-07-31 12:00, carry 13 and 18 duplicated timestamps,
    and 21416 is dominated by seafloor shaking until +26 min; no per-sample uncertainty is published;
    the .disp grid is coarse and does not reach zero at its edges; the bathymetry is decimated, not averaged.'
  - 'US-government public domain (NDBC, NCEI, USGS) and CC0 1.0 (ETOPO 2022): all four rights permitted,
    recorded as equivalent permission like the TESS card; attribution and the NWS conditions kept.'
  - 'Recorded by F88 phase 1 (Issue #444) under the owner''s approval of 2026-11-09 on the Issue: work towards
    a go, every requirement of ADR 007 checked in the dossier. Phase 2 starts only on the owner''s word.'
