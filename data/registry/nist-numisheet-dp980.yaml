decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: 1,607 rows over 0 to 1418.0168 s, five finite columns, units from the attributes
    file and checked against the true-stress and true-strain formulas; sha256 equals the record''s.'
  - 'The test reverses the load: tension to the stress maximum, 991 MPa at e = 0.0575, a hold that ends
    at e = 0.0579 (970 MPa), compression to -1007 MPa at e = -0.0004, tension to fracture at e = 0.177;
    the hysteresis loop from the stress maximum back to its strain, closed by a straight segment, encloses
    75.8 MJ/m^3 (the closed integral of S de, positive for its clockwise path).'
  - 'Elastic regime and yield from source-controlled code: E = 196.3 +- 1.1 GPa (192.5 to 198.4 GPa over
    four fit windows), 0.2 % offset yield 775 MPa; the unloading chord, 144 GPa, shows the Bauschinger
    effect.'
  - Uncertainty derived from the extensometer scatter and the fit, because the record gives none per
    point; the stated DIC noise floor and load-cell difference are quoted; calibration documented only
    qualitatively (ASTM E1012 Class 5, ASTM E9) and stated so.
  - NIST data are US-government work (17 U.S.C. 105) with NIST's worldwide grant to print, publish, modify
    and distribute, recorded as equivalent permission under ADR 007 decision 4.
  - 'Recorded by F107 (Issue #421) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go on the strength of the research, with every requirement of ADR 007 checked in the dossier.'
