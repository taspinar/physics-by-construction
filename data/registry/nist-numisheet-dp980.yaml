artifacts:
- name: C00FeDP980Numisheet2020R01T1.424W17.93-S-Stress-Strain.csv
  type: processed-measured
  description: 'Time, engineering strain and stress, true strain and stress of test R01 (DP980, 0 degrees
    to rolling, 1.424 x 17.93 mm). Stress is the mean force of the upper and lower load cells over the
    original area; strain is a virtual extensometer of 23.6 mm gauge length from stereo DIC on the edge
    of the specimen (Correlated Solutions Vic-3D). The true columns are NIST''s ln(1 + e) and S (1 + e),
    valid only while the strain is uniform. NIST: the stress-strain curves are ''provided for reference
    only''. The elastic fit, the 0.2 % offset line, the loop area and the unloading chord are computed
    by pbc.data.reference.nist_numisheet, are not part of the record, and are drawn apart from the measurement.'
- name: C00FeDP980Numisheet2020R01T1.424W17.93-S-Stress-Strain-attributes.csv
  type: processed-measured
  description: NIST's companion file naming the five columns, their units (s, MPa, mm/mm) and descriptions.
calibration: 'Not given as numbers. The report (2020-03-Numisheet2020-tension-compression-summary-final.pdf
  in the record) states the machine alignment met ASTM E1012 Class 5, the protocol and the anti-buckling
  fixture qualify for sheet compression testing under ASTM E9, the DIC stereo calibrations had a stereo
  angle of 22.495 +- 0.005 degrees, and the image scale was 52.6 pixel/mm. It gives no load-cell calibration
  and no extensometer verification. No correction is applied here.'
schema: 'CSV, one header row "Time","Estrain","Estress","Tstrain","Tstress", then 1,607 rows of five numbers;
  the attributes file has the columns Variable, Units, Type, Description, AxisLabel.'
units: 'From the attributes file: Time in s, Estress and Tstress in MPa, Estrain and Tstrain in mm/mm.
  Checked: Tstrain = ln(1 + Estrain) to 5e-16 and Tstress = Estress (1 + Estrain) to 5e-12 (equations
  5 and 6 of the report); tensile stress and strain are positive.'
cadence: 'One row per DIC image pair: 0.25 s apart from 0 to 62.85 s, then 1 s (three gaps of 1.25 to
  1.33 s) to 1418.0168 s, the last row; the report states 4 images/s initially and 1 image/s after yield. 1,607 rows.'
coordinates: 'Uniaxial: y along the tensile axis, the 0-degree (rolling) direction of the sheet; the virtual
  extensometer is centred on the reduced parallel length to within 0.5 mm. Time from the start of image
  acquisition; tested at NCAL between October 2019 and January 2020 (the date of R01 is not in the file).'
masks: 'None: every value finite, no gap marker. The first 10 rows (0 to 2.35 s) precede the force ramp
  (|S| < 1 MPa) and are kept.'
uncertainty: 'None per point in the record. The record states the noise floor of the local DIC strain
  (263 um/m for R01, over a 0.86 mm virtual gauge) and that the two load cells typically differ by less
  than 300 N (half of it, 150 N, is 5.9 MPa over the 25.5 mm^2 section). Derived (dossier): the extensometer
  strain scatters 25 um/m (sd) before the ramp; E = 196.3 +- 1.1 GPa (standard error from the scatter,
  window 100-400 MPa, residual rms 4.4 MPa, the same as 25 um/m times E); over the stress windows 50-300,
  100-300, 100-400 and 150-450 MPa, E ranges from 192.5 to 198.4 GPa, a sensitivity of the fit to the
  window, not a bound on calibration error. Only R01 was inspected, so the repeatability between the
  three repeats is not known here; the load-cell and dimension calibrations are not documented.'
size:
  description: Two files, 131,777 bytes and 265 bytes (the record holds 239 files, mostly multi-MB DIC
    strain profiles); the sample is those two files.
format: CSV (plain text)
reader: pbc.data.reference.nist_numisheet.read_stress_strain and read_attributes (the csv module of the
  standard library and NumPy); no new dependency.
