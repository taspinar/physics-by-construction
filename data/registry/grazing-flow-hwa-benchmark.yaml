estimates:
  runtime: Reference figure about 2.3 s with the interpreter start.
  memory: About 180 MB peak resident for the figure.
  page_payload: 288 KB committed, read at build time and not shipped; a figure PNG of about 300 KB.
  ci: 'Offline: 24 committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: HWA_PROFILES_v2.zip, BL_PARAMETERS.zip, and README.txt, md5s equal to Zenodo''s;
    the 24 CSV files committed unchanged.'
  - 'The record''s traps found and stated: the parameter column x/L is x in metres; no u_tau; the solid-wall
    y fitted to canonical profiles, so the log-law agreement is partly imposed; the Unc. TI columns are
    bounds.'
  - 'Scientific check passed, within those limits: with u_tau from Coles-Fernholz the solid-wall profiles
    follow the log law (kappa 0.387 to 0.421, B 4.48 to 5.39); H 1.33 to 1.36 against 2.591 for Blasius;
    over the porous inserts H rises by 0.05 to 0.06 along 0.067 m and the solid-wall log law no longer
    holds with that u_tau, a limit of the wall-law model that the data show directly.'
  - CC BY 4.0 on the record; local download, subsets, figures, and modification permitted with attribution.
  - 'Recorded by F108 (Issue #441) under the owner''s approval of 2026-11-09 on the Issue: work towards a
    go, judged per dossier, with every requirement of ADR 007 checked in the dossier.'
