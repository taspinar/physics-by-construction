artifacts:
- name: hot-wire time series
  type: raw-measured
  description: 'Sampled at 25.6 kHz for 10 s per point, per the README. Not in the record: only the statistics
    derived from them are published.'
- name: HWA_PROFILES_v2.zip (HWA_PROFILES_v2/HW_<case>.csv)
  type: processed-measured
  description: 'Per case (wall D00 solid, D35 and D45 porous; nominal 15, 20, 25 m/s), five profiles across
    the insert of 43 points each, and an upstream profile of 35 points (HW_UP<speed>.csv): U/Ue, its
    95 per cent half-width, TI in per cent with the bounds of its 95 per cent interval, and Lambda/delta,
    against y/delta. For the solid wall the y were refined by the providers by fitting the profile in
    plus units to canonical profiles (README).'
- name: BL_PARAMETERS.zip (BL_PARAMETERS/BL_<case>.csv)
  type: processed-measured
  description: 'Per profile: x (in metres, under the header x/L), Ue, delta, delta*, theta, H, T_atm,
    p_atm; the liner and the nominal speed on the first row.'
- name: WPS_DATA.zip, the manuscript PDF, the geometry figures
  type: processed-measured
  description: 'Wall-pressure spectra (3.99 MB), the manuscript (4.16 MB, downloaded, not read), and three geometry images. Not used and not committed.'
- name: Coles-Fernholz friction velocity, Blasius profile, log law
  type: modelled-reference
  description: 'u_tau from Cf(Re_theta) of Coles-Fernholz with nu of dry air from the recorded T and p,
    the laminar Blasius layer, and the log law with kappa 0.41, B 5.0, computed by pbc.data.reference.grazing_flow_hwa;
    not part of the record.'
calibration: 'Hot wire: calibration not in the record; the README states a temperature correction (Kanevce
  and Oka, after Bruun 1995) and a robotic traverse of 0.005 mm resolution (height zeroing +-0.0025 mm),
  0.06 mm by hand upstream (+-0.03 mm). The solid-wall y were refined by fitting to canonical profiles,
  so the near-wall position is calibrated against the law of the wall itself.'
schema: 'CSV, comma-separated, CRLF, ASCII. Profiles: header x/L [-], y/delta [-], U/Ue [-], Unc. U/Ue
  [-], TI [%], Unc. TI Upper [%], Unc. TI Lower [%], Lambda/delta [-]; 215 rows per insert case (five
  stations of 43, not sorted by x), 35 rows upstream. Parameters: header x/L [-], Ue [m/s], delta [m],
  delta_star [m], theta [m], H [-], T_atm [K], p_atm [Pa], Liner [mm], Velocity [m/s]; five rows per
  insert case, one upstream; Liner and Velocity only on the first row (Liner -1 upstream).'
units: 'As in the headers, except the parameter column x/L [-], which holds x in metres (-0.033333 ...
  0.033333, that is x/L times L = 0.1 m; the profiles'' x/L is -0.33333 ... 0.33333). The upstream row
  -0.66 is likewise x = -0.66 m, x/L = -6.6. TI in per cent of Ue; the two Unc. TI columns are the bounds
  of the interval, not half-widths.'
cadence: 'Profiles, no time axis. 43 points per insert profile and 35 upstream, spaced logarithmically
  near the wall and linearly beyond (README), from y/delta 0.005 to 0.007 (y+ 5 to 13; 0.021 to 0.026 upstream) to 1.5 to 1.8 (2.5 to 2.9
  upstream).'
coordinates: 'Origin at the wall in the middle of the insert; x streamwise, y away from the wall; profiles
  at x/L = -1/3, -1/6, 0, 1/6, 1/3 (L = 0.1 m) and upstream at x = -0.66 m; the trip 1.4 m upstream of
  the origin (README).'
masks: 'Lambda/delta is empty where the autocorrelation gave no length scale (8 to 12 points per profile,
  near the wall and in the free stream; 14 upstream); every other value is a number. One defect: HW_UPV25.csv gives
  rows 5 and 6 the same y/delta, 0.04139, with U/Ue 0.555 and 0.532 (the hand-driven upstream traverse;
  the record does not say which is right); the analysis keeps both. Liner and Velocity
  are empty after the first row of a parameter file.'
uncertainty: 'Statistical only, from the record: U/Ue +- at most 0.00043 (95 per cent), TI within chi-square
  bounds of at most +-0.001 percentage points. No calibration or probe uncertainty is given. Derived (dossier):
  with u_tau from Coles-Fernholz, the solid-wall log law over 50 < y+ and y < 0.15 delta gives kappa
  0.387 to 0.421 and B 4.48 to 5.39 on 6 to 10 points per profile; that agreement is partly imposed by
  the providers'' fit of y. H of the record: 1.326 to 1.357 (solid), rising over the porous inserts from
  1.33 to 1.36 at x/L = -1/3 to 1.38 to 1.41 at 1/3.'
size:
  description: 'Record: 8 files, 8.50 MB (WPS_DATA.zip 3.99 MB, the manuscript 4.16 MB). Used and committed:
    the 24 CSV files of HWA_PROFILES_v2.zip (121,193 B) and BL_PARAMETERS.zip (6,755 B), 287,592 bytes.'
format: CSV in ZIP archives; the committed samples are the CSV files.
reader: 'pbc.data.reference.grazing_flow_hwa.read_profiles and read_parameters (NumPy, standard library);
  no conversion and no new dependency.'
