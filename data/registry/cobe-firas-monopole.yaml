decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: 43 rows of five columns, 2.27 to 21.33 cm^-1, sha256 recorded; columns 3 to
    5 equal Table 4 of the paper row for row (read from arXiv:astro-ph/9605054 on 2026-11-25).'
  - 'The reference temperature of column 2 is 2.725 K (the header), the later calibration of Fixsen and
    Mather 2002; column 2 is rebuilt from it to within 0.8 kJy/sr with the CODATA 1986 constants.'
  - 'A reproducible figure from source-controlled code: the weighted fit of dT and G to the residuals
    gives chi-square 45.0 for 41 and a weighted rms of 49.2 ppm of the peak of B_nu(2.725 K); the residuals
    are already those of the paper''s fit, so dT and G are close to zero by construction, as the figure
    says.'
  - 'Uncertainty: the diagonal 1-sigma of Table 4; the covariance between frequencies and the systematic
    terms are named in the dossier, not in the file.'
  - 'Rights: public domain under NASA''s policy for mission data (SPD-41; APD Policy-13), LAMBDA''s acknowledgement
    requested; accepted as equivalent-permission by the owner on 2026-11-25 (#619), with LAMBDA''s written
    confirmation requested beside it.'
  - 'Recorded by F155 part 1 (Issue #619) under the owner''s decision of 2026-11-25 on the Issue.'
