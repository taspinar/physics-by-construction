artifacts:
- name: firas_monopole_spec_v1.txt, columns 3 to 5 (residual, sigma, Galaxy)
  type: calibrated-observation
  description: 'Table 4 of Fixsen et al. 1996 as the file gives it: per frequency the residual of the
    calibrated monopole spectrum after the paper''s fit of a temperature shift and a Galactic term (its
    Fig. 5 caption: "I0 - B(T0) - dT dB/dT - G0 g(nu)"), the 1-sigma uncertainty, and the modelled Galactic
    spectrum at the Galactic poles, all in kJy/sr, as integers. The Galaxy column is a model of the paper,
    used as a template.'
- name: firas_monopole_spec_v1.txt, column 2 (monopole)
  type: calibrated-observation
  description: 'The monopole "computed as the sum of a 2.725 K BB spectrum and the residual in column 3"
    (header), in MJy/sr with three decimals; rebuilt here to within 0.8 kJy/sr from B_nu(2.725 K) with
    the CODATA 1986 constants plus column 3 (with the exact SI 2019 constants, to within 7.6 kJy/sr).'
- name: reference analysis (pbc.data.reference.cobe_firas)
  type: modelled-reference
  description: 'Not part of the record: the Planck intensity, its derivative in T, and the weighted
    fit of dT and the Galactic scale to the residual, computed by this repository and drawn apart from
    the measurement.'
reference_temperature:
  value: 2.725
  unit: K
  statement: '"Column 2 = FIRAS monopole spectrum computed as the sum of a 2.725 K BB spectrum and the
    residual in column 3, units = MJy/sr" (header of the file)'
  source: 'The product page https://lambda.gsfc.nasa.gov/product/cobe/firas_monopole_spect.html, read
    2026-11-25: "Subsequent analyses by Mather et al. (1999) and Fixsen et al. (2002) improved the FIRAS
    calibration accuracy and provided a best-estimate for the absolute CMB temperature of 2725 +/- 1 mK";
    the header names Fixsen & Mather 2002, ApJ 581, 817 as its second reference. Not the 2.728 K of the
    1996 paper, against whose fit the residuals of column 3 were taken'
calibration: 'By the FIRAS team before release: the sky spectra calibrated against the external blackbody
  calibrator (Fixsen et al. 1994b, 1996 section 3.4), the monopole separated from the dipole and the Galaxy
  by a fit of spatial templates (1996 section 5), the residual taken after a fit of dT and a Galactic
  term (1996 section 6). The absolute temperature rests on the thermometry of the calibrator; the derived
  columns do not carry it. No calibration is applied here.'
schema: 'Plain ASCII text: 18 comment lines starting with "#" (the references, the five columns and
  their units, the revision history), then 43 rows of five whitespace-separated numbers: wavenumber,
  monopole, residual, uncertainty, Galaxy. Wavenumbers increase; the residual, uncertainty, and Galaxy
  are integers.'
units: 'Wavenumber nu~ in cm^-1 (frequency nu = c nu~); monopole in MJy/sr; residual, 1-sigma uncertainty,
  and Galaxy in kJy/sr (1 Jy = 1e-26 W m^-2 Hz^-1).'
cadence: 'Not a time series. 43 frequencies from 2.27 to 21.33 cm^-1 on a grid of 0.4538 cm^-1 (the
  paper, section 3.3), rounded to 0.01 cm^-1 in the file.'
coordinates: 'The monopole: the isotropic part of the sky spectrum over the whole sky (the paper''s
  fit of spatial templates); the Galaxy column at the Galactic poles.'
masks: 'No missing value and no flag; every uncertainty is positive.'
uncertainty: 'Column 4, 1-sigma per frequency, 10 to 282 kJy/sr, the diagonal only: the paper weights
  with a covariance between frequencies C = sigma sigma'' Q(|nu - nu''|) that its section 3.3 states and
  the file does not carry. Derived (dossier): a weighted fit of dT and G with the diagonal weights gives
  chi-square 45.0 for 41 degrees of freedom and dT = 0.5 +- 8.1 microK (statistical); the paper gives
  chi-square 46/40 with its covariance and a detector-noise part of 10 microK. The systematic terms of
  the paper''s uncertainties (the thermometry, the Galactic model) are not in the file.'
