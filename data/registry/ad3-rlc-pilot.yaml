    run by the supervising agent session
  version: the pilot's live runs of 2026-11-22, run 2 (channel 2 at the L-C node, started 11:55:44 UTC) and
    run 3 (channel 2 at the R-L node, started 12:57:46 UTC), as the physics lab exported them
  accessed: &accessed 2026-11-22
