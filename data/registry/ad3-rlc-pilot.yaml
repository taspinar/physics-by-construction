estimates:
  runtime: 'Reference figure: about 3 s with the interpreter start; the reader parses both sweeps in under
    1 s. The CI replay of the capacitor sweep: under 1 s.'
  memory: About 150 MB peak resident for the figure.
  page_payload: 963 KB committed, none of it sent to a reader's browser; a figure PNG of about 290 KB.
  ci: 'Offline: four committed files; the replay needs no device and no SDK.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: 19 and 13 points of 513 samples, every sample finite and within its input range;
    the realised sample rates are 100 MHz over whole dividers, as the run records state.'
  - The product's evaluator and this module's own reading agree to 1e-9 in the gain, and the recorded adapter
    replays the capacitor sweep to the same points, f0, and Q as the live run (the CI fixture).
  - 'The parts measured apart (sweep rl-node) bring the closed form within 5 % of the measured f0 and Q (45.0
    kHz and 1.50 against 47.0 kHz and 1.55; nominal 50.3 kHz and 3.16); the residuals show the coil''s loss
    growing with the frequency, stated, not fitted away.'
  - 'The owner''s own measurement under CC BY 4.0 by the owner''s decision of 2026-11-22 on Issue #508.'
dossier: docs/datasets/ad3-rlc-pilot.md
reference_module: ad3_rlc_pilot
reference_figure:
  status: processed
  residuals: true
listing:
  name: 'F140 pilot, series RLC on an Analog Discovery 3 (Issue #508)'
  kind: raw oscilloscope traces of a frequency sweep, measured by the project's own live adapter
