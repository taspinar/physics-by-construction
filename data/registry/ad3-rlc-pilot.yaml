artifacts:
- name: raw.csv
  type: raw-measured
  description: Every sample of every acquisition of a sweep, as the physics lab's live mode exported it
    (pbc.products.physics_lab.workflow.write_raw); channel 1 (source) at the generator W1, channel 2 (response)
    at the L-C node (sweep capacitor) or at the R-L node (sweep rl-node), both against ground, in volts
    as the device returned them with its factory calibration. Times are the sample index over the rate the
    device realised.
- name: run.json
  type: processed-measured
  description: The run record of the sweep (device, serial, SDK, calibration statement, configuration, the
    device's temperatures and supply at the start and the end, the declared circuit, units, processing,
    timestamps) with the evaluator's check recomputed from raw.csv (f0, Q, and the comparison with the nominal
    closed form). The check is the lab's processing, not a measurement; the sweep rl-node's check compares
    a node the evaluator does not expect and is not meaningful (dossier). The first two processing lines
    of both records (whole periods; projection by steady_phasor) predate the live mode's fix and do not hold
    for them; every point was read by the least-squares fit (fitted_phasor) of the last processing line (dossier).
calibration: 'The device''s factory calibration, not adjusted (the run record says so). Channel 1 on the
  5 V range (plus or minus 2.5 V), channel 2 on the 50 V range (plus or minus 25 V); the two channels''
  relative gain and phase on these different ranges are not documented in the record and were not measured.
  The parts are nominal (R 100 ohm at 1 %, L 1 mH, C 10 nF, unmeasured tolerances of L and C); L, C, and
  the coil''s loss are derived apart from the sweep rl-node (dossier).'
schema: 'Per sweep, raw.csv: columns point, frequency_hz, amplitude_v, t_s, source_v, response_v; 513 rows
  per point (8 periods at 64 samples per period asked, plus one), points numbered in the order measured
  (13 coarse points log-spaced from 5 kHz to 200 kHz, then up to 6 around the phase crossing). run.json:
  one JSON object with product, protocol, route, status, run (the instrument run record), check, and evidence.'
units: 'Stated in run.json: frequency Hz, amplitude V, time s, source and response V, gain V/V, phase degrees.'
cadence: 'Sweep capacitor: 19 points (13 coarse, 6 refined between 44.9 and 56.0 kHz). Sweep rl-node: 13
  points (no refinement: the phase of the R-L node does not cross -90 degrees). The sample rate is 100 MHz
  over a whole divider, within 0.5 / divider of 64 samples per period (up to 3.4 % at 147 kHz); each acquisition
  starts at least 10 ms after the excitation changed.'
coordinates: 'One breadboard circuit, W1 -> R -> L -> C -> ground, on 2026-11-22 between 11:55 and 12:58
  UTC; device Analog Discovery 3 SN:210415BFB222, WaveForms SDK 3.25.1, USB power only (auxiliary supply
  0.04 V), die temperature 61.6 to 63.7 degrees C.'
masks: 'None: every sample is finite, within the input range, and kept.'
uncertainty: 'None per sample in the record. Derived (dossier): the noise of the phasor fits gives at most
  5e-4 in the gain and 0.26 degrees in the phase per point (one standard deviation). From the sweep rl-node,
  L = 0.861 +- 0.010 mH, C = 14.55 +- 0.15 nF, and a coil loss of 63 +- 3 ohm near the resonance (the
  scatter of the fits with the resistor''s 1 % in quadrature); the loss grows with the frequency, so no constant
  value fits the band. The channel mismatch and the factory calibration error are unknown and not included.'
size:
  description: Four files, 963,298 bytes in all; the sample is the whole record of the two sweeps. A repeat
    of the capacitor sweep (run 1, f0 47,004 Hz, Q 1.542 against 47,009 Hz and 1.549) is not committed.
format: CSV (plain text) and JSON
reader: pbc.data.reference.ad3_rlc_pilot.read_traces and read_run (the csv and json modules of the standard
  library and NumPy); the replay as a recorded sample is pbc.products.physics_lab.workflow.read_export. No
  new dependency.
