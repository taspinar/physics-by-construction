artifacts:
- name: rlc_circuit.json
  type: processed-measured
  description: Impedance spectrum of a custom circuit (2.2 uF foil capacitor parallel to a lossy 5 mH
    inductor), measured galvanostatically with a Biologic VMP300 at 30 mA amplitude and exported by the
    creators' MATLAB package 'Impedance' 0.0.3.dev on 2024-03-06; the step from the recorded voltage and
    current to Z is not documented, so the file counts as processed. The fit of R, L, C that the reference
    figure draws is computed by pbc.data.reference.bayreuth_rlc, is not part of the record, and is drawn
    apart from the measurement as a model.
calibration: 'None documented. The record names the instrument (Biologic VMP300), the mode (galvanostatic),
  the amplitude (30 mA) and the frequency range, and nothing about a calibration, a cable or fixture compensation,
  or the instrument''s accuracy. No correction is applied here; the instrument error is unknown, and
  neither the standard errors of the fit nor the band fits of the dossier bound it.'
schema: 'One JSON object: class_ ''Impedance''; meta_ (date, user, machine, software MATLAB R2020b, package
  Impedance 0.0.3.dev); arrays f, omega, z_real, z_imag, z_modulus, z_phase (numbers) and z (strings
  ''a-bi''), 81 entries each, in descending frequency.'
units: 'Not stated in the file. Inferred and checked: f in Hz (omega equals 2 pi f exactly, in rad/s);
  Z in ohm (|Z| = 9.9 ohm at 100 Hz, as a coil of about 9.7 ohm and 5 mH gives); z_phase
  in radians (equals atan2(z_imag, z_real) to 2e-16); Z = Re Z + j Im Z, Im Z positive for an inductive
  response.'
cadence: One frequency sweep, 81 points log-spaced from 10002.2 Hz down to 99.97 Hz, 40 points per decade
  (step 0.025 in log10 f).
coordinates: Two-terminal impedance of the circuit between its terminals; a single spectrum, recorded
  on or before 2024-03-06 22:24:55 (the export time in meta_; the measurement date is not stated).
masks: 'None: no missing or non-finite value in any array; z_modulus and z_phase agree with z_real and
  z_imag to rounding, the strings z to 6e-5 ohm.'
uncertainty: 'None per point in the record; the components'' factory tolerance is 10 %. Derived (dossier):
  a fit of C parallel to (R + jwL) to the relative complex residual gives R = 9.537 +- 0.021 ohm, L =
  4.849 +- 0.007 mH, C = 2.1832 +- 0.0031 uF (standard errors from the residual scatter, rms 1.1 % per
  component). The residuals are structured (up to 4.3 % near the resonance). As a sensitivity analysis
  of the model fit, separate fits below and above the resonance differ by 0.93 ohm, 0.12 mH, and 0.072
  uF, with resonances of 1539.8 and 1546.1 Hz beside the full fit''s 1546.9 Hz; this is no bound on
  the calibration or instrument error of the record, which is unknown.'
size:
  description: One JSON file of 9,119 bytes (the record holds 14 files, 164 KB in all); the sample is that
    file.
format: JSON (plain text)
reader: pbc.data.reference.bayreuth_rlc.read_impedance (the json module of the standard library and NumPy);
  no new dependency.
