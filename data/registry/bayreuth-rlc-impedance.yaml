  memory: About 160 MB peak resident for the figure.
  page_payload: 9 KB committed; a figure PNG of about 200 KB.
  ci: 'Offline: one committed file.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real file inspected: 81 points from 99.97 Hz to 10,002 Hz, all representations of Z consistent,
    no missing value; md5 equals the record''s.'
  - 'A three-parameter model of the EM5 parallel circuit describes the spectrum to 1.1 % rms: R = 9.54
    ohm, L = 4.849 mH, C = 2.183 uF, within the 10 % tolerance of the nominal 9.7 ohm, 5 mH, 2.2 uF;
    the record''s 9.7 mOhm is a unit typo for 9.7 ohm.'
  - Standard errors derived from the fit, because the record gives no uncertainty; fits of the two
    halves of the band reported as a sensitivity analysis; calibration and instrument error undocumented
    and stated as unknown.
  - CC BY 4.0 on the record covers local download, subsets, figures, and modification.
  - 'Recorded by F86 (Issue #418) under the owner''s decision of 2026-11-08 on the Issue: work towards
    a go on the strength of the research, with every requirement of ADR 007 checked in the dossier.'
