estimates:
  runtime: Reference figure about 2.3 s with the interpreter start.
  memory: About 180 MB peak resident for the figure.
  page_payload: 87 KB committed, read at build time and not shipped; a figure PNG of about 290 KB.
  ci: 'Offline: eight committed files.'
decision:
  value: go
  date: *accessed
  reasons:
  - 'Real files inspected: PIV.zip, PTV.zip, and readme.txt, md5s equal to those 4TU publishes; the eight
    MAT v5 files read by scipy.io.loadmat and committed unchanged.'
  - 'The readme''s errors found and stated: top-level variables, not a struct; PTV y in millimetres, not
    metres; the PIV stresses uu, uv, vv, not uu three times; a DOI placeholder.'
  - 'Scientific check passed: the file''s u_tau within 1.1 per cent of the Coles-Fernholz correlation;
    the log law over 50 < y+ and y < 0.15 delta gives kappa 0.400 to 0.410 and B 4.77 to 5.17, with the
    window sensitivity stated; H 1.33 to 1.37 against 2.591 for the laminar Blasius layer, recomputed
    within 1.5 per cent; -u''v''+ peaks at 0.91 to 0.97, below the wall value 1.'
  - 'Limits stated: no uncertainty in the files; u_tau''s method not in the record, so the log-law constants
    are those of the file''s u_tau; PIV reads up to 7 per cent below PTV near the wall.'
  - CC BY 4.0 on the record; local download, subsets, figures, and modification permitted with attribution.
  - 'Recorded by F108 (Issue #441) under the owner''s approval of 2026-11-09 on the Issue: work towards a
    go, judged per dossier, with every requirement of ADR 007 checked in the dossier.'
