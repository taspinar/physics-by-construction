artifacts:
- name: HWA.zip, Freestream microphone.zip, wall-pressure.zip
  type: raw-measured
  description: 'Hot-wire velocity and pressure time series (5.86 GB, 0.92 GB, 1.19 GB per the record''s
    file list). Not downloaded and not committed: a lab that needs spectra needs its own download and
    inspection.'
- name: PIV.zip (PIV/U05 ... U20/EXPparam.mat)
  type: processed-measured
  description: 'Per case, the wall-normal profiles of the mean streamwise velocity and the Reynolds stresses
    uu, uv, vv that the creators averaged from planar PIV, 493 to 497 points, with U_inf, u_tau, mu,
    rho, delta, delta*, theta, and H. How u_tau and delta were determined is not stated in the record.'
- name: PTV.zip (PTV/U05 ... U20/EXPparam.mat)
  type: processed-measured
  description: 'Per case, the near-wall mean streamwise velocity from PTV, 129 to 134 points from y =
    0.048 mm to about 2.1 mm, with its own U_inf, u_tau, mu, rho. y is in millimetres although the readme
    says metres.'
- name: Blasius profile, log law, Coles-Fernholz skin friction
  type: modelled-reference
  description: 'The laminar Blasius layer (computed by shooting, H = 2.591), the log law with kappa 0.41,
    B 5.0, and Cf(Re_theta) of Coles-Fernholz, computed by pbc.data.reference.tudelft_boundary_layer;
    not part of the record.'
calibration: 'Not in the files. The record gives u_tau per case without its method; it agrees with
  the Coles-Fernholz skin friction at the file''s Re_theta within -1.1 to +1.1 per cent (dossier), so
  it is consistent with an independent correlation. The PIV and PTV calibrations (magnification, time
  between pulses) are in the article (not read), not in the files.'
schema: 'MAT v5 (header ''MATLAB 5.0 MAT-file, Platform: PCWIN64''), top-level double variables, not
  the struct EXPparam that the readme names. PIV: H, Uinf, Utau, delta, deltastar, mu, rho, theta (1x1)
  and y, Ubar, uu, uv, vv (Nx1, N = 496, 496, 497, 493 for U05, U10, U15, U20). PTV: Uinf, Utau, mu, rho
  (1x1) and y, Ubar (Nx1, N = 133, 132, 134, 129). The readme lists the PIV stresses as uu three times;
  the variables are uu, uv, vv.'
units: 'SI as the readme states (m, m/s, m^2/s^2, kg/(m s), kg/m^3), except PTV y, which is in millimetres:
  with y in mm the PTV points below y+ = 5 give U+/y+ - 1 between -0.019 and +0.007, and they continue
  the PIV profile; with y in m they would lie at y+ of 570 and more, where the log law gives U+ above 20, while every PTV U+ is below 18. H dimensionless.'
cadence: 'Profiles, no time axis. PIV y in equal steps of 0.282 to 0.283 mm from 0.47 to 0.73 mm up to
  140 mm (1.28 to 1.30 delta); PTV y unequally spaced from 0.048 mm to 2.08 to 2.16 mm.'
coordinates: 'x streamwise (the profiles are at x = 6.8 m from the record''s description), y wall-normal
  from the wall; one profile per case U05, U10, U15, U20 (nominal free-stream 5, 10, 15, 20 m/s, file U_inf
  4.57, 9.16, 13.73, 18.28 m/s by PIV).'
masks: 'None: no NaN, no fill value in any variable. The PIV profile begins at y+ 9 to 20 (no point in
  the viscous sublayer), and PTV covers y+ 0.6 to 89; -u''v''+ falls to zero above y = delta.'
uncertainty: 'None in the files. Derived (dossier): u_tau of the file within 1.1 per cent of Coles-Fernholz;
  the log-law fit over 50 < y+ and y < 0.15 delta gives kappa 0.400 to 0.410, B 4.77 to 5.17, and over
  15 common windows kappa 0.355 to 0.428 and B 3.0 to 5.5 (the window is the dominant uncertainty); H
  recomputed from the profile (PTV below the first PIV point) within 1.5 per cent of the file''s; PTV
  above PIV by 0.3 to 7 per cent on average where both measure, up to 9.9 per cent at U20 near the wall,
  consistent with the PIV''s spatial averaging over a steep gradient; peak -u''v''+ 0.91 to 0.97.'
size:
  description: 'Record: 6 files, 7.96 GB (HWA.zip 5.86 GB, wall-pressure.zip 1.19 GB, Freestream microphone.zip
    0.92 GB, PIV.zip 78,642 B, PTV.zip 10,144 B, readme.txt 4,016 B). Used and committed: the eight MAT
    files of PIV.zip and PTV.zip, 86,772 bytes.'
format: MAT v5 in ZIP archives; the committed samples are the MAT files.
reader: 'scipy.io.loadmat (MAT v5; ADR 007 addendum of #417), in pbc.data.reference.tudelft_boundary_layer.read_piv
  and read_ptv; no conversion and no new dependency.'
