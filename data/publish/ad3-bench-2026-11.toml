[[replace]]
file = "run.json"
field = ["run", "device", "serial"]
value = "AD3-001"
note = "The device's serial number, replaced by the stable device identifier; the original files are kept unchanged by the owner."

[[replace]]
file = "checkpoints/checkpoint.json"
field = ["bench", "serial"]
value = "AD3-001"
note = "The same replacement in the campaign's checkpoint."

[repository]
files = ["run.json", "measurements.csv", "evidence.json"]

# The raw samples kept for the replay in CI, by a rule that does not depend
# on a result: the first series RLC campaign of 2026-11-26, its
# frequency-response records only (no ring-downs), and both LED-pair runs.
[[repository.raw]]
export = "2026-11-26-series-rlc"
keep = ["frequency-response"]

[[repository.raw]]
export = "2026-11-26-led-pair"

[[repository.raw]]
export = "2026-11-26-led-pair-run2"
