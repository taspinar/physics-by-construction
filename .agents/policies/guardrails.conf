# The merge approval gate: which paths a feature may not change without the
# owner's approval. scripts/check-guardrails.sh reads this file, always from
# the base branch, so a feature cannot relax the rules it is checked by.
#
# Format: one '<kind>: <pathspec> [<pathspec>...]' per line. Git pathspecs.
#
# - protected: a change needs the owner's approval. The pull request is
#   opened, and no script or agent merges it.
# - sensitive: a change is allowed, and the independent reviewer is told to
#   look at it.
# - owner-identity: the one GitHub login of the owner's second identity (ADR
#   020 decision 3), which scripts/merge-feature.sh requires to approve
#   exactly the head of a pull request that needs the owner. It must also be
#   a code owner in .github/CODEOWNERS; no other code owner counts. The owner
#   adds it with the setup of docs/repository-setup.md; until then the line
#   is absent and the script merges no such pull request.
#
# Always protected, whatever this file says: every ADR in docs/decisions, the
# CI workflows, this file, and the scripts, prompts, and schemas that carry
# out the gate. In scripts/verify.conf and scripts/verify-workflow.conf,
# adding a check is sensitive; changing or removing a line is protected.
#
# Add what is fundamental in this project, for example the configuration of
# the site generator, the deployment, or the dependency manifest.

# Physics by Construction, proposed with the sync of 2026-10-10; the owner
# decides this list.
#
# Protected: the Level 3 paths of ADR 020 decision 1, the one list of the
# paths that need the owner's approval (requirements decision 39, "the
# protected paths of guardrails.conf"): the ADRs; the planning documents;
# the CI workflows and the code-owners file; the gate (the workflow scripts,
# their library, the reviewer contract, the schemas, the policies,
# AGENTS.md, the agent configuration, and the script that runs the
# checks); the triage of a review and its application; the four check
# scripts, each the only place where its pass is decided (the Lean proofs,
# the rendered lesson pages, the determinism of the build, and the site the
# end-to-end tests read); the digest, the selection, and the execution
# store; the base and its provenance; the build, and the Lean reader that
# decides whether a proof a page shows was compiled; the agent skills; and
# the approval requests, which the risk level leaves out of the path
# minimum (scripts/lib/risk.sh). The deploy job is part of the CI workflow.
# tests/risk-level-test.sh shows that a change to each of them is reported
# as protected. docs/architecture.md and the prompts other than
# .agents/prompts/reviewer.md are sensitive, not protected (the addendum of
# 2026-11-08 to ADR 020 decision 1, Issue #412). scripts/verify.conf is on
# no line here: the builtin rule above reads it, so an added check is
# sensitive and a changed or removed line protected (D4 of #446; the
# addendum of 2026-11-10 to ADR 020 decision 1, Issue #465).
protected: docs/decisions docs/PROJECT_REQUIREMENTS.md docs/roadmap.md
protected: .github/workflows .github/CODEOWNERS
protected: :(glob)scripts/*-feature.sh :(glob)scripts/*-planning.sh scripts/lib scripts/check-guardrails.sh scripts/check-review.sh scripts/ci-aggregate.sh
protected: .agents/prompts/reviewer.md .agents/schemas .agents/policies AGENTS.md .agents/agents.conf scripts/verify.sh
protected: scripts/triage-review.sh scripts/apply-triage.sh
protected: scripts/check-lean.sh scripts/check-lesson-pages.sh scripts/check-determinism.sh scripts/fetch-built-site.sh
protected: src/pbc/authoring/digest.py src/pbc/authoring/selection.py src/pbc/authoring/store.py
protected: scripts/fetch-base.sh scripts/collect-base.sh src/pbc/authoring/provenance.py
protected: scripts/build-site.sh src/pbc/authoring/lean.py
protected: .agents/skills .agents/approvals

# Sensitive: the reviewer has to look at a change to the site configuration
# and the Python and Lean dependencies. A change to a dependency file is
# also an escalation trigger of the risk level (ADR 020 decision 1), which
# scripts/lib/risk.sh detects on the diff.
sensitive: site/_quarto.yml pyproject.toml uv.lock lean/lakefile.toml lean/lean-toolchain lean/lake-manifest.json
#
# Sensitive by the addendum of 2026-11-08 to ADR 020 decision 1 (Issue
# #412): the architecture document, Level 2 by path (scripts/lib/risk.sh),
# and the prompts, Level 2 by path. The reviewer contract,
# .agents/prompts/reviewer.md, stays protected: the protected line above and
# the builtin list of scripts/lib/guardrails.sh name it, and protected wins.
sensitive: docs/architecture.md .agents/prompts
#
# Sensitive by D7 of the inventory of #446 (Issue #465): code that decides
# part of what a check passes, but that a review of its change catches: the
# evidence map of the claims, the dataset check, the skills check, the
# named checks of the validation contract, the fixtures of the end-to-end
# tests, and the dataset cards. Level 2 by path, as before; the reviewer is
# told to look at a change to them.
sensitive: src/pbc/authoring/evidence.py src/pbc/data/check.py src/pbc/skills.py src/pbc/verification/checks.py tests/e2e/conftest.py data/registry
