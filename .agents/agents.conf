# Agent provider and model per workflow role.
#
# Format: one role per line.
#
#   <role>: <provider> <model>
#
# - <provider> is 'codex' or 'claude'.
# - <model> is passed unchanged to the provider CLI. Use a model your account
#   supports; a rejected model fails the run and is never replaced by another.
# - The --agent and --model options of a workflow script override this file
#   for one run.
#
# Use a different provider for a reviewing role than for the role whose work
# it reviews.

# start-planning.sh, review-planning.sh, revise-planning.sh. The project
# planner is also the planning reviser of revise-planning.sh. All on Opus by
# the owner's rule of 2026-11-13 (no Fable, only Opus; Issue #512). The
# planning reviewer is Claude as well, against the rule above, because the
# planning exceeds Codex's input limit of 1,048,576 characters; its sessions
# are read-only and independent of the planner's.
project-grill: claude opus
project-planner: claude opus
planning-reviewer: claude opus

# start-feature.sh, review-feature.sh
implementer: claude sonnet
reviewer: codex gpt-6-luna

# triage-review.sh, apply-triage.sh
triage: claude sonnet
triage-implementer: claude sonnet
