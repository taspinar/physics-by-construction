# The live campaign of the owner's bench session 1 (F145): the pilot's
# circuit of F140 on the breadboard, both protocols on one wiring.
#
#   uv run --locked python -m pbc.products.physics_lab campaign --mode live \
#       --plan products/physics-lab/examples/live-campaign-series-rlc.toml \
#       --circuit-confirmed --out physics-lab-live-rlc
#
# Wiring: W1 -> 100 ohm -> 1 mH -> node A -> 10 nF -> ground; scope 1+ at
# W1, 2+ at node A, 1- and 2- at ground. Close WaveForms first.

[campaign]
circuit = "series-rlc"
protocols = ["frequency-response", "transient"]
amplitude_v = 1.0
low_hz = 5000.0
high_hz = 200000.0              # the live envelope's top
sweep_points = 13
f0_target = 0.002
square_hz = 1000.0              # the live envelope's lowest frequency
transient_rate_hz = 10000000.0  # 15,001 samples for one and a half periods
ringing_max_hz = 200000.0
min_ringdowns = 5
q_target = 0.02
series_resistance_ohm = 100.0   # 99 ohm at its lower tolerance: 1 V drives at most 10 mA
inductance_h = 0.001            # nominal; F140 measured about 0.86 mH
capacitance_f = 10e-9           # nominal; F140 measured about 14.5 nF
budget = 40

[run]
seed = 0                        # unused by a device

# The bench conditions this campaign records besides the device's own
# monitor (F145 part 3): uncomment and fill in at the bench, or pass
# --plugged-in and --room-temperature; absent ones are "not recorded".
# [bench]
# plugged_in = "2026-11-26T13:10+01:00"
# room_temperature_c = 20.0
